    WebhookInUseErrorResponse:
      title: WebhookInUseErrorResponse
      type: object
      required:
        - success
        - error
        - message
      description: Error returned when a webhook change is rejected because the webhook no longer has the expected URL.
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful. Always `false` for this error.
          example: false
        error:
          type: boolean
          description: Indicates that the request failed. Always `true` for this error.
          example: true
        message:
          type: string
          description: Human-readable description of the conflict.
          example: Webhook already in use
    CallDisposition:
      title: CallDisposition
      enum:
        - answered
        - noanswer
        - busy
        - failed
        - all
      type: string
      description: Final disposition of the call. One of `answered` (the called party answered), `noanswer` (no answer within the ring timeout), `busy` (the called party was busy), `failed` (the call could not be routed), or `all` (matches any disposition when used as a filter).
    CDR:
      title: CDR
      description: Call detail record (CDR) for an individual call.
      required:
        - date
        - from
        - to
        - disposition
        - duration
        - destination
        - per_minute
        - charge
        - uuid
        - call_id
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date-time
          description: Date and time of the call in ISO 8601 format.
          example: '2023-08-21T06:43:36.000Z'
        from:
          type: string
          description: Originating phone number (ANI).
          example: '14302287001'
        to:
          type: string
          description: Destination phone number (DNIS).
          example: '33170363950'
        disposition:
          $ref: '#/components/schemas/CallDisposition'
        duration:
          type: integer
          format: int32
          description: Call duration in seconds.
          example: 6
        destination:
          type: string
          description: |-
            Destination of the call. For outbound calls,
             contains the country name and, optionally, a mobile carrier
              or city name. For inbound calls, includes the SIP trunk name,
               SIP URI, or PSTN number the call is forwarded to.
          example: France
        per_minute:
          type: string
          description: Price per minute in USD.
          example: '0.027'
        charge:
          type: string
          description: Total charge for the call in USD.
          example: '0.822'
        sip_trunk:
          type:
            - string
            - 'null'
          description: System-generated SIP trunk login. For outbound calls only.
          example: '32882'
        forward_fee:
          type: string
          description: PSTN forwarding price in USD. For inbound calls only when forwarded to PSTN.
          example: '0.0'
        uuid:
          type: string
          deprecated: true
          description: Call ID. Deprecated — use `call_id` instead.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        call_id:
          type: string
          description: Call ID. Alias of `uuid`.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        parent_uuid:
          type:
            - string
            - 'null'
          deprecated: true
          description: Parent call ID. Deprecated — use `parent_call_id` instead.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        parent_call_id:
          type:
            - string
            - 'null'
          description: Parent call ID. Alias of `parent_uuid`.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        answered_by:
          type:
            - string
            - 'null'
          description: Who answered the call. Possible values are `human`, `machine`.
          example: human
    CDRListResponse:
      title: CDRListResponse
      required:
        - items
        - pagination
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CDR'
          description: List of CDRs
        pagination:
          $ref: '#/components/schemas/Pagination'
    TranscriptionFilter:
      title: TranscriptionFilter
      type: object
      additionalProperties: false
      properties:
        agent:
          type: object
          description: Search in an agent's spoken words and phrases
          properties:
            must:
              type: array
              items:
                type: string
                example: Hello
              description: Only calls with transcription that includes all of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical AND
              example:
                - Hello
                - Thank you
            match:
              type: array
              items:
                type: string
                example: Nope
              description: Only calls with transcription that includes any of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical OR
              example:
                - Nope
                - Maybe
            exclude:
              type: array
              items:
                type: string
                example: Richard
              description: Only calls with transcription that does not include any of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical OR
              example:
                - Richard
                - Issue resolved
        client:
          type: object
          description: Search in an customer's spoken words and phrases
          properties:
            must:
              type: array
              items:
                type: string
                example: Hello
              description: Only calls with transcription that includes all of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical AND
              example:
                - Hello
                - Thank you
            match:
              type: array
              items:
                type: string
                example: Nope
              description: Only calls with transcription that includes any of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical OR
              example:
                - Nope
                - Maybe
            exclude:
              type: array
              items:
                type: string
                example: Richard
              description: Only calls with transcription that does not include any of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical OR
              example:
                - Richard
                - Issue resolved
        any:
          type: object
          description: Search in both speakers' spoken words and phrases
          properties:
            must:
              type: array
              items:
                type: string
                example: Hello
              description: Only calls with transcription that includes all of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical AND
              example:
                - Hello
                - Thank you
            match:
              type: array
              items:
                type: string
                example: Nope
              description: Only calls with transcription that includes any of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical OR
              example:
                - Nope
                - Maybe
            exclude:
              type: array
              items:
                type: string
                example: Richard
              description: Only calls with transcription that does not include any of the specified keywords and phrases are returned. The listed keywords and phrases are combined using logical OR
              example:
                - Richard
                - Issue resolved
    CDRSearchRequest:
      title: CDRSearchRequest
      required:
        - type
        - from
        - to
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - placed
            - received
          description: Filters by call type. One of `placed` (outbound calls dialed by the account) or `received` (inbound calls answered by the account).
          example: placed
        from:
          type: string
          format: date
          description: Start date for call search in `YYYY-MM-DD` format.
          example: '2023-08-01'
        to:
          type: string
          format: date
          description: End date for call search in `YYYY-MM-DD` format.
          example: '2023-08-31'
        from_search:
          type: string
          description: Originating phone number to filter results. Accepts full or partial number.
          example: '4478012'
        to_search:
          type: string
          description: Destination phone number to filter results. Accepts full or partial number.
          example: '44206723'
        sip_trunk:
          type: string
          description: SIP trunk login to filter outbound calls. Ignored for inbound calls.
          example: '87095'
        min_duration:
          type: integer
          format: int32
          description: Minimum call duration in seconds.
          example: 10
        transcription:
          $ref: '#/components/schemas/TranscriptionFilter'
        uuid:
          type: string
          description: Call ID.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        disposition:
          $ref: '#/components/schemas/CallDisposition'
          description: |
            Call disposition to filter results.  If omitted, returns only answered
             calls. Allowed values: `answered`, `noanswer`, `busy`,
              `failed`, `all`. Use `all` to return calls
               regardless of their disposition.
          type: string
        page:
          type: integer
          format: int32
          description: Page number to retrieve.
          default: 1
          example: 1
        per_page:
          type: integer
          format: int32
          description: Number of records per page.
          default: 25
          example: 25
    TranscriptionReference:
      title: TranscriptionReference
      required:
        - uuid
        - url
      type:
        - object
        - 'null'
      additionalProperties: false
      properties:
        uuid:
          type: string
          description: Unique identifier of the call transcription.
          example: 40d6f322-048d-490b-95c7-4fc5c76a74db
        url:
          type: string
          description: URL for retrieving the full call transcription. Call it with your usual `Authorization` header.
          example: https://api.wavix.com/v1/cdrs/40d6f322-048d-490b-95c7-4fc5c76a74db/transcription
    CDRWithTranscription:
      title: CDRWithTranscription
      required:
        - date
        - from
        - to
        - disposition
        - duration
        - destination
        - per_minute
        - charge
        - uuid
        - call_id
        - transcription
      type: object
      additionalProperties: false
      properties:
        answered_by:
          type:
            - string
            - 'null'
          description: Who answered the call. Allowed values are `human`, `machine`.
          example: human
        date:
          type: string
          description: Date and time of the call
          format: date-time
          example: '2023-08-21T06:43:36.000Z'
        from:
          type: string
          description: ANI/From attribute of the call
          example: '14302287001'
        to:
          type: string
          description: DNIS/To attribute of the call
          example: '33170363950'
        disposition:
          $ref: '#/components/schemas/CallDisposition'
        duration:
          type: integer
          description: Duration of the call, in seconds
          format: int32
          example: 6
        destination:
          type: string
          description: Destination of the call. For outbound calls, it contains the country name and, optionally, a mobile carrier or city name. For inbound calls, the destination includes the user-defined SIP trunk name, SIP URI, or PSTN number that the call is forwarded to.
          example: France
        per_minute:
          type: string
          description: Price per minute, in USD
          example: '0.027'
        charge:
          type: string
          description: Total charge for the call, in USD
        sip_trunk:
          type:
            - string
            - 'null'
          description: System-generated login of a SIP trunk. For `placed` calls only.
          example: '32882'
        forward_fee:
          type: string
          description: PSTN forwarding price, in USD. For `received` calls only when forwarded to PSTN.
          example: '0.0'
        uuid:
          type: string
          deprecated: true
          description: Call ID. Deprecated — use `call_id` instead.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        call_id:
          type: string
          description: Call ID. Alias of `uuid`.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        parent_uuid:
          type:
            - string
            - 'null'
          deprecated: true
          description: Parent call ID. Deprecated — use `parent_call_id` instead.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        parent_call_id:
          type:
            - string
            - 'null'
          description: Parent call ID. Alias of `parent_uuid`.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        transcription:
          $ref: '#/components/schemas/TranscriptionReference'
      description: A CDR of a single call with call transcription
    CDRTranscriptionSearchResponse:
      title: CDRTranscriptionSearchResponse
      required:
        - items
        - pagination
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CDRWithTranscription'
          description: List of CDRs with transcription links.
        pagination:
          $ref: '#/components/schemas/Pagination'
    TranscriptionLanguage:
      title: TranscriptionLanguage
      enum:
        - en
        - de
        - es
        - fr
        - it
        - null
      type:
        - string
        - 'null'
      description: Language of the transcription, as a two-letter ISO 639-1 code. One of `en` (English), `de` (German), `es` (Spanish), `fr` (French), or `it` (Italian). `null` lets the platform auto-detect the language.
    CDRRetranscriptionRequest:
      title: CDRRetranscriptionRequest
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: '#/components/schemas/TranscriptionLanguage'
        webhook_url:
          type: string
          description: Webhook URL to receive status updates.
          example: https://site.webhook
    TranscriptTurn:
      title: TranscriptTurn
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: Phone number of the speaker attributed to this turn, in E.164 format.
          example: '13132847320'
        s:
          type: integer
          description: Start of the `turn`, in milliseconds. The start time is calculated from the moment the call was answered.
          format: int32
          example: 3000
        e:
          type: integer
          description: End of the `turn`, in milliseconds. The end time is calculated from the moment the call was answered.
          format: int32
          example: 18000
        text:
          type: string
          description: Transcribed text attributed to the speaker for this turn.
          example: Hi there, how are you?
        sentiment:
          type: string
          description: Sentiment detected in the speaker's text for this turn, such as `neutral`, `positive`, or `negative`.
          example: neutral
        topics:
          type: array
          description: Topics detected in the speaker's text for this turn. Empty when no topic was detected.
          items:
            type: string
          example:
            - billing
      description: Represents a single turn in a call transcript. Each turn carries the text attributed to one speaker, with the start and end times for that text.
    TranscriptionStatus:
      title: TranscriptionStatus
      enum:
        - completed
        - failed
      type: string
      description: Outcome of the transcription. One of `completed` (the transcript was produced) or `failed` (the transcription could not be produced).
    CDRTranscriptionResponse:
      title: CDRTranscriptionResponse
      required:
        - transcript
        - turns
        - uuid
        - language
        - duration
        - charge
        - status
        - transcription_date
        - call_date
        - call_uuid
        - call_score
        - call_summary
      type: object
      additionalProperties: false
      properties:
        transcript:
          type: object
          description: Mapping of phone numbers in the call to transcript text.
          additionalProperties:
            type: string
          example:
            '16572026750': ''
            '16465292513': ''
        turns:
          type: array
          description: List of speaker turns with text and start/end times.
          items:
            $ref: '#/components/schemas/TranscriptTurn'
          example:
            - type: '46844685344'
              s: 160
              e: 7280
              text: Hello, how can I help you?
            - type: '+16572026750'
              s: 2400
              e: 3280
              text: Hello, I have a question about my bill.
        uuid:
          type: string
          description: Transcription ID.
          example: e84f350f-6da7-4b56-80eb-41dec572626b
        language:
          $ref: '#/components/schemas/TranscriptionLanguage'
        duration:
          type: integer
          description: Call duration in seconds.
          format: int32
          example: 102
        charge:
          type: string
          description: Total charge for the transcription in USD.
          example: '0.01'
        status:
          $ref: '#/components/schemas/TranscriptionStatus'
        transcription_date:
          type: string
          description: Date and time when the transcription was processed in ISO 8601 format.
          format: date-time
          example: '2023-01-09T10:04:39.734Z'
        call_date:
          type: string
          description: Date and time when the call was placed or received in ISO 8601 format.
          format: date-time
          example: '2023-01-09T10:01:13.394Z'
        call_uuid:
          type: string
          description: Associated call ID.
          example: bbaa37bf-430a-46da-ade3-c248e4070161
        call_score:
          type: string
          description: |-
            Call sentiment score. Indicates negative (1.0-3.0), neutral,
             or positive (4.0-5.0).
          example: '3.8'
        call_summary:
          type: string
          description: One- or two-sentence call summary.
          example: The agent and client discussed billing issues.
