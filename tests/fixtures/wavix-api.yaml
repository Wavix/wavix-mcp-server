  /v1/whatsapp/senders:
    get:
      tags:
        - WhatsApp
      summary: List WhatsApp senders
      description: |-
        Returns a paginated list of the WhatsApp senders in your account's WhatsApp Business Accounts, each with the WhatsApp Business Account it belongs to.

        Every send needs a registered sender's number in `from`, and this is where that number comes from.

        **Behavior:** Senders are ordered from newest to oldest. When both `status` and `waba_id` are specified, a sender must match both filters.

        **Requires:** Your account must have WhatsApp enabled, must have a subscription plan, and must not be blocked or suspended.
      operationId: whatsapp_senders_list
      security:
        - bearerAuth:
            - whatsapp:read
      x-fern-sdk-group-name:
        - whatsapp
        - senders
      x-fern-sdk-method-name: list
      x-fern-ignore: true
      x-fern-pagination:
        offset: $request.page
        results: $response.senders
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: messaging
      parameters:
        - name: status
          in: query
          required: false
          description: |-
            Filters senders by registration status. Possible values:

            - `banned` — The provider banned the sender.
            - `connected` — The sender can send messages within its messaging limit.
            - `deleted` — The sender was deleted.
            - `disconnected` — The sender is disconnected from the provider.
            - `flagged` — The sender's quality rating dropped to low. The status returns to `connected` if the rating returns to medium or high within seven days.
            - `migrated` — The sender was migrated.
            - `pending` — Registration with the provider is in progress.
            - `rate_limited` — The provider is rate limiting the sender.
            - `restricted` — The sender reached its messaging limit. It can't start new conversations until the 24-hour window resets, but it can still reply to customers who messaged it.
            - `unknown` — The provider hasn't reported a status.
            - `unverified` — The sender isn't verified.
          schema:
            type: string
            enum:
              - banned
              - connected
              - deleted
              - disconnected
              - flagged
              - migrated
              - pending
              - rate_limited
              - restricted
              - unknown
              - unverified
          example: connected
        - name: waba_id
          in: query
          required: false
          description: Filters senders by the ID of the WhatsApp Business Account they belong to, as returned in `waba.id`.
          schema:
            type: string
          example: '102290129340398'
        - $ref: '#/components/parameters/WhatsAppPageParam'
        - $ref: '#/components/parameters/WhatsAppPerPageParam'
      responses:
        '200':
          description: A paginated list of WhatsApp senders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppSenderListResponse'
              examples:
                default:
                  summary: One connected sender
                  value:
                    senders:
                      - phone_number: '+14155550100'
                        display_name: Acme Support
                        status: connected
                        quality_rating: high
                        waba:
                          id: '102290129340398'
                          name: Acme Support
                    pagination:
                      current_page: 1
                      per_page: 25
                      total: 1
                      total_pages: 1
        '401':
          $ref: '#/components/responses/WhatsAppUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/WhatsAppForbiddenResponse'
        '404':
          $ref: '#/components/responses/WhatsAppChannelUnavailableResponse'
        '429':
          $ref: '#/components/responses/WhatsAppTooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/WhatsAppInternalServerErrorResponse'
        '503':
          $ref: '#/components/responses/WhatsAppServiceUnavailableResponse'
      deprecated: false
