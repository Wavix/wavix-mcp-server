        - city
        - country
        - zip
      properties:
        dba_name:
          type: string
          description: Brand name or DBA
          maxLength: 255
          example: Brand
        company_name:
          type: string
          description: Legal name of the company
          maxLength: 255
          example: Company
        entity_type:
          type: string
          description: Legal entity type of the company. One of `PRIVATE_PROFIT` (privately held for-profit company), `PUBLIC_PROFIT` (publicly traded for-profit company), `NON_PROFIT` (non-profit organization), or `GOVERNMENT` (government entity).
          enum:
            - PRIVATE_PROFIT
            - PUBLIC_PROFIT
            - NON_PROFIT
            - GOVERNMENT
          example: PUBLIC_PROFIT
        vertical:
          type: string
          description: |-
            Business segment the Brand operates in. One of:

            - `HEALTHCARE` — healthcare.
            - `PROFESSIONAL` — professional services.
            - `RETAIL` — retail.
            - `TECHNOLOGY` — technology.
            - `EDUCATION` — education.
            - `FINANCIAL` — financial services.
            - `NON_PROFIT` — non-profit organizations.
            - `GOVERNMENT` — government entities.
            - `OTHER` — any segment not listed above.
          enum:
            - HEALTHCARE
            - PROFESSIONAL
            - RETAIL
            - TECHNOLOGY
            - EDUCATION
            - FINANCIAL
            - NON_PROFIT
            - GOVERNMENT
            - OTHER
          example: PROFESSIONAL
        ein_taxid:
          type: string
          description: IRS Employee Identification Number (EIN) for US-based or foreign companies with EIN. The numeric portion of Tax ID for companies incorporated in other countries.
          maxLength: 21
          example: 12-2142342
        ein_taxid_country:
          type: string
          description: 2-letter ISO country code of the Tax ID issuing country
          minLength: 2
          maxLength: 2
          example: US
        website:
          type: string
          description: The website of the business
          maxLength: 255
          example: Tess.com
        stock_symbol:
          type:
            - string
            - 'null'
          description: The stock symbol of the Brand. For PUBLIC_PROFIT Brands only.
          maxLength: 10
        stock_exchange:
          type:
            - string
            - 'null'
          description: The stock exchange code. For PUBLIC_PROFIT Brands only.
          maxLength: 10
          example: NASDAQ
        first_name:
          type: string
          description: The first name of the business contact
          maxLength: 100
          example: John
        last_name:
          type: string
          description: The last name of the business contact
          maxLength: 100
          example: Dow
        phone_number:
          type: string
          description: The support contact telephone in E.164 format
          maxLength: 20
          example: '12046661776'
        email:
          type: string
          description: The email address of the support contact
          format: email
          maxLength: 100
          example: support@brand.com
        street_address:
          type: string
          description: Street name and house number
          maxLength: 100
          example: 10, City Name
        city:
          type: string
          description: The city name
          maxLength: 100
          example: Miami
        state_or_province:
          type:
            - string
            - 'null'
          description: State or province. For the United States, it is a 2-character code.
          maxLength: 20
          example: AL
        zip:
          type: string
          description: The business zip or postal code
          maxLength: 10
          example: '12345'
        country:
          type: string
          description: 2-letter ISO country code the business address
          minLength: 2
          maxLength: 2
          example: US
        mock:
          type: boolean
          description: Indicates a mock Brand. Mock Brands are for testing purposes only; production traffic with mock Brands is prohibited.
          default: false
          example: false
      oneOf:
        - description: PUBLIC_PROFIT brands must provide stock_symbol and stock_exchange.
          properties:
            entity_type:
              const: PUBLIC_PROFIT
          required:
            - stock_symbol
            - stock_exchange
        - description: Non-PUBLIC_PROFIT brands must not include stock_symbol or stock_exchange.
          properties:
            entity_type:
              enum:
                - PRIVATE_PROFIT
                - NON_PROFIT
                - GOVERNMENT
            stock_symbol:
              type: 'null'
            stock_exchange:
              type: 'null'
      example:
        dba_name: Brand
        company_name: Company
        entity_type: PUBLIC_PROFIT
        vertical: PROFESSIONAL
        ein_taxid: 12-2142342
        ein_taxid_country: US
        website: Tess.com
        stock_symbol: null
        stock_exchange: NASDAQ
        first_name: John
        last_name: Doe
        phone_number: '12046661776'
        email: support@brand.com
        street_address: 10, Street name
        city: Miami
        state_or_province: AL
        zip: '12345'
        country: US
        mock: false
