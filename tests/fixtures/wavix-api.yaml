    SIPTrunkSummary:
      title: SIPTrunkSummary
      required:
        - id
        - name
        - callerid
        - multiple_numbers
        - label
        - auth_method
        - host_request
        - status
        - talk_time
        - charge
        - access_token
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Unique identifier of the SIP trunk on the platform
          format: int32
          example: 293
        name:
          type: string
          description: System-generated login name of the SIP trunk
          example: '67758'
        callerid:
          type:
            - string
            - 'null'
          description: Caller ID associated with the SIP trunk. Contains `null` if no Caller ID is set, or an empty string if multiple Caller IDs are allowed.
          example: '12345678900'
        label:
          type: string
          description: User-defined name of the SIP trunk
          example: My trunk
        auth_method:
          description: SIP trunk authentication method. Can be either `Digest` or `IP auth`.
          type: string
        host_request:
          type:
            - object
            - 'null'
          description: For SIP trunks with IP-based authentication, contains the status of the IP authentication request.
          properties:
            host:
              type: string
              description: The IP address submitted for authentication
              example: 127.0.0.1
            status:
              type: string
              description: Status of the IP authentication request
              example: pending
        passthrough:
          type: boolean
          description: Indicates whether Caller ID passthrough is enabled for the SIP trunk
          example: false
        multiple_numbers:
          type: boolean
          description: Indicates whether multiple Caller IDs are enabled for the SIP trunk
          example: false
        status:
          type: string
          description: |-
            Status of the SIP trunk. Possible values are:
            `active` - The SIP trunk is active and can be used to place outbound calls.
            `pending` - The IP authentication request is under review by the Wavix team.
            `rejected` - The IP authentication request was rejected by the Wavix team.
            SIP trunks with a `pending` or `rejected` status can't be used to place calls.
        talk_time:
          description: Total duration of all outbound calls placed through the SIP trunk the current month, in seconds. Automatically resets at the beginning of each month.
          type: integer
          format: int32
          example: 65
        charge:
          description: Total cost of all outbound calls placed through the SIP trunk in the current month, in USD. Automatically resets at the beginning of each month.
          type: string
          example: '24.637'
        call_recording_enabled:
          description: Indicates whether outbound call recording is enabled for the SIP trunk
          type: boolean
          default: false
        machine_detection_enabled:
          description: |-
            Indicates whether automatic voicemail detection is enabled for the SIP trunk.
            Available for `Flex Pro` customers only.
          type: boolean
          default: false
        transcription_enabled:
          description: |-
            Indicates whether automatic call transcription is enabled for the SIP trunk.
            Available for `Flex Pro` customers only.
          type: boolean
          default: false
        transcription_threshold:
          description: |-
            Minimum call duration (in seconds) required to automatically generate a transcription. Transcriptions are created for calls that meet or exceed this value.
            Available to `Flex Pro` customers only.
          type: integer
          format: int32
          default: 6
        encrypted_media:
          type: boolean
          description: Indicates whether SRTP media encryption is enabled for the SIP trunk.
          example: true
        access_token:
          type:
            - string
            - 'null'
          description: Static authentication token for the SIP trunk.
          example: siped7a3f5c1b9e042d6f8a4c2e7b9d1f3a5c8e0b2d4f6a8c0e2d4b6f8a1c3e5d7
      description: A SIP trunk associated with the account.
      example:
        id: 3107
        label: My trunk
        name: '32882'
        auth_method: Digest
        callerid: '14302287001'
        host_request: null
        passthrough: false
        multiple_numbers: false
        status: active
        charge: '24.637'
        talk_time: 65
        machine_detection_enabled: true
        call_recording_enabled: true
        transcription_enabled: true
        transcription_threshold: 6
        access_token: siped7a3f5c1b9e042d6f8a4c2e7b9d1f3a5c8e0b2d4f6a8c0e2d4b6f8a1c3e5d7
    Pagination:
      title: Pagination
      required:
        - current_page
        - per_page
        - total
        - total_pages
      type: object
      additionalProperties: false
      properties:
        current_page:
          type: integer
          description: Current page number.
          format: int32
          example: 2
        per_page:
          type: integer
          description: Number of records per page.
          format: int32
          example: 25
        total:
          type: integer
          description: Total number of records.
          format: int32
          example: 101
        total_pages:
          type: integer
          description: Total number of pages.
          format: int32
          example: 5
    SIPTrunkListResponse:
      title: SIPTrunkListResponse
      required:
        - sip_trunks
        - pagination
      type: object
      additionalProperties: false
      properties:
        sip_trunks:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/SIPTrunkSummary'
          description: SIP trunks associated with the account.
        pagination:
          $ref: '#/components/schemas/Pagination'
      example:
        sip_trunks:
          - id: 3107
            label: My trunk
            name: '32882'
            auth_method: IP auth
            callerid: '14302287001'
            host_request:
              host: 127.0.0.1
              status: pending
            encrypted_media: false
            passthrough: false
            multiple_numbers: true
            status: pending
            charge: '24.637'
            talk_time: 65
            machine_detection_enabled: true
            call_recording_enabled: true
            transcription_enabled: true
            transcription_threshold: 6
            access_token: siped7a3f5c1b9e042d6f8a4c2e7b9d1f3a5c8e0b2d4f6a8c0e2d4b6f8a1c3e5d7
        pagination:
          current_page: 1
          total: 1
          per_page: 25
          total_pages: 1
    SIPTrunkCreateRequest:
      title: SIPTrunkCreateRequest
      required:
        - label
        - password
        - callerid
        - ip_restrict
        - didinfo_enabled
        - call_restrict
        - channels_restrict
        - rewrite_enabled
        - transcription_enabled
        - transcription_threshold
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: User-defined name of the SIP trunk
          example: My trunk
        password:
          type: string
          description: Password set for the SIP trunk. A strong password helps keep the trunk secure.
          example: 4r=h;EaCB85QNtr2
        host_request:
          type: object
          description: For SIP trunks with IP authentication, includes the SIP endpoint public static IP address and the status of the authentication request. Wavix authenticates all SIP traffic originating from this IP address.
          additionalProperties: false
          required:
            - host
          properties:
            host:
              type: string
              description: SIP endpoint public static IP address
              example: 127.0.0.1
        callerid:
          type: string
          description: Caller ID associated with the SIP trunk. Must be an active or verified number on the account.
          example: '13132847320'
        multiple_numbers:
          type: boolean
          description: Indicates whether any active or verified phone number on the account can be used as the Caller ID for the SIP trunk.
        ip_restrict:
          type: boolean
          description: Indicates whether SIP trunk registration is allowed from only specific public static IP addresses. When set to `true`, the `allowed_ips` parameter must be provided.
          example: false
        allowed_ips:
          type:
            - array
            - 'null'
          description: A list of public static IP addresses allowed to register with the SIP trunk
          items:
            type: object
            additionalProperties: false
            required:
              - ip
            properties:
              ip:
                type: string
                description: Public static IP address allowed to register with the SIP trunk.
                example: 127.0.0.1
        didinfo_enabled:
          type: boolean
          description: Indicates whether inbound calls include dialed number information in the `To` header of SIP INVITE requests
          example: true
        call_restrict:
          type: boolean
          description: Indicates whether a maximum call duration limit is enforced for the SIP trunk
          example: true
        call_limit:
          type: integer
          description: Maximum call duration for the SIP trunk, in seconds. Must not exceed the maximum duration set for the account. Ignored when `call_restrict` is `false`.
          format: int32
          example: 3600
        cost_limit:
          type: boolean
          description: Indicates if the max cost limit for an outbound call limit is activated for the SIP trunk.
          default: false
          example: true
        max_call_cost:
          type: number
          format: decimal
          description: Maximum cost for an outbound call, in USD
          example: 0.18
        channels_restrict:
          type: boolean
          description: Indicates whether a limit on the number of concurrent outbound calls is enforced for the SIP trunk
          example: false
        max_channels:
          type: integer
          description: Maximum number of concurrent outbound calls for the SIP trunk. Must not exceed the outbound channel capacity set for the account. Ignored when `channels_restrict` is `false`.
          format: int32
          example: 2
        rewrite_enabled:
          type: boolean
          description: Indicates whether a custom dial plan is activated for the SIP trunk
          example: true
        rewrite_prefix:
          type: string
          description: Digits to automatically prepend to each dialed phone number
          example: '1'
        rewrite_cond:
          type: string
          description: Number of leading digits to automatically remove from each dialed phone number
        call_recording_enabled:
          type: boolean
          description: Indicates whether outbound call recording is enabled for the SIP trunk
          example: true
        transcription_enabled:
          type: boolean
          description: |-
            Indicates whether automatic call transcription is enabled for the SIP trunk.
            Available for `Flex Pro` customers only.
          example: true
        transcription_threshold:
          type: integer
          description: |-
            Transcriptions will be generated for calls that meet or exceed the specified minimal call duration threshold, in seconds.
            Available for `Flex Pro` customers only.
          format: int32
          example: 10
        machine_detection_enabled:
          type: boolean
          description: |-
            Indicates whether automatic voicemail detection is enabled for the SIP trunk.
            Available for `Flex Pro` customers only.
          example: true
        encrypted_media:
          type: boolean
          description: Indicates whether SRTP media encryption is enabled for the SIP trunk.
          example: true
    AllowedIPs:
      title: AllowedIPs
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - ip
        properties:
          id:
            type: integer
            description: IP address ID.
            format: int32
            example: 6712
          ip:
            type: string
            description: Public static IP address.
            example: 127.0.0.1
