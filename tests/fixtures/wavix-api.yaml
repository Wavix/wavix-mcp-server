        host:
          type: string
          description: Registration host for the SIP trunk. `dynamic` for credential-based registration, or a public static IP address for IP authentication.
          example: dynamic
        multiple_numbers:
          type: boolean
          description: Indicates whether any active or verified phone number on the account can be used as the Caller ID for the SIP trunk.
          example: true
        encrypted_media:
          type: boolean
          description: Indicates whether SRTP media encryption is enabled for the SIP trunk.
          example: true
        passthrough:
          type: boolean
          description: Indicates whether Caller ID passthrough is enabled.
          example: true
        access_token:
          type:
            - string
            - 'null'
          description: Static authentication token for the SIP trunk.
          example: 123easwqe321132
    SIPTrunkUpdateRequest:
      title: SIPTrunkUpdateRequest
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: User-defined name of the SIP trunk
          example: My trunk
        password:
          type: string
          description: Password set for the SIP trunk. A strong password helps keep the trunk secure.
          example: 4r=h;EaCB85QNtr2
        host_request:
          type: object
          description: For SIP trunks with IP authentication, the SIP endpoint public static IP address. Wavix authenticates all SIP traffic originating from this IP address. Ignored when the trunk already has a host request that is pending or approved. Not supported on trial accounts.
          additionalProperties: false
          required:
            - host
          properties:
            host:
              type: string
              description: SIP endpoint public static IP address
              example: 127.0.0.1
        callerid:
          type: string
          description: Caller ID associated with the SIP trunk. Must be an active or verified number on the account.
          example: '13132847320'
        multiple_numbers:
          type: boolean
          description: Indicates whether any active or verified phone number on the account can be used as the Caller ID for the SIP trunk. Setting it to `true` clears the trunk's `callerid`; on a trunk with Caller ID passthrough (`passthrough`) enabled, `true` is ignored.
        ip_restrict:
          type: boolean
          description: Indicates whether SIP trunk registration is allowed from only specific public static IP addresses. It can be `true` only when the trunk has at least one allowed IP address, either already stored or sent in `allowed_ips`.
          example: false
        allowed_ips:
          type:
            - array
            - 'null'
          description: Public static IP addresses to add to the list allowed to register with the SIP trunk. Addresses already on the list are kept.
          items:
            type: object
            additionalProperties: false
            required:
              - ip
            properties:
              ip:
                type: string
                description: Public static IP address allowed to register with the SIP trunk.
                example: 127.0.0.1
        didinfo_enabled:
          type: boolean
          description: Indicates whether inbound calls include dialed number information in the `To` header of SIP INVITE requests
          example: true
        call_restrict:
          type: boolean
          description: Indicates whether a maximum call duration limit is enforced for the SIP trunk
          example: true
        call_limit:
          type: integer
          description: Maximum call duration for the SIP trunk, in seconds. Must not exceed the maximum duration set for the account. Ignored when `call_restrict` is `false`.
          format: int32
          example: 3600
        cost_limit:
          type: boolean
          description: Indicates if the max cost limit for an outbound call limit is activated for the SIP trunk.
          example: true
        max_call_cost:
          type: number
          format: decimal
          description: Maximum cost for an outbound call, in USD
          example: 0.18
        channels_restrict:
          type: boolean
          description: Indicates whether a limit on the number of concurrent outbound calls is enforced for the SIP trunk
          example: false
        max_channels:
          type: integer
          description: Maximum number of concurrent outbound calls for the SIP trunk. Must not exceed the outbound channel capacity set for the account. Ignored when `channels_restrict` is `false`.
          format: int32
          example: 2
        rewrite_enabled:
          type: boolean
          description: Indicates whether a custom dial plan is activated for the SIP trunk
          example: true
        rewrite_prefix:
          type: string
          description: Digits to automatically prepend to each dialed phone number
          example: '1'
        rewrite_cond:
          type: string
          description: Number of leading digits to automatically remove from each dialed phone number
        call_recording_enabled:
          type: boolean
          description: Indicates whether outbound call recording is enabled for the SIP trunk
          example: true
        transcription_enabled:
          type: boolean
          description: |-
            Indicates whether automatic call transcription is enabled for the SIP trunk.
            Available for `Flex Pro` customers only.
          example: true
        transcription_threshold:
          type: integer
          description: |-
            Transcriptions will be generated for calls that meet or exceed the specified minimal call duration threshold, in seconds.
            Available for `Flex Pro` customers only.
          format: int32
          example: 10
        machine_detection_enabled:
          type: boolean
          description: |-
            Indicates whether automatic voicemail detection is enabled for the SIP trunk.
            Available for `Flex Pro` customers only.
          example: true
        encrypted_media:
          type: boolean
          description: Indicates whether SRTP media encryption is enabled for the SIP trunk.
          example: true
    Country:
