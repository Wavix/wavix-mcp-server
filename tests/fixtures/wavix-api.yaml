    TenDLCBrandVetting:
      title: TenDLCBrandVetting
      description: Represents the result of an external vetting performed on a 10DLC brand. Vetting can raise a Brand's trust score and unlock higher messaging throughput.
      required:
        - evp_id
        - create_date
        - vetted_date
        - vetting_id
        - vetting_token
        - vetting_score
        - vetting_class
        - vetting_status
        - reasons
      type: object
      additionalProperties: false
      properties:
        evp_id:
          type: string
          description: Code identifying the external vetting provider that performed the vetting.
          example: AEGIS
        create_date:
          type: string
          description: Timestamp when the vetting request was created, in ISO 8601 format.
          example: '2024-08-01T14:09:43'
        vetting_details:
          type: object
          description: Additional provider-specific details about the vetting request.
          additionalProperties: true
          example:
            additional_prop1: {}
            additional_prop2: {}
            additional_prop3: {}
        vetted_date:
          type:
            - string
            - 'null'
          description: Timestamp when the vetting was completed, in ISO 8601 format. Null while the vetting is still in progress.
          example: '2024-08-01T14:09:43'
        vetting_id:
          type: string
          description: Unique identifier of the vetting request.
          example: 13d8e00c-3cb4-4dc0-9e26-d5057fa938d9
        vetting_token:
          type:
            - string
            - 'null'
          description: Token issued by the vetting provider that uniquely identifies this vetting result.
          example: 
        vetting_score:
          type:
            - integer
            - 'null'
          description: Score assigned to the Brand by the vetting provider. Null until vetting completes.
          format: int32
          example: 80
        vetting_class:
          type: string
          description: Class of vetting performed, such as `STANDARD` or `ENHANCED`.
          example: STANDARD
        vetting_status:
          type: string
          description: Current status of the vetting request, such as `PENDING` or `ACTIVE`.
          example: PENDING
        reasons:
          type:
            - array
            - 'null'
          description: Reasons explaining the assigned `vetting_score`. Null when no reasons are provided.
          items:
            type: string
          example:
            - 'Company size as reported by government or business sources resulted in a score deduction: size range 6-10'
