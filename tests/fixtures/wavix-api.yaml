        - flow_response
      properties:
        type:
          type: string
          const: flow_response
          description: Type of the content, always `flow_response`.
          example: flow_response
        flow_response:
          type: object
          additionalProperties: true
          required: []
          description: Fields the contact submitted in the Flow, as defined by the Flow. `flow_token` holds the token you set when you sent the Flow.
          example:
            flow_token: order-1001
            delivery_date: '2026-10-24'
            time_slot: morning
    WhatsAppInboundContent:
      title: WhatsAppInboundContent
      description: |-
        Content of a received message. Returned in `content` of a `whatsapp.message.received` event. The `type` field decides which other field holds the content. Wavix can add content types, so ignore a message whose `type` you don't recognize. Possible values:

        - `text` — Text.
        - `image` — An image, with an optional caption.
        - `video` — A video, with an optional caption.
        - `audio` — An audio file or a voice note.
        - `document` — A document, with its file name and an optional caption.
        - `sticker` — A sticker.
        - `location` — A location.
        - `contacts` — One or more contact cards.
        - `reaction` — An emoji reaction to an earlier message, or the removal of one.
        - `button_reply` — A tap on a quick reply button of a message you sent.
        - `list_reply` — An item picked from a list in a message you sent.
        - `flow_response` — The response to a WhatsApp Flow the contact completed.
      oneOf:
        - $ref: '#/components/schemas/WhatsAppInboundTextContent'
        - $ref: '#/components/schemas/WhatsAppInboundImageContent'
        - $ref: '#/components/schemas/WhatsAppInboundVideoContent'
        - $ref: '#/components/schemas/WhatsAppInboundAudioContent'
        - $ref: '#/components/schemas/WhatsAppInboundDocumentContent'
        - $ref: '#/components/schemas/WhatsAppInboundStickerContent'
        - $ref: '#/components/schemas/WhatsAppInboundLocationContent'
        - $ref: '#/components/schemas/WhatsAppInboundContactsContent'
        - $ref: '#/components/schemas/WhatsAppInboundReactionContent'
        - $ref: '#/components/schemas/WhatsAppInboundButtonReplyContent'
        - $ref: '#/components/schemas/WhatsAppInboundListReplyContent'
        - $ref: '#/components/schemas/WhatsAppInboundFlowResponseContent'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/WhatsAppInboundTextContent'
          image: '#/components/schemas/WhatsAppInboundImageContent'
          video: '#/components/schemas/WhatsAppInboundVideoContent'
          audio: '#/components/schemas/WhatsAppInboundAudioContent'
          document: '#/components/schemas/WhatsAppInboundDocumentContent'
          sticker: '#/components/schemas/WhatsAppInboundStickerContent'
          location: '#/components/schemas/WhatsAppInboundLocationContent'
          contacts: '#/components/schemas/WhatsAppInboundContactsContent'
          reaction: '#/components/schemas/WhatsAppInboundReactionContent'
          button_reply: '#/components/schemas/WhatsAppInboundButtonReplyContent'
          list_reply: '#/components/schemas/WhatsAppInboundListReplyContent'
          flow_response: '#/components/schemas/WhatsAppInboundFlowResponseContent'
    WhatsAppInboundContext:
      title: WhatsAppInboundContext
      description: The message a received message replies to. Returned in `context` of a `whatsapp.message.received` event.
      type: object
      additionalProperties: false
      required:
        - message_uuid
      properties:
        message_uuid:
          type:
            - string
            - 'null'
          format: uuid
          description: ID of the message the contact replied to, or null when Wavix has no record of that message.
          example: 3a525ca2-6909-4c72-9399-905adf7f3a74
    WhatsAppInboundReferral:
      title: WhatsAppInboundReferral
      description: The ad or post that brought the contact to the conversation. Returned in `referral` of a `whatsapp.message.received` event when the contact tapped a click-to-WhatsApp ad.
      type: object
      additionalProperties: false
      required:
        - source_type
        - source_id
        - source_url
        - headline
        - body
        - click_id
      properties:
        source_type:
          type: string
          description: |-
            Type of the source. Possible values:

            - `ad` — A click-to-WhatsApp ad.
            - `post` — A Facebook or Instagram post.
          enum:
            - ad
            - post
          example: ad
        source_id:
          type: string
          description: Meta ID of the ad or post.
          example: '120210000000000001'
        source_url:
          type: string
          format: uri
          description: URL of the ad or post.
          example: https://fb.me/3cr4Wqqkk
        headline:
          type:
            - string
            - 'null'
          description: Headline of the ad, or null when it has none.
          example: Free delivery this week
        body:
          type:
            - string
            - 'null'
          description: Text of the ad, or null when it has none.
          example: Order today and get free delivery.
        click_id:
          type:
            - string
            - 'null'
          description: Click ID of the ad, for matching the conversation to the click in Meta's ad reports. Null when Meta doesn't provide one.
          example: ARAkLkA8rmlFeiCktEJQ
    WhatsAppMessageReceivedEventData:
      title: WhatsAppMessageReceivedEventData
      description: Data of a `whatsapp.message.received` event. It carries the received message, its phone numbers, and what you need to reply.
      type: object
      additionalProperties: false
      required:
        - message_uuid
        - from
        - to
        - profile_name
        - content
        - context
        - referral
        - service_window_open_until
      properties:
        message_uuid:
          type: string
          format: uuid
          description: ID of the received message, the same as in [Retrieve a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/retrieve-a-whatsapp-message).
          example: 9d4e1c7a-2b86-4f3d-b5a0-71e8c3f6a924
        from:
          type: string
          description: Phone number of the person who sent the message, in E.164 format.
          example: '+447537151866'
        to:
          type: string
          description: Your sender's phone number that received the message, in E.164 format.
          example: '+14155550100'
        profile_name:
          type:
            - string
            - 'null'
          description: Name on the contact's WhatsApp profile, or null when the provider doesn't report it.
          example: Jane Smith
        content:
          $ref: '#/components/schemas/WhatsAppInboundContent'
        context:
          description: The message this message replies to, or null when it isn't a reply.
          anyOf:
            - $ref: '#/components/schemas/WhatsAppInboundContext'
            - type: 'null'
        referral:
          description: The ad or post the contact came from, or null when the conversation didn't start from one.
          anyOf:
            - $ref: '#/components/schemas/WhatsAppInboundReferral'
            - type: 'null'
        service_window_open_until:
          type: string
          format: date-time
          description: Time until which you can reply to this contact from this sender without a template, in ISO 8601 UTC. Each new message from the contact moves it forward.
          example: '2026-10-22T08:30:00Z'
    WhatsAppMessageReceivedEvent:
      title: WhatsAppMessageReceivedEvent
      description: Event that tells you one of your senders received a message. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_8a1d3c5e7f9b4d2a6c8e0f1a3b5c7d9e
        type:
          type: string
          const: whatsapp.message.received
          description: Type of the event, always `whatsapp.message.received`.
          example: whatsapp.message.received
        timestamp:
          type: string
          format: date-time
          description: When the message was received, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T08:30:00.123456Z'
        data:
          $ref: '#/components/schemas/WhatsAppMessageReceivedEventData'
    WhatsAppMessageStatusEventData:
      title: WhatsAppMessageStatusEventData
      description: Data of a `whatsapp.message.sent`, `whatsapp.message.delivered`, or `whatsapp.message.read` event. It identifies the message; the event type carries its status.
      type: object
      additionalProperties: false
      required:
        - message_uuid
        - from
        - to
        - template
      properties:
        message_uuid:
          type: string
          format: uuid
          description: ID of the message, as returned by [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
          example: 3a525ca2-6909-4c72-9399-905adf7f3a74
        from:
          type: string
          description: Your sender's phone number, in E.164 format.
          example: '+14155550100'
        to:
          type: string
          description: Recipient's phone number, in E.164 format.
          example: '+447537151866'
        template:
          description: Template the message was sent with, or null when it wasn't sent with a template.
          anyOf:
            - $ref: '#/components/schemas/WhatsAppMessageTemplate'
            - type: 'null'
    WhatsAppMessageSentEvent:
      title: WhatsAppMessageSentEvent
      description: 'Event of type `whatsapp.message.sent`. A message you sent has the `sent` status: it isn''t delivered yet. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).'
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_0a2c4e6a8c0e4a2c4e6a8c0e2a4c6e8a
        type:
          type: string
          const: whatsapp.message.sent
          description: Type of the event, always `whatsapp.message.sent`.
          example: whatsapp.message.sent
        timestamp:
          type: string
          format: date-time
          description: When Wavix recorded the provider accepting the message, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T08:31:05.000000Z'
        data:
          $ref: '#/components/schemas/WhatsAppMessageStatusEventData'
    WhatsAppMessageDeliveredEvent:
      title: WhatsAppMessageDeliveredEvent
      description: Event of type `whatsapp.message.delivered`. A message you sent was delivered to the recipient. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
        type:
          type: string
          const: whatsapp.message.delivered
          description: Type of the event, always `whatsapp.message.delivered`.
          example: whatsapp.message.delivered
        timestamp:
          type: string
          format: date-time
          description: When the provider reported the status, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T08:31:05.000000Z'
        data:
          $ref: '#/components/schemas/WhatsAppMessageStatusEventData'
    WhatsAppMessageReadEvent:
      title: WhatsAppMessageReadEvent
      description: Event of type `whatsapp.message.read`. The recipient opened a message you sent. WhatsApp reports it only when the recipient has read receipts turned on. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_5d7f9b1c3e5a4c7e9b1d3f5a7c9e1b3d
        type:
          type: string
          const: whatsapp.message.read
          description: Type of the event, always `whatsapp.message.read`.
          example: whatsapp.message.read
        timestamp:
          type: string
          format: date-time
          description: When the provider reported the status, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T08:31:05.000000Z'
        data:
          $ref: '#/components/schemas/WhatsAppMessageStatusEventData'
    WhatsAppMessageFailedEventData:
      title: WhatsAppMessageFailedEventData
      description: Data of a `whatsapp.message.failed` event. It identifies the message and says why it wasn't delivered.
      type: object
      additionalProperties: false
      required:
        - message_uuid
        - from
        - to
        - template
        - status
        - error
      properties:
        message_uuid:
          type: string
          format: uuid
          description: ID of the message, as returned by [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
          example: 3a525ca2-6909-4c72-9399-905adf7f3a74
        from:
          type: string
          description: Your sender's phone number, in E.164 format.
          example: '+14155550100'
        to:
          type: string
          description: Recipient's phone number, in E.164 format.
          example: '+447537151866'
        template:
          description: Template the message was sent with, or null when it wasn't sent with a template.
          anyOf:
            - $ref: '#/components/schemas/WhatsAppMessageTemplate'
            - type: 'null'
        status:
          type: string
          description: |-
            Status of the message, the same as in [Retrieve a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/retrieve-a-whatsapp-message). Possible values:

            - `undelivered` — The message was sent but not delivered.
            - `expired` — The message expired before it was delivered.
            - `rejected` — The message was permanently rejected before or by the provider.
          enum:
            - undelivered
            - expired
            - rejected
          example: undelivered
        error:
          $ref: '#/components/schemas/WhatsAppMessageError'
    WhatsAppMessageFailedEvent:
      title: WhatsAppMessageFailedEvent
      description: Event that tells you a message you sent wasn't delivered. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_7c9e1a3b5d7f4c2e8a0b2d4f6a8c0e1b
        type:
          type: string
          const: whatsapp.message.failed
          description: Type of the event, always `whatsapp.message.failed`.
          example: whatsapp.message.failed
        timestamp:
          type: string
          format: date-time
          description: When the provider reported the failure, or when Wavix decided the message failed, in ISO 8601 UTC with 6 fractional digits. It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T08:32:40.000000Z'
        data:
          $ref: '#/components/schemas/WhatsAppMessageFailedEventData'
    WhatsAppContactMarketingPreferenceEventData:
      title: WhatsAppContactMarketingPreferenceEventData
      description: Data of a `whatsapp.contact.marketing_stopped` or `whatsapp.contact.marketing_resumed` event. It names the contact and the sender the choice applies to.
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: Phone number of the contact who changed the preference, in E.164 format.
          example: '+447537151866'
        to:
          type: string
          description: Your sender's phone number the preference applies to, in E.164 format.
          example: '+14155550100'
    WhatsAppContactMarketingStoppedEvent:
      title: WhatsAppContactMarketingStoppedEvent
      description: Event of type `whatsapp.contact.marketing_stopped`. A contact asked to stop marketing messages from one of your senders. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_2a4c6e8a0c2e4a6c8e0a2c4e6a8c0e2a
        type:
          type: string
          const: whatsapp.contact.marketing_stopped
          description: Type of the event, always `whatsapp.contact.marketing_stopped`.
          example: whatsapp.contact.marketing_stopped
        timestamp:
          type: string
          format: date-time
          description: When the contact changed the preference, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T10:05:00.000000Z'
        data:
          $ref: '#/components/schemas/WhatsAppContactMarketingPreferenceEventData'
    WhatsAppContactMarketingResumedEvent:
      title: WhatsAppContactMarketingResumedEvent
      description: Event of type `whatsapp.contact.marketing_resumed`. A contact asked to receive marketing messages from one of your senders again. Posted to your webhook and returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same on every delivery attempt and in the event list, so use it to discard duplicates.
          example: evt_8c0e2a4c6e8a4c0e2a4c6e8a0c2e4a6c
        type:
          type: string
          const: whatsapp.contact.marketing_resumed
          description: Type of the event, always `whatsapp.contact.marketing_resumed`.
          example: whatsapp.contact.marketing_resumed
        timestamp:
          type: string
          format: date-time
          description: When the contact changed the preference, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T10:05:00.000000Z'
        data:
          $ref: '#/components/schemas/WhatsAppContactMarketingPreferenceEventData'
    WhatsAppWebhookTestEventData:
      title: WhatsAppWebhookTestEventData
      description: Data of a `test` event. It names the webhook the event was sent to.
      type: object
      additionalProperties: false
      required:
        - webhook_id
      properties:
        webhook_id:
          type: string
          format: uuid
          description: ID of the webhook the test event was sent to, the same as its `uuid`.
          example: 6f1c2a4e-8b3d-4c5e-9f70-1a2b3c4d5e6f
    WhatsAppWebhookTestEvent:
      title: WhatsAppWebhookTestEvent
      description: Event that Wavix posts to a WhatsApp webhook when you send a test event to it. It never appears in the event list.
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event.
          example: evt_3f6c0f5e9b2a4d7c8e1f0a2b3c4d5e6f
        type:
          type: string
          const: test
          description: Type of the event, always `test`.
          example: test
        timestamp:
          type: string
          format: date-time
          description: When the test event was requested, in ISO 8601 UTC with 6 fractional digits (microseconds). It isn't the delivery time in the `webhook-timestamp` header.
          example: '2026-10-21T08:30:00.123456Z'
        data:
          $ref: '#/components/schemas/WhatsAppWebhookTestEventData'
    WhatsAppMessagesGroupEvent:
      title: WhatsAppMessagesGroupEvent
      description: 'Event Wavix posts to your webhook of the `messages` group: a received message, the status of a message you sent, a contact''s marketing preference, or a test event. The `type` field decides the shape of `data`. Wavix can add event types, so ignore a `type` you don''t recognize.'
      oneOf:
        - $ref: '#/components/schemas/WhatsAppMessageReceivedEvent'
        - $ref: '#/components/schemas/WhatsAppMessageSentEvent'
        - $ref: '#/components/schemas/WhatsAppMessageDeliveredEvent'
        - $ref: '#/components/schemas/WhatsAppMessageReadEvent'
        - $ref: '#/components/schemas/WhatsAppMessageFailedEvent'
        - $ref: '#/components/schemas/WhatsAppContactMarketingStoppedEvent'
        - $ref: '#/components/schemas/WhatsAppContactMarketingResumedEvent'
        - $ref: '#/components/schemas/WhatsAppWebhookTestEvent'
      discriminator:
        propertyName: type
        mapping:
          whatsapp.message.received: '#/components/schemas/WhatsAppMessageReceivedEvent'
          whatsapp.message.sent: '#/components/schemas/WhatsAppMessageSentEvent'
          whatsapp.message.delivered: '#/components/schemas/WhatsAppMessageDeliveredEvent'
          whatsapp.message.read: '#/components/schemas/WhatsAppMessageReadEvent'
          whatsapp.message.failed: '#/components/schemas/WhatsAppMessageFailedEvent'
          whatsapp.contact.marketing_stopped: '#/components/schemas/WhatsAppContactMarketingStoppedEvent'
          whatsapp.contact.marketing_resumed: '#/components/schemas/WhatsAppContactMarketingResumedEvent'
          test: '#/components/schemas/WhatsAppWebhookTestEvent'
    WhatsAppTemplatePreviousAttributes:
      title: WhatsAppTemplatePreviousAttributes
      description: Value that the changed attribute of a template had before the change. It holds only that attribute — `category` for `whatsapp.template.category_changed`, `quality_rating` for `whatsapp.template.quality_changed`, and `status` for the status events, such as `whatsapp.template.approved`.
      type: object
      additionalProperties: false
      required: []
      properties:
        status:
          type: string
          description: Template review status before the change. Takes the same values as `status`.
          enum:
            - draft
            - pending
            - approved
            - rejected
            - paused
            - flagged
            - disabled
            - in_appeal
            - pending_deletion
            - deleted
            - unknown
          example: pending
        category:
          type: string
          description: Template category before the change. Takes the same values as `category`.
          enum:
            - marketing
            - authentication
            - utility
          example: utility
        quality_rating:
          type:
            - string
            - 'null'
          description: Template's quality rating before the change, or null when the provider hadn't reported one. Takes the same values as `quality_rating`.
          enum:
            - high
            - medium
            - low
            - unknown
            - null
          example: high
    WhatsAppTemplateEventData:
      title: WhatsAppTemplateEventData
      description: Data of a template event. It carries the template's status, category, and quality rating after the change, and the previous value of the attribute that changed.
      type: object
      additionalProperties: false
      required:
        - template_uuid
        - name
        - language
        - status
        - category
        - quality_rating
        - previous_attributes
      properties:
        template_uuid:
          type: string
          format: uuid
          description: ID of the template, as returned by [Create a WhatsApp template](https://docs.wavix.com/api-reference/whatsapp/create-a-whatsapp-template).
          example: 6b1f3c52-9e0a-4d7b-8a15-c2f4e9d07b38
        name:
          type: string
          description: Template name.
          example: order_shipped
        language:
          type: string
          description: Template language code.
          example: en_US
        status:
          type: string
          description: |-
            Template review status after the change. Possible values:

            - `draft` — The template is created but not yet submitted to the provider.
            - `pending` — The provider is reviewing the template.
            - `approved` — The template is approved and can be sent.
            - `rejected` — The provider rejected the template.
            - `paused` — The provider paused the template.
            - `flagged` — The provider flagged the template. It can still be sent.
            - `disabled` — The template is disabled and can't be sent.
            - `in_appeal` — An appeal of the review decision is in progress.
            - `pending_deletion` — The template is being deleted.
            - `deleted` — The template was deleted.
            - `unknown` — The provider reported a status that Wavix doesn't recognize.
          enum:
            - draft
            - pending
            - approved
            - rejected
            - paused
            - flagged
            - disabled
            - in_appeal
            - pending_deletion
            - deleted
            - unknown
          example: approved
        category:
          type: string
          description: |-
            Template category after the change. Possible values:

            - `marketing` — Promotions, offers, and other marketing content.
            - `authentication` — One-time passcodes for verifying a user.
            - `utility` — Transactional updates about an order or an account.
          enum:
            - marketing
            - authentication
            - utility
