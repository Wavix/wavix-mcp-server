  /v1/speech-analytics:
    post:
      tags:
        - Speech Analytics
      summary: Upload a file
      description: |-
        Uploads an audio file for transcription. Transcription is asynchronous; Wavix sends a POST callback to `callback_url` when it completes, including the `request_id` returned by this request.

        Callback body:
        ```json
           {
                "request_id": "e865ea07-25af-4fdd-876e-04b0d41d5ebd",
                "status": "completed",
                "error": null
           }
        ```

        - `request_id`: ID of the transcription request.
        - `status`: One of `completed` (transcription succeeded) or `failed` (transcription encountered an error).
        - `error`: Error description, or `null` when the transcription succeeded.
      operationId: speech_analytics_create
      security:
        - bearerAuth:
            - calls:write
      x-fern-sdk-group-name:
        - speechAnalytics
      x-fern-sdk-method-name: create
      x-mcp:
        readOnly: false
        destructive: false
        openWorld: false
        expose: false
        toolset: voice_history
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            encoding: {}
            schema:
              required:
                - file
                - callback_url
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  description: Audio file to transcribe. Maximum size is 25 MB. Supported formats are WAV, MP3, and MP4 stereo.
                  format: binary
                callback_url:
                  type: string
                  description: URL that receives the POST callback when transcription completes.
                  example: https://you-site.com/webhook
                insights:
                  type: boolean
                  description: When `true`, generates conversation insights alongside the transcript.
                  example: true
        required: false
      responses:
        '200':
          description: Returns the transcription `request_id` for the uploaded file.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitFileTranscriptionResponse'
              examples:
                default:
                  value:
                    file: file.mp3
                    request_id: e865ea07-25af-4fdd-876e-04b0d41d5ebd
                    success: true
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
      deprecated: false
