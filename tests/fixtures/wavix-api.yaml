    SpeechAnalyticsRetranscribeRequest:
      type: object
      additionalProperties: false
      required:
        - callback_url
      properties:
        callback_url:
          type: string
          description: Callback URL for transcription status updates.
          example: https://you-site.com/webhook
        insights:
          type: boolean
          description: Indicates whether to enable insights generation.
          example: true
    CallWebhookListResponse:
      title: CallWebhookListResponse
      type: array
      description: List of call webhooks configured for the phone number.
      items:
        type: object
        additionalProperties: false
        required:
          - event_type
          - url
        properties:
          event_type:
            type: string
            description: Type of call event the webhook subscribes to. One of `post-call` (delivered once after the call ends) or `on-call` (delivered for in-call events while the call is active).
            enum:
              - post-call
              - on-call
            example: post-call
          url:
            type: string
            format: uri
            description: Webhook URL
            example: https://your-site.com/webhook
    CallWebhooksCreateRequest:
      type: object
      additionalProperties: false
      required:
        - url
        - event_type
      properties:
        url:
          type: string
          format: uri
          description: Webhook URL to send call events to.
          example: https://you-site.com/webhook
        event_type:
          type: string
          description: |-
            Allowed values: `on-call`, `post-call`.
             - `on-call`: Sends real-time status updates
              when a call starts, is answered, and ends.

             - `post-call`: Sends a callback after the call ends
              with disposition, duration, and cost.
          enum:
            - post-call
            - on-call
        expected_url:
          type: string
          description: Applies the change only if the webhook currently has this URL. Pass an empty string to set the webhook only while it is unset, or your own URL to replace your webhook. Setting the URL the webhook already has always succeeds.
          example: ''
    CallWebhook:
      title: CallWebhook
      required:
        - success
        - event_type
        - url
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful.
          example: true
        event_type:
          type: string
          description: Type of call event the webhook subscribes to. One of `post-call` (delivered once after the call ends) or `on-call` (delivered for in-call events while the call is active).
          enum:
            - post-call
            - on-call
          example: post-call
        url:
          type: string
          format: uri
          description: Webhook URL
          example: https://you-site.com/webhook
      description: A call webhook response
    CallDirection:
      type: string
      enum:
        - inbound
        - outbound
      description: Direction of the call. One of `inbound` (call received by the account) or `outbound` (call placed by the account).
    OnCallEventPayload:
      type: object
      description: Payload for the `on_call_event` event type.
      required:
        - type
      properties:
        type:
          type: string
          description: Type of in-call sub-event. One of `audio` (audio playback progress) or `collect` (DTMF digit collection progress).
          enum:
            - audio
            - collect
          example: audio
        payload:
          type:
            - object
            - 'null'
          description: |-
            Sub-event-specific data. Structure depends on the `type` field:
            - `audio`: `{ "status": "started" | "completed", "playback_id": "<uuid>" }`
            - `collect`: `{ "digits": "<digits>", "status": "started" | "completed" | "failed" }`
          example:
            status: completed
            playback_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Call:
      type: object
      additionalProperties: false
      required:
        - uuid
        - id
        - event_type
        - event_time
        - event_payload
        - from
        - to
        - call_started
        - call_answered
        - call_completed
        - machine_detected
        - tag
      properties:
        uuid:
          type: string
          format: uuid
          deprecated: true
          description: Call ID. Deprecated — use `id` instead.
          example: 5dccb6b0-f35c-488c-867b-86fb012c4415
        id:
          type: string
          format: uuid
          description: Call ID. Alias of `uuid`.
          example: 5dccb6b0-f35c-488c-867b-86fb012c4415
        direction:
          $ref: '#/components/schemas/CallDirection'
        event_type:
          type: string
          description: |-
            Most recent lifecycle event for the call. One of:

            - `call_setup` — the call is being initiated.
            - `ringing` — the destination is ringing.
            - `early_media` — early media (such as ringback) is playing before answer.
            - `answered` — the destination answered the call.
            - `completed` — the call ended normally.
            - `busy` — the destination was busy.
            - `cancelled` — the call was cancelled before answer.
            - `rejected` — the destination rejected the call.
            - `on_call_event` — an in-call event occurred (see `event_payload`).
          enum:
            - call_setup
            - ringing
            - early_media
            - answered
            - completed
            - busy
            - cancelled
            - rejected
            - on_call_event
          example: call_setup
        event_time:
          type: string
          format: date-time
          description: Date and time of the latest event in ISO 8601 format.
          example: '2025-09-22T12:56:38.547Z'
        event_payload:
          description: Event-specific metadata.
          oneOf:
            - $ref: '#/components/schemas/OnCallEventPayload'
            - type: 'null'
          example:
            type: audio
            payload:
              status: completed
              playback_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        from:
          type: string
          description: Caller ID.
          example: '+18045961058'
        to:
          type: string
          description: Destination number.
          example: '17653889567'
        call_started:
          type: string
          format: date-time
          description: Date and time when the call started in ISO 8601 format.
          example: '2025-09-22T12:56:38.547Z'
        call_answered:
          type:
            - string
            - 'null'
          format: date-time
          description: Date and time when the call was answered in ISO 8601 format.
        call_completed:
          type:
            - string
            - 'null'
          format: date-time
          description: Date and time when the call ended in ISO 8601 format.
        machine_detected:
          type: boolean
          description: Indicates whether the call was answered by a machine.
          example: false
        tag:
          type: string
          description: Call metadata
          example: marketing-campaign
    CallListResponse:
      type: object
      properties:
        calls:
          type: array
          description: List of calls
          items:
            $ref: '#/components/schemas/Call'
        success:
          type: boolean
          description: Indicates whether the request was successful.
          example: true
      required:
        - calls
        - success
    CallRequest:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - callback_url
      properties:
        from:
          type: string
          description: Caller ID. Must be an active or verified phone number on the account.
          example: '+1234567890'
        to:
          type: string
          description: Destination number in E.164 format
          example: '+1987654321'
        callback_url:
          type: string
          description: The callback URL where Wavix sends the call status updates
          example: https://examples.com/callback
        recording:
          type: boolean
          description: Specifies whether to record the call
          default: false
        voicemail_detection:
          type: boolean
          description: Specifies whether the AMD is turned on for the call
          default: false
        tag:
          type: string
          description: Call metadata
          example: marketing-campaign
        timeout:
          type: integer
          description: The ring timeout, in seconds, before the call is considered unanswered.
          example: 60
    CallCreateResponse:
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          format: uuid
          deprecated: true
          description: Call ID. Deprecated — use `id` instead.
          example: 5dccb6b0-f35c-488c-867b-86fb012c4415
        id:
          type: string
          format: uuid
          description: Call ID. Alias of `uuid`.
          example: 5dccb6b0-f35c-488c-867b-86fb012c4415
        direction:
          $ref: '#/components/schemas/CallDirection'
        event_type:
          type: string
          description: |-
            Most recent lifecycle event for the call. One of:

            - `call_setup` — the call is being initiated.
            - `ringing` — the destination is ringing.
            - `early_media` — early media (such as ringback) is playing before answer.
            - `answered` — the destination answered the call.
            - `completed` — the call ended normally.
            - `busy` — the destination was busy.
            - `cancelled` — the call was cancelled before answer.
            - `rejected` — the destination rejected the call.
            - `on_call_event` — an in-call event occurred (see `event_payload`).
          enum:
            - call_setup
            - ringing
            - early_media
            - answered
            - completed
            - busy
            - cancelled
            - rejected
            - on_call_event
          example: call_setup
        event_time:
          type: string
          format: date-time
          description: Date and time of the latest event
          example: '2025-09-22T12:56:38.547Z'
        event_payload:
          description: Event-specific data
          oneOf:
            - $ref: '#/components/schemas/OnCallEventPayload'
            - type: 'null'
          example:
            type: audio
            payload:
              status: completed
              playback_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        from:
          type: string
          description: Caller ID
          example: '+18045961058'
        to:
          type: string
          description: Destination number
          example: '17653889567'
        call_started:
          type: string
          format: date-time
          description: Date and time when the call started
          example: '2025-09-22T12:56:38.547Z'
        call_answered:
          type:
            - string
            - 'null'
          format: date-time
          description: Date and time when the call was answered
        call_completed:
          type:
            - string
            - 'null'
          format: date-time
          description: Date and time when the call ended
        machine_detected:
          type: boolean
          description: Indicates whether the call was answered by an answering machine
          example: false
        tag:
          type: string
          description: Call metadata
          example: ''
    CallControlValidationErrorResponse:
      title: CallControlValidationErrorResponse
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful. Always `false` for this error.
          example: false
        message:
          type: string
          description: Human-readable summary of the validation failure.
          example: Validation error
        errors:
          type: object
          description: |
            Field-level validation messages, keyed by the offending request
            field name (snake_case). Absent when the request body could not be
            parsed at all (for example, malformed JSON).
          additionalProperties:
            type: string
          example:
            to: required
    CallResponse:
      type: object
      properties:
        call:
          $ref: '#/components/schemas/Call'
        success:
          type: boolean
          description: Indicates whether the request was successful.
          example: true
      required:
        - call
        - success
    UpdateCallRequest:
      type: object
      additionalProperties: false
      required:
        - tag
      properties:
        tag:
          type: string
          description: User-defined label attached to the Call for tracking or reporting.
          example: marketing-campaign
    CallStreamType:
      type: string
      enum:
