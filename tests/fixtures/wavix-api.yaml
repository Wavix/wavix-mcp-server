openapi: 3.1.0
info:
  title: Wavix APIs
  description: Wavix provides robust APIs that let you integrate voice and text messaging features directly into your app. Send text, place calls, and access detailed reports  programmatically.
  termsOfService: https://wavix.com/terms-and-conditions
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Wavix
    url: https://wavix.com
    email: support@wavix.com
  version: 3.0.0
servers:
  - url: https://api.wavix.com
    description: https://api.wavix.com
    variables: {}
security:
  - bearerAuth: []
tags:
  - name: SIP trunks
    description: SIP trunks
  - name: Buy
    description: Numbers
  - name: Cart
    description: Numbers
  - name: My numbers
    description: Numbers
  - name: Billing
    description: Billing, transactions, and invoices
  - name: Profile
    description: Account profile and customer information
  - name: CDRs
    description: Call detail records and call history
  - name: Speech Analytics
    description: Call transcription and speech analytics
  - name: SMS and MMS
    description: Messaging
  - name: Number Validator
    description: Phone number validation
  - name: Link shortener
    description: Short link and click metrics
  - name: 2FA
    description: Two-factor authentication
  - name: 10DLC
    description: 10DLC Campaigns and Brands
  - name: API Keys
    description: API key management
  - name: Call webhooks
    description: Webhook configuration for call events
  - name: Call control
    description: Programmable Voice
  - name: Call streaming
    description: Real-time call audio streaming over WebSocket
  - name: Call recording
    description: Call recording
  - name: Sub-accounts
    description: Sub-account management
  - name: Voice campaigns
    description: Outbound voice campaigns
  - name: Wavix Embeddable
    description: WebRTC embeddable widget
  - name: WhatsApp
    description: WhatsApp senders, templates, messages, webhooks, and events
  - name: WhatsApp webhook payloads
    description: Message, template, sender, and marketing preference events Wavix posts to your WhatsApp webhooks
paths:
  /v1/api-keys:
    get:
      operationId: api_keys_list
      summary: List API keys
      description: Returns the API keys belonging to the authenticated account.
      tags:
        - API Keys
      x-fern-sdk-group-name:
        - apiKeys
      x-fern-sdk-method-name: list
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: account
      parameters:
        - in: query
          name: label
          schema:
            type: string
          description: Filters API keys by `label`. Matches partial values.
          example: production
      responses:
        '200':
          description: Returns the list of API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
              examples:
                default:
                  value:
                    - id: 123
                      label: Production API Key
                      value: abc123def456ghi789jkl012mno345pqr678stu901vwx234yz
                      redacted_value: ...wxyz
                      active: true
                      restricted: true
                      permitted_ips:
                        - 192.168.1.1
                        - 10.0.0.1
                      scopes_enabled: true
                      last_used_at: '2026-04-20T15:42:11Z'
                      numbers:
                        allow: read
                      trunks:
                        allow: none
                      calls:
                        allow: read
                      messages:
                        allow: write
                      recordings:
                        allow: read
                      campaigns:
                        allow: none
                      two_fa:
                        allow: write
                      validator:
                        allow: read
                      webhooks:
                        allow: none
                      embeddable:
                        allow: none
                      billing:
                        allow: read
                      account:
                        allow: read
                      subaccounts:
                        allow: none
                      created_at: '2024-01-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
    post:
      operationId: api_keys_create
      summary: Create an API key
      description: Creates an API key for the authenticated account. Restrict access by listing permitted IP addresses in `permitted_ips`. Store the returned `value` securely. Later reads return `redacted_value`, and `value` on reads is deprecated.
      tags:
        - API Keys
      x-fern-sdk-group-name:
        - apiKeys
      x-fern-sdk-method-name: create
      x-mcp:
        readOnly: false
        destructive: false
        openWorld: false
        expose: true
        toolset: account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
            example:
              label: Production API Key
              active: true
              restricted: true
              permitted_ips:
                - 192.168.1.1
                - 10.0.0.1
              scopes_enabled: true
              numbers:
                allow: read
              calls:
                allow: read
              messages:
                allow: write
              two_fa:
                allow: write
              billing:
                allow: read
      responses:
        '200':
          description: Returns the created API key, including the one-time `value` secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
              examples:
                default:
                  value:
                    id: 123
                    label: Production API Key
                    value: abc123def456ghi789jkl012mno345pqr678stu901vwx234yz
                    redacted_value: ...wxyz
                    active: true
                    restricted: true
                    permitted_ips:
                      - 192.168.1.1
                      - 10.0.0.1
                    scopes_enabled: true
                    last_used_at: null
                    numbers:
                      allow: read
                    trunks:
                      allow: none
                    calls:
                      allow: read
                    messages:
                      allow: write
                    recordings:
                      allow: none
                    campaigns:
                      allow: none
                    two_fa:
                      allow: write
                    validator:
                      allow: none
                    webhooks:
                      allow: none
                    embeddable:
                      allow: none
                    billing:
                      allow: read
                    account:
                      allow: none
                    subaccounts:
                      allow: none
                    created_at: '2024-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '422':
          description: Returns a validation error when a field value is invalid.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                ip_invalid:
                  summary: Invalid IP address
                  value:
                    success: false
                    message: Ip has incorrect format
                scope_not_hash:
                  summary: Scope value is not an object
                  value:
                    success: false
                    message: 'API key scope numbers: must be a hash'
                scope_extra_keys:
                  summary: Scope object has unexpected keys
                  value:
                    success: false
                    message: 'API key scope numbers: must have only "allow" key'
                scope_invalid_allow:
                  summary: Unsupported allow value
                  value:
                    success: false
                    message: 'API key scope numbers: allow must be one of: none, read, write'
  /v1/api-keys/{id}:
    patch:
      operationId: api_keys_update
      summary: Update an API key
      description: Updates an API key identified by `id`. Only the provided fields are changed.
      tags:
        - API Keys
      x-fern-sdk-group-name:
        - apiKeys
      x-fern-sdk-method-name: update
      x-mcp:
        readOnly: false
        destructive: false
        openWorld: false
        expose: true
        toolset: account
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The unique ID of the API key.
          example: 123
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyUpdateRequest'
            example:
              active: true
              restricted: true
              scopes_enabled: true
              permitted_ips:
                - 192.168.1.1
                - 10.0.0.1
              label: Production API Key
        required: false
      responses:
        '200':
          description: Returns the updated API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      operationId: api_keys_delete
      summary: Delete an API key
      description: Deletes the API key identified by `id`. Deletion is permanent and revokes the key immediately.
      tags:
        - API Keys
      x-fern-sdk-group-name:
        - apiKeys
      x-fern-sdk-method-name: delete
      x-mcp:
        readOnly: false
        destructive: true
        openWorld: false
        expose: true
        toolset: account
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The unique ID of the API key.
          example: 123
      responses:
        '200':
          description: Returns a success confirmation. The API key is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /v1/trunks:
    get:
      tags:
        - SIP trunks
      summary: List SIP trunks
      description: Returns a paginated list of SIP trunks for the authenticated account.
      operationId: sip_trunks_list
      security:
        - bearerAuth:
            - trunks:read
      x-fern-sdk-group-name:
        - sipTrunks
      x-fern-sdk-method-name: list
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: voice_config
      parameters:
        - name: page
          in: query
          description: Page number to retrieve. Default `1`.
          style: form
          schema:
            type: integer
            format: int32
        - name: per_page
          in: query
          description: Number of records to return per page. Default `25`.
          style: form
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Returns a paginated list of SIP trunks.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPTrunkListResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    sip_trunks:
                      - id: 3107
                        label: My trunk
                        name: '32882'
                        auth_method: IP auth
                        callerid: '14302287001'
                        host_request:
                          host: 127.0.0.1
                          status: pending
                        encrypted_media: false
                        passthrough: false
                        multiple_numbers: true
                        status: pending
                        charge: '24.637'
                        talk_time: 65
                        machine_detection_enabled: true
                        call_recording_enabled: true
                        transcription_enabled: true
                        transcription_threshold: 6
                        access_token: siped7a3f5c1b9e042d6f8a4c2e7b9d1f3a5c8e0b2d4f6a8c0e2d4b6f8a1c3e5d7
                    pagination:
                      current_page: 1
                      total: 1
                      per_page: 25
                      total_pages: 1
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
      deprecated: false
    post:
      tags:
        - SIP trunks
      summary: Create a SIP trunk
      description: Creates a SIP trunk for routing inbound and outbound calls. Returns the trunk with its generated `access_token`.
      operationId: sip_trunks_create
      security:
        - bearerAuth:
            - trunks:write
      x-fern-sdk-group-name:
        - sipTrunks
      x-fern-sdk-method-name: create
      x-mcp:
        readOnly: false
        destructive: false
        openWorld: false
        expose: true
        toolset: voice_config
      parameters: []
      requestBody:
        description: Attributes for the new SIP trunk.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIPTrunkCreateRequest'
        required: true
      responses:
        '201':
          description: Returns the created SIP trunk.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPTrunkResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    id: 293
                    name: '67758'
                    callerid: example
                    label: example
                    ip_restrict: false
                    allowed_ips:
                      - id: 6712
                        ip: 127.0.0.1
                    channels_restrict: false
                    max_channels: 123
                    cost_limit: false
                    max_call_cost: example
                    call_restrict: false
                    call_limit: 123
                    didinfo_enabled: true
                    rewrite_enabled: false
                    rewrite_prefix: example
                    rewrite_cond: example
                    call_recording_enabled: false
                    machine_detection_enabled: false
                    transcription_enabled: false
                    transcription_threshold: 6
                    created_at: '2023-06-15T10:30:00Z'
                    host: example
                    multiple_numbers: true
                    encrypted_media: true
                    access_token: siped7a3f5c1b9e042d6f8a4c2e7b9d1f3a5c8e0b2d4f6a8c0e2d4b6f8a1c3e5d7
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
      deprecated: false
  /v1/trunks/{id}:
    get:
      tags:
        - SIP trunks
      summary: Retrieve a SIP trunk
      description: Returns the SIP trunk identified by `id`.
      operationId: sip_trunks_get
      security:
        - bearerAuth:
            - trunks:read
      x-fern-sdk-group-name:
        - sipTrunks
      x-fern-sdk-method-name: get
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: voice_config
      parameters:
        - name: id
          in: path
          description: The unique ID of the SIP trunk.
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            example: 3107
      responses:
        '200':
          description: Returns the SIP trunk.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPTrunkResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    id: 293
                    name: '67758'
                    callerid: '12345678900'
                    label: My trunk
                    ip_restrict: false
                    allowed_ips:
                      - id: 6712
                        ip: 127.0.0.1
                    channels_restrict: false
                    max_channels: 2
                    cost_limit: true
                    max_call_cost: '0.18'
                    call_restrict: false
                    call_limit: 3600
                    didinfo_enabled: true
                    rewrite_enabled: true
                    rewrite_prefix: '1'
                    rewrite_cond: example
                    call_recording_enabled: true
                    machine_detection_enabled: true
                    transcription_enabled: false
                    transcription_threshold: 10
                    created_at: '2023-05-16T17:13:25.000Z'
                    host: dynamic
                    multiple_numbers: true
                    encrypted_media: true
                    access_token: 123easwqe321132
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          description: Returns when no SIP trunk matches `id`, or the account is not provisioned for SIP trunks.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    success: false
                    message: The service is not provisioned for your account.
      deprecated: false
    put:
      tags:
        - SIP trunks
      summary: Update a SIP trunk
      description: 'Updates the SIP trunk identified by `id`. Only the provided fields are changed. On trial accounts, every update also applies the trial limits: a `call_limit` of at most 300 seconds (300 when omitted) and one concurrent call.'
      operationId: sip_trunks_update
      security:
        - bearerAuth:
            - trunks:write
      x-fern-sdk-group-name:
        - sipTrunks
      x-fern-sdk-method-name: update
      x-mcp:
        readOnly: false
        destructive: true
        openWorld: false
        expose: true
        toolset: voice_config
      parameters:
        - name: id
          in: path
          description: The unique ID of the SIP trunk.
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            example: 3107
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIPTrunkUpdateRequest'
        required: true
      responses:
        '200':
          description: Returns the updated SIP trunk.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPTrunkResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    id: 293
                    name: '67758'
                    callerid: '12345678900'
                    label: My trunk
                    ip_restrict: false
                    allowed_ips:
                      - id: 6712
                        ip: 127.0.0.1
                    channels_restrict: false
                    max_channels: 2
                    cost_limit: true
                    max_call_cost: '0.18'
                    call_restrict: false
                    call_limit: 3600
                    didinfo_enabled: true
                    rewrite_enabled: true
                    rewrite_prefix: '1'
                    rewrite_cond: example
                    call_recording_enabled: true
                    machine_detection_enabled: true
                    transcription_enabled: false
                    transcription_threshold: 10
                    created_at: '2023-05-16T17:13:25.000Z'
                    host: dynamic
                    multiple_numbers: true
                    encrypted_media: true
                    access_token: 123easwqe321132
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
      deprecated: false
    delete:
      tags:
        - SIP trunks
      summary: Delete a SIP trunk
      description: Deletes the SIP trunk identified by `id`. Deletion is permanent and stops call routing through the trunk.
      operationId: sip_trunks_delete
      security:
        - bearerAuth:
            - trunks:write
      x-fern-sdk-group-name:
        - sipTrunks
      x-fern-sdk-method-name: delete
      x-mcp:
        readOnly: false
        destructive: true
        openWorld: false
        expose: true
        toolset: voice_config
      parameters:
        - name: id
          in: path
          description: The unique ID of the SIP trunk.
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            example: 3107
      responses:
        '200':
          description: Returns a success confirmation. The SIP trunk is deleted.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    success: true
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
      deprecated: false
  /v1/buy/countries:
    get:
      tags:
        - Buy
      summary: List countries
      description: Returns a list of countries where phone numbers are available.
      operationId: buy_countries_list
      security:
        - bearerAuth:
            - numbers:read
      x-fern-sdk-group-name:
        - buy
        - countries
      x-fern-sdk-method-name: list
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: numbers
      parameters:
        - name: text_enabled_only
          in: query
          description: When `true`, returns only countries that offer text-enabled phone numbers.
          style: form
          explode: true
          schema:
            type: boolean
      responses:
        '200':
          headers: {}
          description: Returns the list of countries with available phone numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'
              examples:
                default:
                  value:
                    countries:
                      - id: 8669
                        has_provinces_or_states: false
                        name: Argentina
                      - id: 8650
                        has_provinces_or_states: true
                        name: Australia
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
      deprecated: false
  /v1/buy/countries/{country_id}/regions:
    get:
      tags:
        - Buy
      summary: List regions
      description: Returns a list of regions (states or provinces) for countries where `has_provinces_or_states` is `true`.
      operationId: buy_regions_list
      security:
        - bearerAuth:
            - numbers:read
      x-fern-sdk-group-name:
        - buy
        - regions
      x-fern-sdk-method-name: list
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: numbers
      parameters:
        - name: country_id
          in: path
          description: The unique ID of the country.
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            example: 1892
        - name: text_enabled_only
          in: query
          description: When `true`, returns only regions that offer text-enabled numbers.
          style: form
          explode: true
          schema:
            type: boolean
      responses:
        '200':
          description: Returns the list of regions.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    regions:
                      - id: 13
                        name: Alabama
                      - id: 15
                        name: Arizona
                      - id: 16
                        name: Arkansas
                      - id: 17
                        name: California
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '422':
          $ref: '#/components/responses/CountryHasNoRegionsErrorResponse'
      deprecated: false
  /v1/buy/countries/{country_id}/cities:
    get:
      tags:
        - Buy
      summary: List cities
      description: |-
        Returns a list of cities for countries where
         `has_provinces_or_states` is `false`.
      operationId: buy_cities_list
      security:
        - bearerAuth:
            - numbers:read
      x-fern-sdk-group-name:
        - buy
        - cities
      x-fern-sdk-method-name: list
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: numbers
      parameters:
        - name: country_id
          in: path
          description: The unique ID of the country.
          required: true
          style: simple
          schema:
            type: integer
            format: int32
            example: 1891
        - name: text_enabled_only
          in: query
          description: When `true`, returns only cities that offer text-enabled numbers.
          style: form
          explode: true
          schema:
            type: boolean
      responses:
        '200':
          description: Returns the list of cities.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityListResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    cities:
                      - area_code: 113
                        id: 128791
                        name: Buenos Aires
                      - area_code: 341
                        id: 132655
                        name: Rosario
                      - area_code: 351
                        id: 132656
                        name: Cordoba
                      - area_code: 381
                        id: 141803
                        name: Tucuman
                      - area_code: 387
                        id: 141986
