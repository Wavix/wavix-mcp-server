        - twoway
      description: Specifies the streaming type. Can be either `oneway` for unidirectional or `twoway` for bidirectional streaming.
    CallStreamChannel:
      type: string
      enum:
        - inbound
        - outbound
        - both
      description: 'Audio channel to stream: `inbound` streams the incoming channel (to Wavix), `outbound` the outbound channel (from Wavix), and `both` both channels. For bidirectional call streaming, this setting is ignored and only the inbound channel is streamed.'
    CallAnswerRequest:
      type: object
      additionalProperties: false
      properties:
        call_recording:
          type: boolean
          description: Indicates whether the call should be recorded.
          default: false
        call_transcription:
          type: boolean
          description: Indicates whether the call should be transcribed after it ends.
          default: false
        stream_url:
          type: string
          format: uri
          description: WebSocket URL (`ws://` or `wss://`) that receives the call's audio, which can include the caller's voice.
          example: wss://examples.com/stream
        stream_type:
          description: Direction of audio streamed to `stream_url`.
          example: twoway
          $ref: '#/components/schemas/CallStreamType'
          type: string
        stream_channel:
          description: Audio channel streamed to `stream_url`.
          example: inbound
          $ref: '#/components/schemas/CallStreamChannel'
          type: string
    CallStreamCreateRequest:
      type: object
      additionalProperties: false
      required:
        - stream_url
        - stream_type
        - stream_channel
      properties:
        stream_url:
          type: string
          format: uri
          description: WebSocket URL (`ws://` or `wss://`) that receives the call's audio.
          example: wss://examples.com/stream
