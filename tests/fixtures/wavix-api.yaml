          example: '0.0'
        uuid:
          type: string
          deprecated: true
          description: Call ID. Deprecated — use `call_id` instead.
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        call_id:
          type: string
          description: Call ID. Alias of `uuid`.
