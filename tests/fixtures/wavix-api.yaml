          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: to_date
          in: query
          required: false
          description: Filters messages to those created on or before the end of this date in your account's time zone, in `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
          example: '2026-01-31'
