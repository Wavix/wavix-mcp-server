    WhatsAppTemplateTextHeaderComponentRequest:
      title: WhatsAppTemplateTextHeaderComponentRequest
      description: Text header of a new WhatsApp template. Requires `text`. Consumed by `whatsapp_templates_create`.
      type: object
      additionalProperties: false
      required:
        - type
        - format
        - text
      properties:
        type:
          type: string
          description: Component type.
          const: header
        format:
          type: string
          description: Header content format.
          const: text
        text:
          type: string
          description: Header text, with an optional `{{1}}` placeholder.
          example: Order {{1}}
        example:
          type: object
          description: Sample for the `{{1}}` placeholder.
          additionalProperties: false
          required:
            - header_text
          properties:
            header_text:
              type: array
              description: Sample value for the `{{1}}` placeholder in the header text.
              minItems: 1
              maxItems: 1
              items:
                type: string
              example:
                - '#1001'
    WhatsAppTemplateMediaHeaderComponentRequest:
      title: WhatsAppTemplateMediaHeaderComponentRequest
      description: Media header of a new WhatsApp template. Takes no `text`. Consumed by `whatsapp_templates_create`.
      type: object
      additionalProperties: false
      required:
        - type
        - format
      properties:
        type:
          type: string
          description: Component type.
          const: header
        format:
          type: string
          description: |-
            Header content format. Possible values:

            - `image` — Image header.
            - `video` — Video header.
            - `document` — Document header.
          enum:
            - image
            - video
            - document
          example: image
        example:
          type: object
          description: Sample media file.
          additionalProperties: false
          required:
            - header_handle
          properties:
            header_handle:
              type: array
              description: Public `http` or `https` URL of a sample media file. Meta's own API expects an upload handle here; Wavix sends the URL to the provider as the sample.
              minItems: 1
              maxItems: 1
              items:
                type: string
              example:
