      description: Unauthorized
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedErrorResponse'
    ForbiddenErrorResponse:
      description: Request failed. The feature is disabled for your account.
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenErrorResponse'
    BadRequestErrorResponse:
      description: Request failed. Missing or invalid parameter <param_name>
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NotFoundErrorResponse:
      description: Request failed. An object with the specified ID is not found.
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundErrorResponse'
    ValidationErrorResponse:
      description: Validation error
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    CountryHasNoRegionsErrorResponse:
      description: Country has no states or provinces
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CountryHasNoRegionsErrorResponse'
    WebhookInUseErrorResponse:
      description: Request failed. The webhook has a different URL than `expected_url` or `expected_sms_relay_url`; nothing was changed.
      headers: {}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookInUseErrorResponse'
    TooManyRequestsErrorResponse:
      description: Too many requests
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          schema:
            type: integer
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsErrorResponse'
    WhatsAppUnauthorizedResponse:
      description: Authentication failed or wasn't provided, or the account is suspended, blocked, or has no subscription plan.
      headers: {}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            authentication-required:
              summary: The API key or token is missing or isn't valid
              value:
                type: https://docs.wavix.com/errors/authentication-required
                title: Authentication Required
                status: 401
                detail: Authentication is required to access this resource.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: AUTHENTICATION_REQUIRED
            account-suspended:
              summary: The account is suspended
              value:
                type: https://docs.wavix.com/errors/authentication-required
                title: Authentication Required
                status: 401
                detail: The account is suspended.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: AUTHENTICATION_REQUIRED
            account-blocked:
              summary: The account is blocked
              value:
                type: https://docs.wavix.com/errors/authentication-required
                title: Authentication Required
                status: 401
                detail: The account is blocked.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: AUTHENTICATION_REQUIRED
            account-without-plan:
              summary: The account has no subscription plan
              value:
                type: https://docs.wavix.com/errors/authentication-required
                title: Authentication Required
                status: 401
                detail: The account has no subscription plan.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: AUTHENTICATION_REQUIRED
    WhatsAppForbiddenResponse:
      description: Returns when the API key doesn't have the scope the operation needs, or the request isn't allowed for the account's region.
      headers: {}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            access-denied:
              value:
                type: https://docs.wavix.com/errors/access-denied
                title: Access Denied
                status: 403
                detail: The API key has no access to this resource.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: ACCESS_DENIED
    WhatsAppChannelUnavailableResponse:
      description: WhatsApp isn't available for your account, or the WhatsApp channel isn't enabled for it yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            whatsapp-not-available:
              summary: WhatsApp is not available for this account
              value:
                type: https://docs.wavix.com/errors/whatsapp-not-available
                title: WhatsApp Not Available
                status: 404
                detail: WhatsApp is not available for this account.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: WHATSAPP_NOT_AVAILABLE
            channel-not-enabled:
              summary: WhatsApp is not enabled yet for this account
              value:
                type: https://docs.wavix.com/errors/channel-not-enabled
                title: Channel Not Enabled
                status: 404
                detail: The WhatsApp channel is not enabled for this account.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: CHANNEL_NOT_ENABLED
    WhatsAppTooManyRequestsResponse:
      description: Returns when the account has exceeded its request rate limit.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          schema:
            type: integer
            example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            rate-limited:
              value:
                type: https://docs.wavix.com/errors/rate-limited
                title: Rate Limited
                status: 429
                detail: Too many requests. Try again later.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: rate_limited
                error_code: RATE_LIMITED
    WhatsAppInternalServerErrorResponse:
      description: Returns when an unexpected error occurs on the server; the request may be retried.
      headers: {}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            internal-error:
              value:
                type: https://docs.wavix.com/errors/internal-error
                title: Internal Error
                status: 500
                detail: Internal Error
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: retriable
                error_code: INTERNAL_ERROR
    WhatsAppServiceUnavailableResponse:
      description: Returns when the service is temporarily unavailable; the request may be retried.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            service-unavailable:
              value:
                type: https://docs.wavix.com/errors/service-unavailable
                title: Service Unavailable
                status: 503
                detail: The service is temporarily unavailable.
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: retriable
                error_code: SERVICE_UNAVAILABLE
    WhatsAppBadRequestResponse:
      description: The `direction`, `from`, or `to` query parameter is invalid. The `detail` field says which one.
      headers: {}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WhatsAppProblem'
          examples:
            invalid-request:
              value:
                type: https://docs.wavix.com/errors/invalid-request
                title: Invalid Request
                status: 400
                detail: direction must be inbound or outbound
                instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                error_class: permanent
                error_code: INVALID_REQUEST
  parameters:
    WhatsAppPageParam:
      name: page
      in: query
      description: Page number to retrieve. Page numbering starts at 1. Defaults to 1.
      schema:
        type: integer
        format: int32
        default: 1
      example: 1
    WhatsAppPerPageParam:
      name: per_page
      in: query
      description: Number of records to return per page. Defaults to 25. Values above 100 are treated as 100.
      schema:
        type: integer
        format: int32
        default: 25
      example: 25
    WhatsAppWebhookIdHeader:
      name: webhook-id
      in: header
      required: true
      description: ID of the event, the same as `id` in the body. It's the same on every delivery attempt and is part of the signed content.
      schema:
        type: string
        pattern: ^evt_[0-9a-f]{32}$
      example: evt_3f6c0f5e9b2a4d7c8e1f0a2b3c4d5e6f
    WhatsAppWebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Time this attempt was sent, in Unix seconds. It's part of the signed content and changes on every attempt. Reject a request whose timestamp is more than 5 minutes away from your clock.
      schema:
        type: integer
        format: int64
      example: 1792571400
    WhatsAppWebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: Space-separated signatures, each `v1,` plus the Base64 HMAC-SHA256 of `webhook-id`, `webhook-timestamp`, and the raw body joined by periods. The key is the Base64-decoded secret without `whsec_`.
      schema:
        type: string
        pattern: ^v1,[A-Za-z0-9+/]{43}=( v1,[A-Za-z0-9+/]{43}=)*$
      example: v1,rnhX+FJ2ZEwDslc495Cj7SxoGvZxHD8Ia/jpaEt0XqM=
