        feedback: null
        first_name: John
        last_name: Dow
        mock: false
        phone_number: '12123450099'
        state_or_province: FL
        status: VERIFIED
        stock_exchange: null
        stock_symbol: null
        street_address: 10, Street name
        updated_at: '2024-07-24T08:29:09'
        vertical: HEALTHCARE
        website: https://brand.com
        zip: '12345'
