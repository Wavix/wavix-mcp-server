                        language: en_US
                        category: utility
                        status: approved
                        quality_rating: high
                        submitted_at: '2026-01-15T10:30:00Z'
                        components:
                          - type: body
                            text: Hi {{1}}, your order {{2}} has shipped.
                            example:
                              body_text:
