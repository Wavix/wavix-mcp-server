        - PUBLIC_PROFIT
        - NON_PROFIT
        - GOVERNMENT
      type: string
      description: Legal entity type of the 10DLC Brand. One of `PRIVATE_PROFIT` (privately held for-profit company), `PUBLIC_PROFIT` (publicly traded for-profit company), `NON_PROFIT` (non-profit organization), or `GOVERNMENT` (government entity).
      example: PRIVATE_PROFIT
    TenDLCBrandIdentityVerificationStatus:
      title: TenDLCBrandIdentityVerificationStatus
      enum:
        - REVIEW
        - VERIFIED
        - UNVERIFIED
        - VETTED_VERIFIED
        - SUSPENDED
      type: string
      description: |-
        Identity verification status of the 10DLC Brand. One of:

        - `REVIEW` — verification is in progress.
        - `VERIFIED` — the Brand passed standard verification.
        - `UNVERIFIED` — verification has not succeeded.
        - `VETTED_VERIFIED` — the Brand also passed third-party vetting.
        - `SUSPENDED` — the Brand is blocked from sending.
    TenDLCBrand:
      title: TenDLCBrand
      required:
        - brand_id
        - dba_name
        - company_name
        - entity_type
        - vertical
        - ein_taxid
        - ein_taxid_country
        - status
        - first_name
        - last_name
        - phone_number
        - email
        - street_address
        - city
        - country
        - zip
        - feedback
        - created_at
        - updated_at
      type: object
      additionalProperties: false
      properties:
        brand_id:
          type: string
          description: Unique identifier of the Brand assigned by the registry.
          example: BM20QP9
        dba_name:
          type: string
          description: Doing-business-as name, or the public-facing brand name.
          example: Brand
        company_name:
          type: string
          description: Registered legal name of the company that owns the Brand.
          example: Company
        entity_type:
          $ref: '#/components/schemas/TenDLCBrandEntityType'
          description: Company entity type.
          example: PRIVATE_PROFIT
          type: string
        vertical:
          type: string
          description: Industry vertical the Brand operates in.
          example: HEALTHCARE
        ein_taxid:
          type: string
          description: IRS Employer Identification Number (EIN) or other tax ID of the company.
          example: '999999999'
        ein_taxid_country:
          type: string
          description: ISO 3166-1 alpha-2 country code where the Tax ID was issued.
          example: US
        status:
          $ref: '#/components/schemas/TenDLCBrandIdentityVerificationStatus'
          description: Brand identity verification status.
          example: VERIFIED
          type: string
        website:
          type:
            - string
            - 'null'
          description: Business website URL.
          example: https://brand.com
        stock_symbol:
          type:
            - string
            - 'null'
          description: Stock ticker symbol of the company. Required for publicly traded companies.
        stock_exchange:
          type:
            - string
            - 'null'
          description: Code of the stock exchange the company is listed on. Required for publicly traded companies.
        first_name:
          type: string
          description: Business contact first name.
          example: John
        last_name:
          type: string
          description: Business contact last name.
          example: Dow
        phone_number:
          type: string
          description: Support contact phone number in E.164 format.
          example: '12123450099'
        email:
          type: string
          description: Support contact email address.
          example: support@brand.com
        street_address:
          type: string
          description: Street address of the business.
          example: 10, City Name
        city:
          type: string
          description: City of the business address.
          example: Miami
        state_or_province:
          type:
            - string
            - 'null'
          description: State or province of the business address.
          example: FL
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the business address.
          example: US
        zip:
          type: string
          description: ZIP or postal code of the business address.
          example: '12345'
        feedback:
          type:
            - string
            - 'null'
          description: Feedback from the identity verification process explaining the current `status`.
        mock:
          type: boolean
          description: Indicates whether the Brand is a mock brand for testing.
          default: false
          example: false
        created_at:
          type: string
          description: Timestamp when the Brand was created, in ISO 8601 format.
          example: '2024-07-24T08:29:09'
        updated_at:
          type: string
          description: Timestamp when the Brand was last updated, in ISO 8601 format.
          example: '2024-07-24T08:29:09'
      description: Represents a 10DLC brand registered for application-to-person messaging. A Brand identifies the business behind one or more messaging campaigns.
      example:
        brand_id: BM20QP9
        city: Miami
        company_name: Company legal name
        country: US
        created_at: '2024-07-24T08:10:49'
        dba_name: New Brand
        ein_taxid: '12345'
        ein_taxid_country: US
        email: support@brand.com
