              schema:
                $ref: '#/components/schemas/WhatsAppProblem'
              examples:
                service-window-closed:
                  summary: The service window is closed
                  value:
                    type: https://docs.wavix.com/errors/service-window-closed
                    title: Service Window Closed
                    status: 422
                    detail: The recipient hasn't messaged this sender in the last 24 hours. Send a template instead.
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: SERVICE_WINDOW_CLOSED
                    service_window_closed_at: '2026-01-14T09:15:00.000Z'
        '429':
          $ref: '#/components/responses/WhatsAppTooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/WhatsAppInternalServerErrorResponse'
