    get:
      tags:
        - WhatsApp
      summary: List WhatsApp messages
      description: |-
        Returns a paginated list of the WhatsApp messages your account sent and received, each with its direction, delivery status, and phone numbers, and the content of the messages customers sent.

        Messages that customers send to your senders appear here alongside the messages you sent.

        **Behavior:** Messages are ordered from newest to oldest. If `direction` isn't specified, the response includes both directions, and when several filters are specified, a message must match all of them. Returns `400` when `direction`, `from`, or `to` isn't valid.

        **Requires:** Your account must have WhatsApp enabled, must have a subscription plan, and must not be blocked or suspended.
      operationId: whatsapp_messages_list
      security:
        - bearerAuth:
            - whatsapp:read
      x-fern-sdk-group-name:
        - whatsapp
        - messages
      x-fern-sdk-method-name: list
      x-fern-ignore: true
      x-fern-pagination:
        offset: $request.page
        results: $response.messages
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: messaging
      parameters:
        - name: direction
          in: query
          required: false
          description: |-
            Filters messages by direction. Possible values:

            - `outbound` — The message was sent from your account to a recipient.
            - `inbound` — A customer sent the message to one of your senders.
          schema:
            type: string
            enum:
              - outbound
              - inbound
          example: outbound
        - name: status
          in: query
          required: false
          description: |-
            Filters messages by delivery status. A filter matches that status only, so `delivered` doesn't include `read` messages. Inbound messages always have `delivered` status. Possible values:

            - `sent` — The message isn't delivered yet.
            - `delivered` — The message was delivered to the recipient.
            - `read` — The recipient opened the message. WhatsApp reports it only when the recipient has read receipts turned on.
            - `undelivered` — The message was sent but not delivered.
            - `expired` — The message expired before it was delivered.
            - `rejected` — The message was permanently rejected before or by the provider.
            - `unknown` — The provider hasn't reported a status.
          schema:
            type: string
            enum:
              - sent
              - delivered
              - read
              - undelivered
              - expired
              - rejected
              - unknown
          example: delivered
        - name: from
          in: query
          required: false
          description: Filters messages by the `from` phone number, in E.164 format. The leading `+` is optional.
          schema:
            type: string
            pattern: ^\+?\d{6,20}$
          example: '+14155550100'
        - name: to
