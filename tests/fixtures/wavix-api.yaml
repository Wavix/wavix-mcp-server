          description: Indicates if outbound call recording is enabled on the SIP trunk. Available for `Flex Pro` customers only.
          default: false
          example: true
        machine_detection_enabled:
          type: boolean
          description: Indicates if automatic voicemail detection is enabled on the SIP trunk. Available for `Flex Pro` customers only.
          default: false
          example: true
        transcription_enabled:
          type: boolean
          description: Indicates if automatic call transcription is enabled on the SIP trunk. Available for `Flex Pro` customers only.
          default: false
