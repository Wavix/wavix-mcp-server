    InboundCallTransport:
      title: InboundCallTransport
      enum:
        - 1
        - 4
        - 5
      x-enum-varnames:
        - SIP_URI
        - PSTN
        - SIP_TRUNK
      type: integer
      description: Transport used to route the inbound call to its destination. One of `1` (SIP URI), `4` (PSTN phone number), or `5` (SIP trunk on the platform).
    InboundCallDestination:
      title: InboundCallDestination
      required:
        - id
        - destination
        - priority
        - transport
        - trunk_id
        - trunk_label
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Unique identifier of the inbound call destination
          format: int32
          example: 1
        destination:
          type: string
          description: The destination for inbound call routing. Can be either a SIP URI, a PSTN phone number or system-generated login of a SIP trunk on the platform.
          example: '[did]@sipuri.com'
        priority:
          type: integer
          description: For phone numbers with several destinations, sets the order in which the platform routes inbound calls. The lower the value, the higher the priority.
          format: int32
          example: 1
        transport:
          $ref: '#/components/schemas/InboundCallTransport'
        trunk_id:
          type:
            - integer
            - 'null'
          description: Unique identified of a SIP trunk on the platform. In cases when `transport:5`, otherwise, `null`
          format: int32
          example: 23123
        srtp:
          type: boolean
          description: Indicates whether SRTP media encryption is enabled for this destination.
          example: false
        trunk_label:
          type:
            - string
            - 'null'
          description: A user-defined name of a SIP trunk on the platform. In cases when `transport:5`, otherwise, `null`
          example: My trunk
      description: Inbound call destination
    NumberDocument:
      title: NumberDocument
      required:
        - id
        - allow_replace
        - did_number
        - doc_content_type
        - doc_file_name
        - doc_type
        - status
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Unique identifier of the uploaded document
          format: int32
          example: 1
        allow_replace:
          type: boolean
          description: Indicates whether the document can be replaced. Only documents with `rejected` status can be replaced.
          example: false
        did_number:
          type: string
          description: The phone number the document was uploaded for
          example: '12565378257'
        doc_content_type:
          type: string
          description: The uploaded content type identified by the platform
          example: image/png
        doc_file_name:
          type: string
          description: The uploaded document name
          example: Copy of ID.png
        doc_type:
          anyOf:
            - $ref: '#/components/schemas/DocumentType'
            - type: 'null'
          description: Document type.
        status:
          type: string
          description: Status of the uploaded document. Can be either `approved`, `pending`, or `rejected`
      description: A document uploaded for a phone number
      example:
        id: 423
        allow_replace: false
        did_number: '12565378257'
        doc_content_type: image/png
        doc_file_name: Copy of ID.png
        doc_type: id
        status: approved
