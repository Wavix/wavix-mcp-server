  WhatsAppTemplateChanged:
    post:
      summary: WhatsApp template changed
      operationId: whatsapp_template_changed
      security: []
      description: |-
        Wavix sends these events to your webhook of the `templates` group when the review status, category, or quality rating of one of your templates changes, so you learn that a template is approved or rejected without polling it. A test event you send to the webhook arrives here too.

        Each change is a separate event, and `type` names it, so your server keeps its copy of a template's review status, category, and quality rating current.

        **Behavior:** Return a 2xx status within 10 seconds to acknowledge the event; Wavix doesn't follow redirects, so a 3xx response counts as a failed attempt. After a failed attempt, Wavix retries about 5 seconds, 30 seconds, 2 minutes, 10 minutes, 1 hour, 6 hours, and 24 hours later, up to 8 attempts in total; a `test` event isn't retried. Events can arrive more than once and out of order, so discard repeats by `id` and keep the state from the event with the latest `timestamp`.

        **Requires:** A webhook of the `templates` group. A disabled webhook gets only test events. Its URL must use `https`, have a valid TLS certificate, and resolve only to public addresses that Wavix allows. If the host resolves to another address at send time, Wavix doesn't send the event and doesn't retry it. Verify every request as the [Standard Webhooks](https://www.standardwebhooks.com/) specification describes, with one of its libraries or by hand. The `webhook-signature` and `webhook-timestamp` headers give the steps.

        **Limits:** [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events) keeps each event except `test` for 30 days, so you can catch up on events your server missed within that time.
      tags:
        - WhatsApp webhook payloads
      parameters:
        - $ref: '#/components/parameters/WhatsAppWebhookIdHeader'
        - $ref: '#/components/parameters/WhatsAppWebhookTimestampHeader'
        - $ref: '#/components/parameters/WhatsAppWebhookSignatureHeader'
      requestBody:
        required: true
        description: The event Wavix posts to your webhook URL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppTemplatesGroupEvent'
            examples:
              approved:
                summary: The template was approved
                value:
                  id: evt_4c6e8a0b2d4f4a6c8e0b2d4f6a8c0e2d
                  type: whatsapp.template.approved
