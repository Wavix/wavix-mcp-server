    TenDLCBrandVettingAppeal:
      title: TenDLCBrandVettingAppeal
      description: Represents an appeal against a 10DLC brand vetting result. An appeal asks the vetting provider to reconsider the assigned score.
      required:
        - appeal_outcome
        - appeal_status
        - appeal_status_update_date
        - attachment_uuid_list
        - brand_id
        - category_list
        - create_date
        - explanation
        - evp_id
        - vetting_class
        - vetting_id
      type: object
      additionalProperties: false
      properties:
        appeal_outcome:
          allOf:
            - $ref: '#/components/schemas/TenDLCBrandVettingAppealOutcome'
            - description: Outcome of the appeal, including the revised vetting status and score.
              example:
                vet_status: ACTIVE
                vet_score: 80
                feedback:
                  reasons:
                    - 'Company size as reported by government or business sources resulted in a score deduction: size range 6-10.'
          type: object
        appeal_status:
          type: string
          description: Current status of the appeal, such as `PENDING` or `COMPLETE`.
          example: COMPLETE
        appeal_status_update_date:
          type: string
          description: Timestamp when the appeal status was last updated, in ISO 8601 format.
          example: '2024-08-15T08:42:31'
        attachment_uuid_list:
          type: array
          items:
            type: string
          description: UUIDs of the evidence files submitted in support of the appeal.
          example: []
        brand_id:
          type: string
          description: Unique identifier of the Brand the appeal is associated with.
          example: BMQFB7X
        category_list:
          type: array
          items:
            type: string
          description: Categories that classify the appeal, such as `LOW_SCORE`.
          example:
            - LOW_SCORE
        create_date:
          type: string
          description: Timestamp when the appeal was created, in ISO 8601 format.
          example: '2024-08-15T08:41:05'
        explanation:
          type: string
          description: Justification provided for the appeal.
          example: Please review the Brand score
        evp_id:
          type: string
          description: Code identifying the external vetting provider that handled the appeal.
          example: AEGIS
        vetting_class:
          type: string
          description: Class of the vetting being appealed, such as `STANDARD` or `ENHANCED`.
          example: STANDARD
        vetting_id:
          type: string
          description: Unique identifier of the vetting request being appealed.
          example: 48c0ffaa-4e51-4d44-3982-08dcb9856232
      example:
        appeal_outcome:
          vet_status: ACTIVE
          vet_score: 80
          feedback:
            reasons:
              - 'Company size as reported by government or business sources resulted in a score deduction: size range 6-10.'
        appeal_status: COMPLETE
        appeal_status_update_date: '2024-08-15T08:42:31'
        attachment_uuid_list: []
        brand_id: BMQFB7X
        category_list:
          - LOW_SCORE
        create_date: '2024-08-15T08:41:05'
        evp_id: AEGIS
        explanation: Please review the Brand score
        vetting_class: STANDARD
        vetting_id: 48c0ffaa-4e51-4d44-3982-08dcb9856232
    TenDLCBrandVettingAppealCreateRequest:
      title: TenDLCBrandVettingAppealCreateRequest
      required:
        - appeal_categories
        - evidence
      type: object
      additionalProperties: false
      properties:
        appeal_categories:
          type: array
          items:
            type: string
            enum:
              - VERIFY_TAX_ID
              - VERIFY_NON_PROFIT
              - VERIFY_GOVERNMENT
              - LOW_SCORE
          description: 'List of appeal categories. Allowed values: `VERIFY_TAX_ID`, `VERIFY_NON_PROFIT`, `VERIFY_GOVERNMENT`, `LOW_SCORE`. `LOW_SCORE` is only valid for vetting appeals — brand identity appeals (`ten_dlc_brand_appeals_create`) do not accept it.'
          example:
            - VERIFY_TAX_ID
        evidence:
          type: array
          items:
            type: string
          description: List of evidence IDs associated with the appeal.
          example:
            - 855dff49-c097-4645-3983-08dcb9856232
        explanation:
          type: string
          description: Appeal comment or justification.
          example: Find the company incorporation docs attached and please review the Brand Identity status.
        evp_id:
          type: string
          description: EVP ID.
          example: AEGIS
        vetting_id:
          type: string
          description: Vetting ID.
          example: 48c0ffaa-4e51-4d44-3982-08dcb9856232
      description: Brand external vetting appeal details.
    TenDLCMNOMetadata:
      title: TenDLCMNOMetadata
      required:
        - att_mms_tpm
        - att_msg_class
        - att_sms_tpm
        - att_tpm_scope
        - help_required
        - optin_required
        - optout_required
        - min_msg_samples
        - mno
        - mno_qualify
        - mno_review
        - mno_support
        - no_embedded_links
        - no_embedded_phone
        - tmobile_brand_dcap
        - tmobile_brand_tier
      type: object
      additionalProperties: false
      description: Represents per-MNO 10DLC requirements and throughput limits that apply to a campaign use case.
      properties:
        att_mms_tpm:
          type:
            - integer
            - 'null'
          description: MMS throughput per minute allowed on the AT&T network.
          format: int32
        att_msg_class:
          type:
            - string
            - 'null'
          description: Message class assigned by AT&T.
        att_sms_tpm:
          type:
            - integer
            - 'null'
          description: SMS throughput per minute allowed on the AT&T network.
          format: int32
        att_tpm_scope:
          type:
            - string
            - 'null'
          description: Scope of the AT&T throughput-per-minute allocation.
          format: int32
        help_required:
          type: boolean
          description: Indicates whether help keywords and an acknowledgement are mandatory for the use case.
          example: true
        optin_required:
          type: boolean
          description: Indicates whether an opt-in mechanism is mandatory for the use case.
          example: true
        optout_required:
          type: boolean
          description: Indicates whether an opt-out mechanism is mandatory for the use case.
          example: false
        min_msg_samples:
          type: integer
          description: Minimum number of message samples the MNO requires for the use case.
          format: int32
          example: 1
        mno:
          type: string
          description: Name of the mobile network operator (MNO) these requirements apply to.
          example: T-Mobile
        mno_qualify:
          type: boolean
          description: Indicates whether the Brand qualifies with the MNO for the selected use case.
          example: true
        mno_review:
          type: boolean
          description: Indicates whether the MNO requires a post-approval review of the use case.
          example: false
        mno_support:
          type: boolean
          description: Indicates whether the MNO supports the use case.
          example: true
        no_embedded_links:
          type: boolean
          description: Indicates whether embedded links are prohibited in message content for the use case.
          example: false
        no_embedded_phone:
          type: boolean
          description: Indicates whether embedded phone numbers are prohibited in message content for the use case.
          example: false
        tmobile_brand_dcap:
          type:
            - integer
            - 'null'
          description: Daily message cap allowed on the T-Mobile network.
          format: int32
          example: 2000
        tmobile_brand_tier:
          type:
            - string
            - 'null'
          description: Brand tier assigned on the T-Mobile network, such as `LOW`.
          example: LOW
      example:
        att_mms_tpm: null
        att_msg_class: null
        att_sms_tpm: null
        att_tpm_scope: null
        help_required: true
        min_msg_samples: 1
        mno: T-Mobile
        mno_qualify: true
        mno_review: false
        mno_support: true
        no_embedded_links: false
        no_embedded_phone: false
        optin_required: true
        optout_required: false
        tmobile_brand_dcap: 2000
        tmobile_brand_tier: LOW
