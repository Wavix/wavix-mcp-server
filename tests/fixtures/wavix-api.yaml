    ShortLinkCreateRequest:
      title: ShortLinkCreateRequest
      required:
        - link
      type: object
      additionalProperties: false
      properties:
        link:
          type: string
          format: uri
          pattern: ^https://
          description: Target URL to shorten. Must be `https://` — the short link is publicly resolvable and redirects any visitor here, so only pass URLs you trust; this endpoint is a common target for open-redirect and phishing abuse.
          example: https://your-site.com/long-url
        expiration_time:
          type: string
          format: date-time
          description: Expiration date and time in ISO 8601 format.
          example: '2023-07-19T18:18:34.235Z'
        fallback_url:
          type: string
          format: uri
          pattern: ^https://
          description: Fallback URL for expired or invalid links. Must be `https://` — same open-redirect/phishing considerations as `link` apply.
          example: https://examples.com/fallback
        phone:
          type: string
          description: Phone number the short link is associated with, in E.164 format (without the leading `+`). Used to attribute click metrics returned by short link metrics list.
          example: '15155982927'
        utm_campaign:
          type: string
          description: UTM campaign name for tracking insights.
          example: summer_promo
    ShortLinkResponse:
      title: ShortLinkResponse
      required:
        - short_link
      type: object
      additionalProperties: false
      properties:
        short_link:
          type: string
