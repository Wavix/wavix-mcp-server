      description: A WhatsApp Business Account linked to your account. Returned by `whatsapp_wabas_list` and `whatsapp_wabas_get`.
      required:
        - id
        - name
        - sender_count
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: ID of the WhatsApp Business Account, as returned in `waba.id` on senders and templates.
          example: '102290129340398'
