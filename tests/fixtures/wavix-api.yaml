          description: Text of the message.
          example: Hi, is my order on its way?
    WhatsAppInboundMedia:
      title: WhatsAppInboundMedia
      description: A media file in a received message. Returned in the `image`, `video`, `audio`, `document`, or `sticker` field of the content of a `whatsapp.message.received` event.
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - mime_type
        - caption
        - filename
      properties:
        id:
          type: string
          format: uuid
          description: ID of the file. It's the last part of `url`. The file stays available at least as long as Wavix keeps the received message.
          example: 7f3e2c1a-5b9d-4e8f-a1c3-2d4e6f8a0b1c
        url:
          type: string
          format: uri
          description: Address of the file. Send a `GET` request to it with your API key to download the file. See [Download received media](https://docs.wavix.com/api-reference/whatsapp/download-received-media).
          example: https://api.wavix.com/v1/whatsapp/media/7f3e2c1a-5b9d-4e8f-a1c3-2d4e6f8a0b1c
        mime_type:
          type: string
          description: MIME type of the file.
          example: image/jpeg
        caption:
          type:
            - string
            - 'null'
          description: Caption the contact added. Null when there is none, and always null for audio and stickers.
          example: Photo of the damaged box
        filename:
          type:
            - string
            - 'null'
          description: Name of the file as the contact sent it. Null for every type except `document`.
          example: null
    WhatsAppInboundImageContent:
      title: WhatsAppInboundImageContent
