  WhatsAppMessageEvents:
    post:
      summary: WhatsApp message event occurred
      operationId: whatsapp_message_event_occurred
      security: []
      description: |-
        Wavix sends these events to your webhook of the `messages` group when one of your senders receives a message, when a message you sent is sent, delivered, read, or fails, and when a contact stops or resumes marketing messages. A test event you send to the webhook arrives here too.

        Each change is a separate event, and `type` names it, so your server can follow a conversation and the status of each message without polling. A media content has an `id` and a `url`; send a `GET` request to the `url` with your API key to download the file, as [Download received media](https://docs.wavix.com/api-reference/whatsapp/download-received-media) describes.

        **Behavior:** Return a 2xx status within 10 seconds to acknowledge the event; Wavix doesn't follow redirects, so a 3xx response counts as a failed attempt. After a failed attempt, Wavix retries about 5 seconds, 30 seconds, 2 minutes, 10 minutes, 1 hour, 6 hours, and 24 hours later, up to 8 attempts in total; a `test` event isn't retried. Events can arrive more than once and out of order, so discard repeats by `id` and keep the state from the event with the latest `timestamp`. When two status events of a message share a `timestamp`, keep the later of `sent`, `failed`, `delivered`, `read`.

        **Requires:** A webhook of the `messages` group. A disabled webhook gets only test events. Its URL must use `https`, have a valid TLS certificate, and resolve only to public addresses that Wavix allows. If the host resolves to another address at send time, Wavix doesn't send the event and doesn't retry it. Verify every request as the [Standard Webhooks](https://www.standardwebhooks.com/) specification describes, with one of its libraries or by hand. The `webhook-signature` and `webhook-timestamp` headers give the steps.

        **Limits:** [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events) keeps each event except `test` for 30 days, so you can catch up on events your server missed within that time.
      tags:
        - WhatsApp webhook payloads
      parameters:
        - $ref: '#/components/parameters/WhatsAppWebhookIdHeader'
        - $ref: '#/components/parameters/WhatsAppWebhookTimestampHeader'
        - $ref: '#/components/parameters/WhatsAppWebhookSignatureHeader'
      requestBody:
        required: true
        description: The event Wavix posts to your webhook URL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMessagesGroupEvent'
            examples:
              received-button-reply:
                summary: A customer tapped a quick reply button
                value:
                  id: evt_8a1d3c5e7f9b4d2a6c8e0f1a3b5c7d00
                  type: whatsapp.message.received
                  timestamp: '2026-10-21T08:30:00.123456Z'
                  data:
                    message_uuid: 9d4e1c7a-2b86-4f3d-b5a0-71e8c3f6a924
                    from: '+447537151866'
                    to: '+14155550100'
                    profile_name: Jane Smith
                    content:
                      type: button_reply
                      button_reply:
                        id: confirm-order-1001
                        title: Confirm
                    context:
                      message_uuid: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    referral: null
                    service_window_open_until: '2026-10-22T08:30:00Z'
              received-text-from-ad:
                summary: A customer wrote after tapping a click-to-WhatsApp ad
                value:
                  id: evt_8a1d3c5e7f9b4d2a6c8e0f1a3b5c7d01
