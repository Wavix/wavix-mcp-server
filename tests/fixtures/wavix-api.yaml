  /v1/whatsapp/templates:
    get:
      tags:
        - WhatsApp
      summary: List WhatsApp templates
      description: |-
        Returns a paginated list of the WhatsApp templates in your account's WhatsApp Business Accounts, each with its review status and components.

        Every send names a template by its `name` and `language`, and this is where those values come from.

        **Behavior:** Templates are ordered from newest to oldest. When several filters are specified, a template must match all of them. Returns `404` when `sender` doesn't match a sender on your account.

        **Requires:** Your account must have WhatsApp enabled, must have a subscription plan, and must not be blocked or suspended.
      operationId: whatsapp_templates_list
      security:
        - bearerAuth:
            - whatsapp:read
      x-fern-sdk-group-name:
        - whatsapp
        - templates
      x-fern-sdk-method-name: list
      x-fern-ignore: true
      x-fern-pagination:
        offset: $request.page
        results: $response.templates
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: messaging
      parameters:
        - name: waba_id
          in: query
          required: false
          description: Filters templates by the ID of the WhatsApp Business Account that owns them, as returned in `waba.id` by `whatsapp_senders_list`.
          schema:
            type: string
          example: '102290129340398'
        - name: sender
          in: query
          required: false
          description: Filters templates by the WhatsApp Business Account of the sender with this phone number, in E.164 format. The leading `+` is optional.
          schema:
            type: string
            pattern: ^\+?\d{6,20}$
          example: '14155550100'
        - name: status
          in: query
          required: false
          description: |-
            Filters templates by review status. Possible values:

            - `draft` — The template is created but not yet submitted to the provider.
            - `pending` — The provider is reviewing the template.
            - `approved` — The template is approved and can be sent.
            - `rejected` — The provider rejected the template.
            - `paused` — The provider paused the template.
            - `flagged` — The provider flagged the template. It can still be sent.
            - `disabled` — The template is disabled and can't be sent.
            - `in_appeal` — An appeal of the review decision is in progress.
            - `pending_deletion` — The template is being deleted.
            - `deleted` — The template was deleted.
            - `unknown` — The provider reported a status that Wavix doesn't recognize.
          schema:
            type: string
            enum:
              - draft
              - pending
              - approved
              - rejected
              - paused
              - flagged
              - disabled
              - in_appeal
              - pending_deletion
              - deleted
              - unknown
