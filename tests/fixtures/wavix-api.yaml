  /v1/whatsapp/events:
    get:
      tags:
        - WhatsApp
      summary: List WhatsApp events
      description: |-
        Returns a paginated list of your account's WhatsApp events, the same events Wavix posts to your webhooks, oldest first.

        Read events here when your server can't receive webhooks, or to catch up on events your webhooks missed. Events are recorded even when your account has no webhook for their group.

        **Behavior:** Events are ordered by when Wavix recorded them, oldest first, which can differ from `timestamp`. To read them all, pass `next_cursor` from each page as `after` until `has_more` is `false`; later, pass the last non-null `next_cursor` again, or no `after` if you have none, to get events recorded since. Events are kept for 30 days, and test events never appear. When both `type` and `group` are specified, an event must match both filters.

        **Requires:** Your account must have WhatsApp enabled, must have a subscription plan, and must not be blocked or suspended.
      operationId: whatsapp_events_list
      security:
        - bearerAuth:
            - whatsapp:read
      x-fern-sdk-group-name:
        - whatsapp
        - events
      x-fern-sdk-method-name: list
      x-fern-ignore: true
      x-fern-pagination:
        cursor: $request.after
        next_cursor: $response.next_cursor
        results: $response.events
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: messaging
      parameters:
        - name: type
          in: query
          required: false
          description: Filters events by type.
          schema:
            $ref: '#/components/schemas/WhatsAppEventType'
          example: whatsapp.message.received
        - name: group
          in: query
          required: false
          description: Filters events by the webhook group their type belongs to.
          schema:
            $ref: '#/components/schemas/WhatsAppWebhookGroup'
          example: messages
        - name: after
          in: query
          required: false
          description: Returns only events recorded after the event with this ID. Pass `next_cursor` from the previous page. Without it, the list starts at the oldest event kept.
          schema:
            type: string
            pattern: ^evt_[0-9a-f]{32}$
          example: evt_8a1d3c5e7f9b4d2a6c8e0f1a3b5c7d9e
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return. Defaults to 25.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
          example: 25
      responses:
        '200':
          description: A paginated list of WhatsApp events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppEventListResponse'
              examples:
                default:
                  summary: A received message and a delivered message
                  value:
                    events:
                      - id: evt_8a1d3c5e7f9b4d2a6c8e0f1a3b5c7d9e
                        type: whatsapp.message.received
                        timestamp: '2026-10-21T08:30:00.123456Z'
                        data:
                          message_uuid: 9d4e1c7a-2b86-4f3d-b5a0-71e8c3f6a924
                          from: '+447537151866'
                          to: '+14155550100'
                          profile_name: Jane Smith
                          content:
                            type: button_reply
                            button_reply:
                              id: confirm-order-1001
                              title: Confirm
                          context:
                            message_uuid: 3a525ca2-6909-4c72-9399-905adf7f3a74
                          referral: null
                          service_window_open_until: '2026-10-22T08:30:00Z'
                      - id: evt_1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
                        type: whatsapp.message.delivered
                        timestamp: '2026-10-21T08:31:05.000000Z'
                        data:
                          message_uuid: 3a525ca2-6909-4c72-9399-905adf7f3a74
                          from: '+14155550100'
                          to: '+447537151866'
                          template:
                            name: order_shipped
                            language: en_US
                    next_cursor: evt_1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
                    has_more: false
                caught-up:
                  summary: No events since the cursor
                  value:
                    events: []
                    next_cursor: null
                    has_more: false
        '400':
          description: A query parameter is invalid. A parameter is empty or repeated, `type` or `group` has an unsupported value, `limit` isn't an integer from 1 to 100, or `after` isn't an event ID or isn't an event of your account that's still kept. For an `after` that's no longer kept, start again without `after` and discard events you already handled by `id`. The `detail` field says which.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WhatsAppProblem'
              examples:
                invalid-request:
                  summary: The cursor isn't a kept event of your account
                  value:
                    type: https://docs.wavix.com/errors/invalid-request
                    title: Invalid Request
                    status: 400
                    detail: 'after: event not found'
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/WhatsAppUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/WhatsAppForbiddenResponse'
        '404':
          $ref: '#/components/responses/WhatsAppChannelUnavailableResponse'
        '500':
          $ref: '#/components/responses/WhatsAppInternalServerErrorResponse'
        '503':
          $ref: '#/components/responses/WhatsAppServiceUnavailableResponse'
      deprecated: false
