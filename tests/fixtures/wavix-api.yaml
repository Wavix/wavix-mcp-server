    TwoFactorVerificationEvent:
      title: TwoFactorVerificationEvent
      required:
        - created_at
        - event
        - status
        - charge
        - error
      type: object
      additionalProperties: false
      properties:
        created_at:
          type: string
          description: Date and time of the event
          format: date-time
          example: '2022-02-16T13:41:38.000Z'
        event:
          type: string
          description: |-
            Human-readable event description. One of the following values:
            - `Number lookup` — the Wavix platform checked whether the destination phone number is valid. Returned only when number validation is enabled for the 2FA Service.
            - `Code sent via SMS` — a code was sent via SMS.
            - `Code sent via voice` — a code was sent via a voice call.
            - `Verification` — a code verification attempt.
          example: Code sent via SMS
        status:
          type: string
          description: Status of an action associated with the event. Can be either `success`, `failed`, or `pending`.
          example: success
        charge:
          type: string
          description: Cost of an operation associated with the event, in USD
          example: '0.005'
        error:
          type:
            - string
            - 'null'
          description: Error description, if any
