        destructive: false
        openWorld: true
        expose: true
        toolset: messaging
      parameters:
        - name: brand_id
          in: path
          description: The unique ID of the 10DLC Brand.
          required: true
          style: simple
          schema:
            type: string
            pattern: ^B[A-Z0-9]{6}$
            example: B9FXYNH
        - name: campaign_id
          in: path
          description: The unique ID of the 10DLC Campaign.
          required: true
          style: simple
          schema:
            type: string
            example: CSJ4TV0
      requestBody:
        description: Action to request on the Campaign.
        content:
          application/json:
            schema:
              allOf:
