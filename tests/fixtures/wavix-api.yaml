              schema:
                type: string
            Content-Length:
              description: Size of the file in bytes.
              schema:
                type: integer
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/WhatsAppUnauthorizedResponse'
        '403':
