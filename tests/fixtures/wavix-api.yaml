    WhatsAppProblem:
      title: WhatsAppProblem
      description: An RFC 9457 problem document that describes an error from the WhatsApp API. Returned with the `application/problem+json` content type.
      required:
        - type
        - title
        - status
        - detail
        - instance
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: URI that identifies the problem type.
          example: https://docs.wavix.com/errors/whatsapp-not-available
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: WhatsApp Not Available
        status:
          type: integer
          format: int32
          description: HTTP status code of the response.
          example: 404
        detail:
          type: string
          description: Human-readable explanation of this occurrence of the problem.
          example: WhatsApp is not available for this account.
        instance:
          type: string
          description: Request ID of this occurrence of the problem.
          example: 3a525ca2-6909-4c72-9399-905adf7f3a74
        error_class:
          type: string
          description: |-
            Machine-readable classification of the error. Possible values:

            - `permanent` — The request can't succeed as sent. Retrying doesn't help.
            - `retriable` — The failure is temporary. Retrying can succeed.
            - `rate_limited` — The request was rate limited. Retry later.
            - `invalid_template` — The template content is invalid.
          enum:
            - permanent
            - retriable
            - rate_limited
            - invalid_template
          example: permanent
        error_code:
          type: string
          description: Stable machine-readable error code. It's the problem type slug in upper case, with underscores in place of hyphens.
          example: WHATSAPP_NOT_AVAILABLE
        service_window_closed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Time the 24-hour service window of the recipient closed. Returned with `service-window-closed`. It's `null` when the recipient never wrote to the sender or the last message is older than the retained history.
          example: '2026-01-14T09:15:00.000Z'
    WhatsAppWaba:
      title: WhatsAppWaba
      description: A WhatsApp Business Account linked to your account, embedded in senders and templates.
      required:
        - id
        - name
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: ID of the WhatsApp Business Account. Pass it to `whatsapp_wabas_get` to retrieve the account.
          example: '102290129340398'
        name:
          type:
            - string
            - 'null'
          description: Name of the WhatsApp Business Account.
          example: Acme Support
    WhatsAppSender:
      title: WhatsAppSender
      description: A WhatsApp sender, which is a phone number registered with WhatsApp in one of your account's WhatsApp Business Accounts. Returned by `whatsapp_senders_list` and `whatsapp_senders_get`.
      required:
        - phone_number
        - display_name
        - status
        - quality_rating
        - waba
      type: object
      additionalProperties: false
      properties:
        phone_number:
          type: string
          description: Sender's phone number in E.164 format.
          example: '+14155550100'
        display_name:
          type:
            - string
            - 'null'
          description: Sender's WhatsApp display name.
          example: Acme Support
        status:
          type: string
          description: |-
            Sender registration status with the provider. Possible values:

            - `banned` — The provider banned the sender.
            - `connected` — The sender can send messages within its messaging limit.
            - `deleted` — The sender was deleted.
            - `disconnected` — The sender is disconnected from the provider.
            - `flagged` — The sender's quality rating dropped to low. The status returns to `connected` if the rating returns to medium or high within seven days.
            - `migrated` — The sender was migrated.
            - `pending` — Registration with the provider is in progress.
            - `rate_limited` — The provider is rate limiting the sender.
            - `restricted` — The sender reached its messaging limit. It can't start new conversations until the 24-hour window resets, but it can still reply to customers who messaged it.
            - `unknown` — The provider hasn't reported a status.
            - `unverified` — The sender isn't verified.
          enum:
            - banned
            - connected
            - deleted
            - disconnected
            - flagged
            - migrated
            - pending
            - rate_limited
            - restricted
            - unknown
            - unverified
          example: connected
        quality_rating:
          type:
            - string
            - 'null'
          description: |-
            Sender's messaging quality rating. Meta rates quality from customer feedback over the past seven days, such as blocks and reports. Possible values:

            - `high` — High quality.
            - `medium` — Medium quality.
            - `low` — Low quality.
            - `unknown` — Not rated yet.
          enum:
            - high
            - medium
            - low
            - unknown
            - null
          example: high
        waba:
          $ref: '#/components/schemas/WhatsAppWaba'
    WhatsAppSenderListResponse:
      title: WhatsAppSenderListResponse
      description: Returned by `whatsapp_senders_list`.
      required:
        - senders
        - pagination
      type: object
      additionalProperties: false
      properties:
        senders:
          type: array
          description: Senders that match the request.
          items:
            $ref: '#/components/schemas/WhatsAppSender'
        pagination:
          $ref: '#/components/schemas/Pagination'
    WhatsAppTemplateResponseComponent:
      title: WhatsAppTemplateResponseComponent
      description: A component of a stored WhatsApp template. Returned inside templates by `whatsapp_templates_list`, `whatsapp_templates_get`, and `whatsapp_templates_create`. Section types other than header, body, footer, and buttons can carry fields of their own.
      required:
        - type
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          description: 'Component type: `header`, `body`, `footer`, `buttons`, or the lower-cased name of another section type carried over from an imported template, such as `carousel` or `limited_time_offer`.'
          example: body
        format:
          type: string
          description: |-
            Header content format. Present on `header` components only. Possible values:

            - `text` — Text header.
            - `image` — Image header.
            - `video` — Video header.
            - `document` — Document header.
            - `location` — Location header.
          enum:
            - text
            - image
            - video
            - document
            - location
          example: text
        text:
          type: string
          description: Component text, with `{{n}}` placeholders where applicable.
          example: Hi {{1}}, your order {{2}} has shipped.
        example:
          type: object
          description: Sample values for the component's placeholders, in the shape the provider expects.
          additionalProperties: true
        buttons:
          type: array
          description: Button definitions. Present on `buttons` components only.
          items:
            type: object
            additionalProperties: true
    WhatsAppTemplate:
      title: WhatsAppTemplate
      description: A WhatsApp message template with its review status and components. Returned by `whatsapp_templates_list`, `whatsapp_templates_get`, and `whatsapp_templates_create`.
      required:
        - uuid
        - name
        - language
        - category
        - status
        - quality_rating
        - components
        - waba
        - created_at
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          format: uuid
          description: ID of the template. Pass it to `whatsapp_templates_get` to check the review outcome.
          example: 6b1f3c52-9e0a-4d7b-8a15-c2f4e9d07b38
        name:
          type: string
          description: Template name.
          example: order_shipped
        language:
          type: string
          description: Template language code.
          example: en_US
        category:
          type: string
          description: |-
            Template category. Possible values:

            - `marketing` — Promotions, offers, and other marketing content.
            - `authentication` — One-time passcodes for verifying a user.
            - `utility` — Transactional updates about an order or an account.
          enum:
            - marketing
            - authentication
            - utility
          example: utility
        status:
          type: string
          description: |-
            Template review status. Possible values:

            - `draft` — The template is created but not yet submitted to the provider.
            - `pending` — The provider is reviewing the template.
            - `approved` — The template is approved and can be sent.
            - `rejected` — The provider rejected the template.
            - `paused` — The provider paused the template.
            - `flagged` — The provider flagged the template. It can still be sent.
            - `disabled` — The template is disabled and can't be sent.
            - `in_appeal` — An appeal of the review decision is in progress.
            - `pending_deletion` — The template is being deleted.
            - `deleted` — The template was deleted.
            - `unknown` — The provider reported a status that Wavix doesn't recognize.
          enum:
            - draft
            - pending
            - approved
            - rejected
            - paused
            - flagged
            - disabled
            - in_appeal
            - pending_deletion
            - deleted
            - unknown
          example: approved
        quality_rating:
          type:
            - string
            - 'null'
          description: |-
            Template's messaging quality rating. Meta rates quality from customer feedback over the past seven days, such as blocks and reports. Possible values:

            - `high` — High quality.
            - `medium` — Medium quality.
            - `low` — Low quality.
            - `unknown` — Not rated yet.
          enum:
            - high
            - medium
            - low
            - unknown
            - null
          example: high
        submitted_at:
          type: string
          format: date-time
          description: Date and time the template's state was last updated from WhatsApp, in ISO 8601 format.
          example: '2026-01-15T10:30:00Z'
        components:
          type: array
          description: Structural components of the template.
          items:
            $ref: '#/components/schemas/WhatsAppTemplateResponseComponent'
        waba:
          $ref: '#/components/schemas/WhatsAppWaba'
        created_at:
          type: string
          format: date-time
          description: Date and time the template was created, in ISO 8601 format.
          example: '2026-01-15T10:30:00Z'
    WhatsAppTemplatePageResponse:
