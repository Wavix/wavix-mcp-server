    WhatsAppTemplateCreateRequest:
      title: WhatsAppTemplateCreateRequest
      description: Attributes of a new WhatsApp template. Consumed by `whatsapp_templates_create`.
      required:
        - name
        - language
        - category
        - components
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Template name, made of lowercase letters, digits, and underscores, up to 512 characters.
          example: order_shipped
        language:
          type: string
          description: Template language code, such as `en` or `en_US`.
          example: en_US
        category:
          type: string
          description: |-
            Template category. Possible values:

            - `marketing` — Promotions, offers, and other marketing content.
            - `authentication` — One-time passcodes for verifying a user.
            - `utility` — Transactional updates about an order or an account.
          enum:
            - marketing
            - authentication
            - utility
          example: utility
        components:
          type: array
          description: Structural components of the template. Each component type can appear once, exactly one `body` component is required, and `type` and `format` values must be lowercase.
          minItems: 1
          items:
            $ref: '#/components/schemas/WhatsAppTemplateComponentRequest'
        waba_id:
          type: string
          description: ID of the WhatsApp Business Account that owns the template, as returned in `waba.id` by `whatsapp_senders_list`. Required when your account has more than one, unless `sender` is set. When both are set, `sender` must belong to this WhatsApp Business Account.
          example: '102290129340398'
        sender:
          type: string
          description: Phone number of a connected sender whose WhatsApp Business Account owns the template, as an alternative to `waba_id`. When both are set, the sender must belong to `waba_id`. The leading `+` is optional.
          pattern: ^\+?\d{6,20}$
          example: '14155550100'
    WhatsAppTemplateResponse:
      title: WhatsAppTemplateResponse
      description: Returned by `whatsapp_templates_get` and `whatsapp_templates_create`.
      required:
        - template
      type: object
      additionalProperties: false
      properties:
        template:
          $ref: '#/components/schemas/WhatsAppTemplate'
    WhatsAppInboundMessageContent:
      title: WhatsAppInboundMessageContent
      description: Content of a WhatsApp message that one of your WhatsApp senders received. Returned in `content` by [List WhatsApp messages](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-messages) and [Retrieve a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/retrieve-a-whatsapp-message).
      required:
        - type
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - text
            - image
            - video
            - document
            - audio
            - sticker
            - location
            - contacts
            - reaction
            - button_reply
            - list_reply
            - flow_response
            - unsupported
          description: |-
            Type of the content in the message. Possible values:

            - `text` — A text message; its body is in `text`.
            - `image` — A picture.
            - `video` — A video clip.
            - `document` — A file, such as a PDF.
            - `audio` — An audio file or a voice message.
            - `sticker` — A WhatsApp sticker.
            - `location` — A location the person who sent the message shared. Its coordinates aren't returned yet.
            - `contacts` — One or more contact cards. Its details aren't returned yet.
            - `reaction` — An emoji reaction to a message. The emoji isn't returned yet.
            - `button_reply` — The person who sent the message tapped a button. The button isn't returned yet.
            - `list_reply` — The person who sent the message picked an item from a list. The item isn't returned yet.
            - `flow_response` — The person who sent the message submitted a WhatsApp Flow. The answers aren't returned yet.
            - `unsupported` — Any other kind of message.
          example: image
        text:
          type: string
          description: Body of a `text` message. Present only when `type` is `text`; an empty string when the message has no body.
          example: Hi, is my order on its way?
        media_id:
          type: string
          format: uuid
          description: ID of the file in the message. It's the last part of `media_url`. The file stays available at least as long as Wavix keeps the received message. Absent when the file isn't available.
          example: 7f3e2c1a-5b9d-4e8f-a1c3-2d4e6f8a0b1c
        media_url:
          type: string
          format: uri
          description: Address of the file. Send a `GET` request to it with your API key. Present only with `media_id`. See [Download received media](https://docs.wavix.com/api-reference/whatsapp/download-received-media).
          example: https://api.wavix.com/v1/whatsapp/media/7f3e2c1a-5b9d-4e8f-a1c3-2d4e6f8a0b1c
        mime_type:
          type: string
          description: Media type the file is served with, such as `image/jpeg`. Present only with `media_id`, and absent when the type isn't known.
          example: image/jpeg
    WhatsAppMessageError:
      title: WhatsAppMessageError
      description: Why a message you sent wasn't delivered. Returned in `whatsapp.message.failed` events and when you retrieve or list WhatsApp messages. Wavix retries temporary failures itself, so you get an error only after Wavix stops retrying.
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - action
        - docs_url
      properties:
        code:
          type: string
          description: |-
            Wavix error code, in the same format as the `error_code` of WhatsApp API errors. Wavix can add codes, so handle a code you don't recognize as `DELIVERY_FAILED`. Possible values:

            - `RECIPIENT_NOT_ON_WHATSAPP` — The recipient's number isn't on WhatsApp or can't receive messages.
            - `RECIPIENT_OPTED_OUT` — The recipient turned off marketing messages or blocked your sender or template.
            - `SERVICE_WINDOW_CLOSED` — The message isn't a template, and the recipient hasn't messaged your sender in the last 24 hours. Send a template instead.
            - `TEMPLATE_NOT_APPROVED` — The template is pending review, was rejected, or WhatsApp hasn't finished preparing it, so it can't be sent yet.
            - `TEMPLATE_PAUSED_OR_DISABLED` — The template is paused or disabled, so it can't be sent.
            - `INVALID_TEMPLATE_PARAMETERS` — The parameters don't match the template. Correct them and send the message again.
            - `MARKETING_LIMIT_REACHED` — WhatsApp limits how many marketing messages a recipient gets, and the limit for this recipient is reached.
            - `SENDER_LIMIT_REACHED` — Your sender reached its messaging limit and can't start new conversations until the 24-hour window resets.
            - `SENDER_RATE_LIMITED` — WhatsApp slowed down your sender, for example because recipients reported or blocked its messages.
            - `SENDER_UNAVAILABLE` — Your sender isn't registered, or it's banned or disconnected.
            - `SERVICE_UNAVAILABLE` — The provider was unavailable and couldn't take the message. Sending it again later can help.
            - `MESSAGE_EXPIRED` — The message expired before it was delivered.
            - `DELIVERY_FAILED` — The message wasn't delivered, and the cause isn't one of the other codes.
          enum:
            - RECIPIENT_NOT_ON_WHATSAPP
            - RECIPIENT_OPTED_OUT
            - SERVICE_WINDOW_CLOSED
            - TEMPLATE_NOT_APPROVED
            - TEMPLATE_PAUSED_OR_DISABLED
            - INVALID_TEMPLATE_PARAMETERS
            - MARKETING_LIMIT_REACHED
            - SENDER_LIMIT_REACHED
            - SENDER_RATE_LIMITED
            - SENDER_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - MESSAGE_EXPIRED
            - DELIVERY_FAILED
          example: RECIPIENT_NOT_ON_WHATSAPP
        subcode:
          type:
            - string
            - 'null'
          description: |-
            Finer cause within `code`, or `null` when Wavix has no finer cause. Wavix can add values, so handle a value you don't recognize by `code` alone. Possible values:

            - `NOT_REGISTERED` — With `RECIPIENT_NOT_ON_WHATSAPP`. The number isn't registered on WhatsApp.
            - `APP_UPDATE_REQUIRED` — With `RECIPIENT_NOT_ON_WHATSAPP`. The recipient's WhatsApp app can't show the message. The recipient may need to update the app or accept the WhatsApp Terms of Service.
            - `DEVICE_UNSUPPORTED` — With `RECIPIENT_NOT_ON_WHATSAPP`. The recipient's device doesn't support the message.
            - `BLOCKED_BY_OPERATOR` — With `RECIPIENT_NOT_ON_WHATSAPP`. This number can't receive WhatsApp messages from businesses.
            - `MARKETING_OPT_OUT` — With `RECIPIENT_OPTED_OUT`. The recipient turned off marketing messages in WhatsApp.
            - `TEMPLATE_BLOCKED_BY_RECIPIENT` — With `RECIPIENT_OPTED_OUT`. The recipient blocked this template.
            - `SENDER_BLOCKED_BY_RECIPIENT` — With `RECIPIENT_OPTED_OUT`. Messages from your sender to this recipient are blocked.
            - `TEMPLATE_NOT_ELIGIBLE` — With `TEMPLATE_NOT_APPROVED`. WhatsApp can't send this template from your sender. Contact Wavix support.
            - `PER_RECIPIENT_MARKETING_LIMIT` — With `MARKETING_LIMIT_REACHED`. The recipient got the maximum number of marketing messages from all businesses for now.
            - `DAILY_PROMOTIONAL_LIMIT` — With `MARKETING_LIMIT_REACHED`. The recipient reached the daily limit on promotional messages.
            - `UNIQUE_RECIPIENTS_LIMIT` — With `SENDER_LIMIT_REACHED`. Your sender reached the number of recipients it can message in 24 hours.
            - `RECIPIENT_MESSAGE_LIMIT` — With `SENDER_LIMIT_REACHED`. Your sender reached the number of messages it can send to this recipient.
            - `LOW_QUALITY_RATING` — With `SENDER_RATE_LIMITED`. The quality rating of your sender limits how many recipients it can reach.
            - `SENDER_NOT_REGISTERED` — With `SENDER_UNAVAILABLE`. Your sender isn't registered on WhatsApp.
            - `SENDER_RESTRICTED` — With `SENDER_UNAVAILABLE`. WhatsApp restricted what your sender can do.
            - `SENDER_MISCONFIGURED` — With `SENDER_UNAVAILABLE`. Your sender's setup doesn't allow this message. Contact Wavix support.
            - `TEMPLATE_INVALID` — With `DELIVERY_FAILED`. The template is invalid or doesn't match its approved version.
            - `MEDIA_UNSUPPORTED` — With `DELIVERY_FAILED`. WhatsApp doesn't support the media file or its format.
            - `MEDIA_INVALID` — With `DELIVERY_FAILED`. The media file couldn't be read or uploaded.
            - `CONTENT_BLOCKED` — With `DELIVERY_FAILED`. WhatsApp blocked the content for a policy violation.
          example: BLOCKED_BY_OPERATOR
        message:
          type: string
          description: Short explanation for people, from the most specific of `subcode` and `code`. The text can change, so base your logic on `code`, `subcode`, and `action` instead.
          example: This number can't receive WhatsApp messages from businesses.
        action:
          type: string
          description: |-
            What to do about the message. Possible values:

            - `resend_later` — Send the message again later.
            - `fix_and_resend` — Change the message, template, or media, then send it again.
            - `do_not_resend` — Don't send the message again. It won't be delivered.
            - `contact_support` — Contact Wavix support.
          enum:
            - resend_later
            - fix_and_resend
            - do_not_resend
            - contact_support
          example: do_not_resend
        docs_url:
          type: string
          format: uri
          description: Page for this code under `https://docs.wavix.com/errors/`. It explains the error, how to fix it, and whether sending the message again can help.
          example: https://docs.wavix.com/errors/recipient-not-on-whatsapp
    WhatsAppMessageListItem:
      title: WhatsAppMessageListItem
      description: A WhatsApp message your account sent or received. Returned by `whatsapp_messages_list` and `whatsapp_messages_get`.
      required:
        - uuid
        - direction
        - status
        - created_at
        - from
        - to
        - country
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          format: uuid
          description: ID of the message.
          example: 3a525ca2-6909-4c72-9399-905adf7f3a74
        direction:
          type: string
          description: |-
            Message direction. Possible values:

            - `outbound` — The message was sent from your account to a recipient.
            - `inbound` — A customer sent the message to one of your senders.
          enum:
            - outbound
            - inbound
          example: outbound
        status:
          type: string
          description: |-
            Message delivery status. Inbound messages always have `delivered` status. Possible values:

            - `sent` — The message isn't delivered yet.
            - `delivered` — The message was delivered to the recipient.
            - `read` — The recipient opened the message. WhatsApp reports it only when the recipient has read receipts turned on.
            - `undelivered` — The message was sent but not delivered.
            - `expired` — The message expired before it was delivered.
            - `rejected` — The message was permanently rejected before or by the provider.
            - `unknown` — The provider hasn't reported a status.
          enum:
            - sent
            - delivered
            - read
            - undelivered
            - expired
            - rejected
            - unknown
          example: delivered
        from:
          type: string
          description: For `outbound` messages, the phone number of your sender. For `inbound`, the customer's phone number.
          example: '+14155550100'
        to:
          type: string
          description: For `outbound` messages, the recipient's phone number. For `inbound`, the phone number of your sender that received it.
          example: '+447537151866'
        country:
          type:
            - string
            - 'null'
          description: Country of the customer's phone number, as an ISO 3166-1 alpha-2 code, or `null` if the country can't be determined from the number.
          example: GB
        created_at:
          type: string
          format: date-time
          description: Date and time the message was created, in ISO 8601 format.
          example: '2026-01-15T10:30:00.123Z'
        content:
          anyOf:
            - $ref: '#/components/schemas/WhatsAppInboundMessageContent'
            - type: 'null'
          description: Content of an `inbound` message. `null` for `outbound` messages.
        service_window_open_until:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the 24-hour window in which you may reply to the customer without a template. It's `null` when the customer hasn't written to the sender in the retained history. A value in the past means the window is closed.
          example: '2026-01-16T09:15:00.000Z'
        error:
          anyOf:
            - $ref: '#/components/schemas/WhatsAppMessageError'
            - type: 'null'
          description: Why an `outbound` message wasn't delivered. It's `null` unless `status` is `undelivered`, `expired`, or `rejected`.
    WhatsAppMessageListResponse:
      title: WhatsAppMessageListResponse
      description: Returned by `whatsapp_messages_list`.
      required:
        - messages
        - pagination
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          description: Messages that match the request.
          items:
            $ref: '#/components/schemas/WhatsAppMessageListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    WhatsAppSendTemplateHeader:
      title: WhatsAppSendTemplateHeader
      description: Header content, required only when the template's `header` component needs one. Each `type` requires specific fields and rejects the others, as listed in the `type` description. Consumed in `template.header` by `whatsapp_messages_send`.
      required:
        - type
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: |-
            Header content type. Possible values:

            - `text` — Text header with a `{{1}}` placeholder. Requires `placeholder`.
            - `text_named_parameters` — Text header with a named placeholder. Requires `parameter_name` and `text`.
            - `image` — Image header. Requires `media_url`.
            - `video` — Video header. Requires `media_url`.
            - `document` — Document header. Requires `media_url` and `filename`.
            - `location` — Location header. Requires `latitude` and `longitude`.
          enum:
            - text
            - text_named_parameters
            - image
            - video
            - document
            - location
          example: text
        placeholder:
          type: string
          description: Value for a `text` header's `{{1}}` placeholder.
          example: '#1001'
        media_url:
          type: string
          description: Media URL for an `image`, `video`, or `document` header.
          example: https://example.com/media/order-1001.pdf
        filename:
          type: string
          description: Filename for a `document` header.
          example: order-1001.pdf
        latitude:
          type: number
          description: Latitude for a `location` header.
          example: 52.3676
        longitude:
          type: number
          description: Longitude for a `location` header.
          example: 4.9041
        parameter_name:
          type: string
          description: Placeholder name for a `text_named_parameters` header.
          example: order_number
        text:
          type: string
          description: Value for a `text_named_parameters` header.
          example: '#1001'
    WhatsAppSendTemplateButton:
      title: WhatsAppSendTemplateButton
      description: Dynamic values for one button of the template. Each `type` requires specific fields and rejects the others, as listed in the `type` description. Consumed in `template.buttons` by `whatsapp_messages_send`.
      required:
        - type
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: |-
            Button type. Possible values:

            - `quick_reply` — Sends a predefined reply. Requires `parameter`.
            - `url` — Opens a URL. Requires `parameter`.
            - `copy_code` — Copies a code to the clipboard. Requires `parameter`.
            - `flow` — Opens a WhatsApp Flow. Accepts `flow_token` and `data`.
            - `catalog` — Opens the business catalog. Accepts `thumbnail_product_retailer_id`.
            - `multi_product` — Shows a message with several products. Requires `sections` and accepts `thumbnail_product_retailer_id`.
            - `order_details` — Shows order details. Requires `action`.
            - `voice_call` — Starts a voice call. Accepts `call_validity_period` and `call_context_payload`.
          enum:
            - quick_reply
            - url
            - copy_code
            - flow
            - catalog
            - multi_product
            - order_details
            - voice_call
          example: url
        parameter:
          type: string
          description: Dynamic value of a `quick_reply`, `url`, or `copy_code` button. Required for those types.
          example: '1001'
        flow_token:
          type: string
          description: Flow token of a `flow` button.
        data:
          type: object
          description: Initial data passed to the Flow of a `flow` button.
          additionalProperties: true
        thumbnail_product_retailer_id:
          type: string
          description: Retailer ID of the product shown as the thumbnail of a `catalog` or `multi_product` button.
        sections:
          type: array
          description: Product sections of a `multi_product` button. Required for that type.
          items:
            type: object
            additionalProperties: true
        action:
          type: object
          description: Order details of an `order_details` button. Required for that type.
          additionalProperties: true
        call_validity_period:
          type: integer
          description: How long a `voice_call` button stays valid.
        call_context_payload:
          type: string
          description: Context payload returned with a call started from a `voice_call` button.
    WhatsAppSendTemplate:
      title: WhatsAppSendTemplate
      description: The template to send and the values for its dynamic parts. Consumed in `template` by `whatsapp_messages_send`.
      required:
        - name
        - language
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name of the template to send, as returned by `whatsapp_templates_list`.
          example: order_shipped
        language:
          type: string
          description: Language code of the template to send, as returned by `whatsapp_templates_list`.
          example: en_US
        placeholders:
          type: array
          description: Values substituted into the template body's `{{n}}` placeholders, in order.
          items:
            type: string
          example:
            - Maria
            - '#1001'
        header:
          $ref: '#/components/schemas/WhatsAppSendTemplateHeader'
        buttons:
          type: array
          description: Dynamic values for the template's `buttons` component, one entry per button, matching the template's button order. Each entry accepts only the fields its `type` uses.
          items:
            $ref: '#/components/schemas/WhatsAppSendTemplateButton'
    WhatsAppSendTextContent:
      title: WhatsAppSendTextContent
      description: Content of a message without a template that is text. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          type: string
          const: text
          description: Type of the content, always `text`.
          example: text
        text:
          type: string
          description: Text of the message.
          minLength: 1
          maxLength: 4096
          example: Your order ships tomorrow morning.
    WhatsAppSendMedia:
      title: WhatsAppSendMedia
      description: A media file to send. Consumed in the `image`, `video`, `audio`, or `document` field of `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Public `https` URL of the file, without embedded credentials (`user:password@`). WhatsApp downloads the file from it, so it must stay reachable until the message is delivered.
          example: https://example.com/invoices/1001.pdf
        caption:
          type: string
          description: Caption shown under the file. Not allowed for `audio`.
          maxLength: 1024
          example: Invoice for order 1001
        filename:
          type: string
          description: File name the recipient sees. Allowed only for `document`.
          maxLength: 240
          example: invoice-1001.pdf
    WhatsAppSendImageContent:
      title: WhatsAppSendImageContent
      description: Content of a message without a template that is an image. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - image
      properties:
        type:
          type: string
          const: image
          description: Type of the content, always `image`.
          example: image
        image:
          $ref: '#/components/schemas/WhatsAppSendMedia'
    WhatsAppSendVideoContent:
      title: WhatsAppSendVideoContent
      description: Content of a message without a template that is a video. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - video
      properties:
        type:
          type: string
          const: video
          description: Type of the content, always `video`.
          example: video
        video:
          $ref: '#/components/schemas/WhatsAppSendMedia'
    WhatsAppSendAudioContent:
      title: WhatsAppSendAudioContent
      description: Content of a message without a template that is an audio file. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - audio
      properties:
        type:
          type: string
          const: audio
          description: Type of the content, always `audio`.
          example: audio
        audio:
          $ref: '#/components/schemas/WhatsAppSendMedia'
    WhatsAppSendDocumentContent:
      title: WhatsAppSendDocumentContent
      description: Content of a message without a template that is a document. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - document
      properties:
        type:
          type: string
          const: document
          description: Type of the content, always `document`.
          example: document
        document:
          $ref: '#/components/schemas/WhatsAppSendMedia'
    WhatsAppSendReplyButton:
      title: WhatsAppSendReplyButton
      description: A reply button. Consumed in `content.buttons.items` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Your ID of the button, returned in `content.button_reply.id` of the `whatsapp.message.received` event when the recipient taps it. Unique within the message.
          minLength: 1
          maxLength: 256
          example: deliver-today
        title:
          type: string
          description: Label of the button, unique within the message. Emojis are supported, Markdown isn't.
          minLength: 1
          maxLength: 20
          example: Today
    WhatsAppSendButtons:
      title: WhatsAppSendButtons
      description: A text with reply buttons. Consumed in `content.buttons` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message). When the recipient taps a button, Wavix sends a `whatsapp.message.received` event with the button's `id` in `content.button_reply`.
      type: object
      additionalProperties: false
      required:
        - body
        - items
      properties:
        header:
          type: string
          description: Text shown in bold at the top of the message.
          maxLength: 60
          example: Order 1001
        body:
          type: string
          description: Main text of the message.
          minLength: 1
          maxLength: 1024
          example: Your order is ready. When should we deliver it?
        footer:
          type: string
          description: Text shown in small type at the end of the message.
          maxLength: 60
          example: Reply by 6 PM
        items:
          type: array
          description: Reply buttons, in the order they're shown.
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/WhatsAppSendReplyButton'
    WhatsAppSendButtonsContent:
      title: WhatsAppSendButtonsContent
      description: Content of a message without a template that is a text with reply buttons. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - buttons
      properties:
        type:
          type: string
          const: buttons
          description: Type of the content, always `buttons`.
          example: buttons
        buttons:
          $ref: '#/components/schemas/WhatsAppSendButtons'
    WhatsAppSendListRow:
      title: WhatsAppSendListRow
      description: An item in a list. Consumed in `content.list.sections.items` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Your ID of the item, returned in `content.list_reply.id` of the `whatsapp.message.received` event when the recipient picks it. Unique within the message.
          minLength: 1
          maxLength: 200
          example: slot-morning
        title:
          type: string
          description: Title of the item.
          minLength: 1
          maxLength: 24
          example: Morning, 9 to 12
        description:
          type: string
          description: Text shown under the title.
          maxLength: 72
          example: Delivery between 9:00 and 12:00
    WhatsAppSendListSection:
      title: WhatsAppSendListSection
      description: A group of items in a list. Consumed in `content.list.sections` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        title:
          type: string
          description: Title of the section. Required when the list has more than one section.
          maxLength: 24
          example: Tomorrow
        items:
          type: array
          description: Items in the section.
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/WhatsAppSendListRow'
    WhatsAppSendList:
      title: WhatsAppSendList
      description: A text with a button that opens a list of items. Consumed in `content.list` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message). When the recipient picks an item, Wavix sends a `whatsapp.message.received` event with the item's `id` in `content.list_reply`.
      type: object
      additionalProperties: false
      required:
        - body
        - button_text
        - sections
      properties:
        header:
          type: string
          description: Text shown in bold at the top of the message.
          maxLength: 60
          example: Delivery slots
        body:
          type: string
          description: Main text of the message.
          minLength: 1
          maxLength: 1024
          example: Pick a time for your delivery.
        footer:
          type: string
          description: Text shown in small type at the end of the message.
          maxLength: 60
          example: Times are local
        button_text:
          type: string
          description: Label of the button that opens the list.
          minLength: 1
          maxLength: 20
          example: Choose a slot
        sections:
          type: array
          description: Groups of items in the list. All sections together hold at most 10 items.
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/WhatsAppSendListSection'
    WhatsAppSendListContent:
      title: WhatsAppSendListContent
      description: Content of a message without a template that is a text with a list of items to pick from. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message).
      type: object
      additionalProperties: false
      required:
        - type
        - list
      properties:
        type:
          type: string
          const: list
          description: Type of the content, always `list`.
          example: list
        list:
          $ref: '#/components/schemas/WhatsAppSendList'
    WhatsAppSendContent:
      title: WhatsAppSendContent
      description: |-
        Content of a message sent without a template, inside the 24-hour service window. Consumed in `content` of [Send a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/send-a-whatsapp-message). The `type` field decides which other field holds the content. Possible values:

        - `text` — Text.
        - `image` — An image, with an optional caption.
        - `video` — A video, with an optional caption.
        - `audio` — An audio file.
        - `document` — A document, with an optional file name and caption.
        - `buttons` — A text with up to 3 reply buttons.
        - `list` — A text with a button that opens a list of up to 10 items.
      oneOf:
        - $ref: '#/components/schemas/WhatsAppSendTextContent'
        - $ref: '#/components/schemas/WhatsAppSendImageContent'
        - $ref: '#/components/schemas/WhatsAppSendVideoContent'
        - $ref: '#/components/schemas/WhatsAppSendAudioContent'
        - $ref: '#/components/schemas/WhatsAppSendDocumentContent'
        - $ref: '#/components/schemas/WhatsAppSendButtonsContent'
        - $ref: '#/components/schemas/WhatsAppSendListContent'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/WhatsAppSendTextContent'
          image: '#/components/schemas/WhatsAppSendImageContent'
          video: '#/components/schemas/WhatsAppSendVideoContent'
          audio: '#/components/schemas/WhatsAppSendAudioContent'
          document: '#/components/schemas/WhatsAppSendDocumentContent'
          buttons: '#/components/schemas/WhatsAppSendButtonsContent'
          list: '#/components/schemas/WhatsAppSendListContent'
    WhatsAppMessageSendRequest:
      title: WhatsAppMessageSendRequest
      description: Attributes of a WhatsApp message to send. Send exactly one of `template` and `content`. Use `content` only while the 24-hour service window of the recipient is open. Consumed by `whatsapp_messages_send`.
      required:
        - from
        - to
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          description: Phone number of a sender registered on your account, in E.164 format, as returned by `whatsapp_senders_list`. The leading `+` is optional.
          pattern: ^\+?\d{6,20}$
          example: '+14155550100'
        to:
          type: string
          description: Recipient's phone number in E.164 format. The leading `+` is optional.
          pattern: ^\+?\d{6,20}$
          example: '+447537151866'
        idempotency_key:
          type: string
          description: Key that makes the send safe to retry, unique per account. Matching is exact, so case and accents are significant - `ORDER-1` and `order-1` are two different keys and both are sent. Printable ASCII only. Must not begin with `campaign:`, a prefix reserved for campaign messages. A request with a key in that namespace is rejected.
          maxLength: 128
          pattern: ^[\x20-\x7e]*$
          example: order-1001-shipped
        template:
          $ref: '#/components/schemas/WhatsAppSendTemplate'
        content:
          $ref: '#/components/schemas/WhatsAppSendContent'
    WhatsAppMessageTemplate:
      title: WhatsAppMessageTemplate
      description: The template that a WhatsApp message was sent with. Returned in `template` by `whatsapp_messages_send`.
      required:
        - name
        - language
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Template name.
          example: order_shipped
        language:
          type: string
          description: Template language code.
          example: en_US
    WhatsAppMessage:
      title: WhatsAppMessage
      description: A WhatsApp message you sent. Returned by `whatsapp_messages_send`.
      required:
        - uuid
        - from
        - to
        - status
        - template
        - created_at
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          format: uuid
          description: ID of the message. Pass it to `whatsapp_messages_get` to check the delivery outcome.
          example: 3a525ca2-6909-4c72-9399-905adf7f3a74
        from:
          type: string
          description: Sender's phone number in E.164 format.
          example: '+14155550100'
        to:
          type: string
          description: Recipient's phone number in E.164 format.
          example: '+447537151866'
        status:
          type: string
          description: |-
            Message delivery status. Possible values:

            - `sent` — The message isn't delivered yet.
            - `delivered` — The message was delivered to the recipient.
            - `read` — The recipient opened the message. WhatsApp reports it only when the recipient has read receipts turned on.
            - `undelivered` — The message was sent but not delivered.
            - `expired` — The message expired before it was delivered.
            - `rejected` — The message was permanently rejected before or by the provider.
            - `unknown` — The provider hasn't reported a status.
          enum:
            - sent
            - delivered
            - read
            - undelivered
            - expired
            - rejected
            - unknown
          example: sent
        template:
          anyOf:
            - $ref: '#/components/schemas/WhatsAppMessageTemplate'
            - type: 'null'
          description: Template used to send the message.
        service_window_open_until:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the 24-hour window in which you may reply to the recipient without a template. It's `null` when the recipient hasn't written to the sender in the retained history. A value in the past means the window is closed.
          example: '2026-01-16T09:15:00.000Z'
        created_at:
          type: string
          format: date-time
          description: Date and time the message was created, in ISO 8601 format.
          example: '2026-01-15T10:30:00.123Z'
    WhatsAppMessageSendResponse:
      title: WhatsAppMessageSendResponse
      description: Returned by `whatsapp_messages_send`.
      required:
        - message
      type: object
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/WhatsAppMessage'
    WhatsAppMessageGetResponse:
      title: WhatsAppMessageGetResponse
      description: Returned by `whatsapp_messages_get`.
      required:
        - message
      type: object
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/WhatsAppMessageListItem'
    WhatsAppWebhookGroup:
      title: WhatsAppWebhookGroup
      description: |-
        Group of WhatsApp event types that a webhook receives. Your account can have one webhook per group. Possible values:

        - `messages` — Messages your senders receive, the delivery outcome of messages you send, and contacts' marketing preferences.
        - `templates` — Changes to the status, category, and quality rating of your templates.
        - `senders` — Changes to the status and quality rating of your senders.
      type: string
      enum:
        - messages
        - templates
        - senders
      example: messages
    WhatsAppEventType:
      title: WhatsAppEventType
      description: |-
        Type of a WhatsApp event. Each type belongs to one webhook group. Wavix can add event types to a group, so ignore an event whose `type` you don't recognize. Possible values:

        - `whatsapp.message.received` — One of your senders received a message.
        - `whatsapp.message.sent` — A message you sent has the `sent` status: it isn't delivered yet.
        - `whatsapp.message.delivered` — A message you sent was delivered to the recipient. WhatsApp can skip it when the recipient reads the message right away.
        - `whatsapp.message.read` — The recipient opened a message you sent. WhatsApp reports it only when the recipient has read receipts turned on.
        - `whatsapp.message.failed` — A message you sent wasn't delivered. `data.error` says why.
        - `whatsapp.contact.marketing_stopped` — A contact asked to stop marketing messages from one of your senders. Meta doesn't deliver marketing templates to the contact until they resume them.
        - `whatsapp.contact.marketing_resumed` — A contact asked to receive marketing messages from one of your senders again.
        - `whatsapp.template.approved` — The provider approved one of your templates, so you can send it.
        - `whatsapp.template.rejected` — The provider rejected one of your templates.
        - `whatsapp.template.paused` — The provider paused one of your templates.
        - `whatsapp.template.disabled` — One of your templates is disabled and can't be sent.
        - `whatsapp.template.flagged` — Meta flagged one of your templates because of negative feedback. It can still be sent, but it's at risk of being paused or disabled.
        - `whatsapp.template.category_changed` — Meta moved one of your templates to another category, which changes the rate of each message sent with it.
        - `whatsapp.template.quality_changed` — Meta changed the quality rating of one of your templates.
        - `whatsapp.template.updated` — The status of one of your templates changed to a value that has no event type of its own, such as `pending`, `in_appeal`, or `deleted`.
        - `whatsapp.sender.connected` — One of your senders can send messages within its messaging limit, for example after registration or when a restriction ends.
        - `whatsapp.sender.restricted` — One of your senders reached its messaging limit. It can't start new conversations until the 24-hour window resets, but it can still reply to customers who messaged it.
        - `whatsapp.sender.flagged` — The quality rating of one of your senders dropped to low. The status returns to `connected` if the rating returns to medium or high within 7 days.
        - `whatsapp.sender.banned` — The provider banned one of your senders.
        - `whatsapp.sender.disconnected` — One of your senders is disconnected from the provider.
        - `whatsapp.sender.quality_changed` — Meta changed the quality rating of one of your senders.
        - `whatsapp.sender.updated` — The status of one of your senders changed to a value that has no event type of its own, such as `pending`, `migrated`, or `deleted`.
      type: string
      enum:
        - whatsapp.message.received
        - whatsapp.message.sent
        - whatsapp.message.delivered
        - whatsapp.message.read
        - whatsapp.message.failed
        - whatsapp.contact.marketing_stopped
        - whatsapp.contact.marketing_resumed
        - whatsapp.template.approved
        - whatsapp.template.rejected
        - whatsapp.template.paused
        - whatsapp.template.disabled
        - whatsapp.template.flagged
        - whatsapp.template.category_changed
        - whatsapp.template.quality_changed
        - whatsapp.template.updated
        - whatsapp.sender.connected
        - whatsapp.sender.restricted
        - whatsapp.sender.flagged
        - whatsapp.sender.banned
        - whatsapp.sender.disconnected
        - whatsapp.sender.quality_changed
        - whatsapp.sender.updated
      example: whatsapp.message.received
    WhatsAppWebhook:
      title: WhatsAppWebhook
      description: A WhatsApp webhook of your account, returned when you create, list, or retrieve a webhook.
      type: object
      additionalProperties: false
      required:
        - uuid
        - url
        - group
        - enabled
        - enabled_events
        - created_at
      properties:
        uuid:
          type: string
          format: uuid
          description: Webhook ID. Test events carry it as `data.webhook_id`.
          example: 6f1c2a4e-8b3d-4c5e-9f70-1a2b3c4d5e6f
        url:
          type: string
          format: uri
          maxLength: 2048
          description: The https URL that Wavix sends events to.
          example: https://example.com/wavix
        group:
          $ref: '#/components/schemas/WhatsAppWebhookGroup'
        enabled:
          type: boolean
          description: Whether the webhook gets events. A disabled webhook gets only test events. Change it with [Update a WhatsApp webhook](https://docs.wavix.com/api-reference/whatsapp/update-a-whatsapp-webhook).
          example: true
        enabled_events:
          type: array
          readOnly: true
          description: Event types Wavix sends to the webhook, which are every event type of its `group`. When Wavix adds an event type to the group, the list includes it.
          items:
            $ref: '#/components/schemas/WhatsAppEventType'
          example:
            - whatsapp.message.received
            - whatsapp.message.sent
            - whatsapp.message.delivered
            - whatsapp.message.read
            - whatsapp.message.failed
            - whatsapp.contact.marketing_stopped
            - whatsapp.contact.marketing_resumed
        created_at:
          type: string
          format: date-time
          description: Date and time when the webhook was created, in ISO 8601 UTC.
          example: '2026-10-21T12:00:00Z'
        secret:
          type: string
          pattern: ^whsec_[A-Za-z0-9+/]{43}=$
          description: The signing secret, in the Standard Webhooks format. Returned only when you create the webhook; store it, because it's never returned again.
          example: whsec_AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
    WhatsAppWebhookListResponse:
      title: WhatsAppWebhookListResponse
      description: The WhatsApp webhooks of your account, returned when you list them.
      required:
        - webhooks
      type: object
      additionalProperties: false
      properties:
        webhooks:
          type: array
          description: The account's webhooks, ordered by group (`messages`, `templates`, `senders`), at most one per group. The array is empty when the account has none.
          items:
            $ref: '#/components/schemas/WhatsAppWebhook'
    WhatsAppWebhookCreateRequest:
      title: WhatsAppWebhookCreateRequest
      description: Body of the request that creates a WhatsApp webhook.
      type: object
      additionalProperties: false
      required:
        - url
        - group
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: An https URL whose host resolves only to public addresses. Webhooks of different groups can share a URL.
          example: https://example.com/wavix
        group:
          $ref: '#/components/schemas/WhatsAppWebhookGroup'
    WhatsAppWebhookResponse:
      title: WhatsAppWebhookResponse
      description: A single WhatsApp webhook, returned when you create or retrieve a webhook.
      required:
        - webhook
      type: object
      additionalProperties: false
      properties:
        webhook:
          $ref: '#/components/schemas/WhatsAppWebhook'
    WhatsAppWebhookUpdateRequest:
      title: WhatsAppWebhookUpdateRequest
      description: Fields to update on a WhatsApp webhook. Consumed by [Update a WhatsApp webhook](https://docs.wavix.com/api-reference/whatsapp/update-a-whatsapp-webhook). Specify at least one field; fields you omit keep their values.
      type: object
      additionalProperties: false
      minProperties: 1
      required: []
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: New https URL that Wavix sends events to. Wavix checks it the same way as when you create a webhook.
          example: https://example.com/wavix/v2
        enabled:
          type: boolean
          description: Whether Wavix sends events to the webhook. When `false`, Wavix sends only test events. Read the others with [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
          example: false
    WhatsAppWebhookTestResult:
      title: WhatsAppWebhookTestResult
      description: Outcome of one test event sent to a WhatsApp webhook.
      type: object
      additionalProperties: false
      required:
        - outcome
        - status_code
        - duration_ms
      properties:
        outcome:
          type: string
          description: |-
            What happened to the test event. Possible values:

            - `delivered` — The receiver answered with a 2xx status.
            - `http_error` — The receiver answered with any other status.
            - `timeout` — No answer arrived within 10 seconds.
            - `connection_error` — Wavix couldn't connect to the receiver.
            - `tls_error` — The TLS handshake failed or the certificate isn't valid.
            - `blocked` — The host of the URL now resolves to an address that isn't public or that Wavix doesn't allow, so Wavix didn't send the event.
          enum:
            - delivered
            - http_error
            - timeout
            - connection_error
            - tls_error
            - blocked
          example: delivered
        status_code:
          type:
            - integer
            - 'null'
          description: The receiver's HTTP status, or null when no response arrived.
          example: 200
        duration_ms:
          type: integer
          minimum: 0
          description: Time the test attempt took, in milliseconds, until the response headers arrived or the attempt stopped without a response. `0` when Wavix didn't send the event.
          example: 184
    WhatsAppWebhookTestResponse:
      title: WhatsAppWebhookTestResponse
      description: The outcome of a WhatsApp webhook test event, returned when you send one.
      required:
        - test
      type: object
      additionalProperties: false
      properties:
        test:
          $ref: '#/components/schemas/WhatsAppWebhookTestResult'
    WhatsAppEvent:
      title: WhatsAppEvent
      description: A WhatsApp event returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events). It has the same fields as the event Wavix posts to your webhook, and `type` decides the shape of `data`.
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - timestamp
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9a-f]{32}$
          description: Unique ID of the event. It's the same in the event list and in the webhook request, so use it to discard events you already handled.
          example: evt_8a1d3c5e7f9b4d2a6c8e0f1a3b5c7d9e
        type:
          type: string
          description: Type of the event, such as `whatsapp.message.received`. The `type` query parameter lists every type. Wavix can add event types, so ignore an event whose `type` you don't recognize.
          example: whatsapp.message.delivered
        timestamp:
          type: string
          format: date-time
          description: When the event happened, in ISO 8601 UTC with 6 fractional digits. The list is ordered by when Wavix recorded events, so `timestamp` can be out of order.
          example: '2026-10-21T08:30:00.123456Z'
        data:
          type: object
          additionalProperties: true
          description: Details of the event. The fields depend on `type` and are the same as `data` in the webhook request for that type.
          example:
            message_uuid: 3a525ca2-6909-4c72-9399-905adf7f3a74
            from: '+14155550100'
            to: '+447537151866'
            template:
              name: order_shipped
              language: en_US
    WhatsAppEventListResponse:
      title: WhatsAppEventListResponse
      description: A paginated list of your account's WhatsApp events, returned by [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events).
      type: object
      additionalProperties: false
      required:
        - events
        - next_cursor
        - has_more
      properties:
        events:
          type: array
          description: Events in the order Wavix recorded them, oldest first. Empty when no event matches.
          items:
            $ref: '#/components/schemas/WhatsAppEvent'
        next_cursor:
          type:
            - string
            - 'null'
          description: ID of the last event on this page. Pass it as `after` to get the events that follow. Null when the page is empty; keep the cursor you have, or omit `after` if you have none.
          example: evt_1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a
        has_more:
          type: boolean
          description: '`true` when more events follow this page right now. `false` means you''ve caught up; events recorded later appear after the same cursor.'
          example: false
    CallStatusWebhook:
      title: CallStatusWebhook
      required:
        - direction
        - uuid
        - destination
        - duration
        - charge
        - date
        - disposition
        - from
        - to
        - per_minute
      type: object
      additionalProperties: false
      properties:
        direction:
          type: string
          description: Direction of the call. One of `inbound` (call received by the account) or `outbound` (call placed by the account).
          enum:
            - inbound
            - outbound
          example: outbound
        uuid:
          type: string
          description: Call ID
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        destination:
          type:
            - string
            - 'null'
          description: Destination of the call. For outbound calls, it contains the country name and, optionally, a mobile carrier or city name. For inbound calls, the destination includes the user-defined SIP trunk name, SIP URI, or PSTN number that the call is forwarded to.
          example: France
        duration:
          type: integer
          description: Duration of the call, in seconds
          format: int32
          example: 6
        charge:
          type: string
          description: Total charge for the call, in USD
          example: '0.822'
        date:
          type: string
          description: Date and time of the call
          format: date-time
          example: '2023-08-21T06:43:36.000Z'
        disposition:
          $ref: '#/components/schemas/CallDisposition'
        from:
          type:
            - string
            - 'null'
          description: ANI/From attribute of the call
          example: '14302287001'
        to:
          type:
            - string
            - 'null'
          description: DNIS/To attribute of the call
          example: '33170363950'
        per_minute:
          type: string
          description: Price per minute, in USD
          example: '0.027'
      description: Post-call webhook payload
    FileTranscriptionCompletedWebhook:
      title: FileTranscriptionCompletedWebhook
      required:
        - request_id
        - status
        - error
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          description: Transcription request ID
          example: e865ea07-25af-4fdd-876e-04b0d41d5ebd
        status:
          type: string
          description: Outcome of the transcription. One of `completed` (the transcript was produced) or `failed` (the transcription could not be produced).
          example: completed
        error:
          type:
            - string
            - 'null'
          description: A human-readable error description, if any
    CDRTranscriptionCompletedWebhook:
      title: CDRTranscriptionCompletedWebhook
      required:
        - uuid
        - status
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          description: Call UUID
          example: 99df5ffd-962a-410f-bcce-d08f1f7f328c
        status:
          type: string
          description: Outcome of the transcription. One of `completed` (the transcript was produced) or `failed` (the transcription could not be produced).
          enum:
            - completed
            - failed
          example: completed
    MessagesDeliveryReport:
      title: MessagesDeliveryReport
      required:
        - message_id
        - message_type
        - from
        - to
        - status
        - sent
        - segments_count
        - charge
        - carrier_fees
      type: object
      description: Message delivery report (DLR).
      additionalProperties: false
      properties:
        message_id:
          type: string
          description: Message ID.
          example: 871b4eeb-f798-4105-be23-32df9e991456
        message_type:
          type: string
          description: Type of message. Possible values are `sms`, `mms`.
          example: sms
        from:
          type: string
          description: Sender ID. Can be numeric or alphanumeric.
          example: Wavix
        to:
          type: string
          description: Destination phone number.
          example: '+447537151866'
        tag:
          type:
            - string
            - 'null'
          description: Tag to identify a group of messages, such as those associated with a campaign.
          example: Fall sale
        status:
          $ref: '#/components/schemas/MessageDeliveryStatus'
        segments_count:
          type: integer
          description: Number of message segments for SMS. For MMS, the value is always 1.
          format: int32
          example: 1
        sent:
          type:
            - string
            - 'null'
          description: Date and time the message was accepted in ISO 8601 format.
          format: date-time
          example: '2024-05-28T12:34:54Z'
        delivered:
          type:
            - string
            - 'null'
          description: Date and time when the final status was received in ISO 8601 format.
          format: date-time
          example: '2024-05-28T12:34:56Z'
        error:
          type:
            - string
            - 'null'
          description: Human-readable error description.
        charge:
          type: string
          description: Total charge for the message in USD.
          example: '0.01'
        carrier_fees:
          type: string
          description: Mobile carrier fees in USD.
          example: '0.0'
    InboundMessage:
      title: SMSorMMSmessage
      required:
        - message_id
        - from
        - to
        - message_body
        - received_at
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          description: Unique identifier of the message generated by the platform
          example: 871b4eeb-f798-4105-be23-32df9e991456
        from:
          type: string
          description: Sender ID used to send the message. Can be numeric or alphanumeric.
          example: Wavix
        to:
          type: string
          description: Phone number on the account that received the message.
          example: '447537151866'
        message_body:
          $ref: '#/components/schemas/MessageBody'
        received_at:
          type: string
          description: Timestamp the messages is received by Wavix
          format: date-time
          example: '2022-04-14T13:51:16.096Z'
      description: An inbound message
    BrandStatusUpdatedWebhook:
      type: object
      additionalProperties: false
      required:
        - brand_id
        - status
      properties:
        brand_id:
          type: string
          description: Unique identifier of the 10DLC Brand.
          example: BX12JH90
        status:
          type: string
          description: Current verification status of the 10DLC Brand. One of `SELF_DECLARED`, `UNVERIFIED`, `VERIFIED`, `VETTED_VERIFIED`, `REVIEW`, or `SUSPENDED`. `SELF_DECLARED` means the Brand registered without external verification; `UNVERIFIED` means verification has not yet succeeded; `VERIFIED` means the Brand passed standard verification; `VETTED_VERIFIED` means the Brand also passed third-party vetting; `REVIEW` means verification is in progress; `SUSPENDED` means the Brand is blocked from sending.
          enum:
            - SELF_DECLARED
            - UNVERIFIED
            - VERIFIED
            - VETTED_VERIFIED
            - REVIEW
            - SUSPENDED
          example: VERIFIED
    CampaignStatusUpdatedWebhook:
      type: object
      additionalProperties: false
      required:
        - campaign_id
        - brand_id
        - status
      properties:
        brand_id:
          type: string
          description: Unique identifier of a 10DLC Brand
          example: BX12JH90
        campaign_id:
          type: string
          description: Unique identifier of a 10DLC Campaign
          example: CX34KL56
        status:
          type: string
          description: |-
            Current status of the 10DLC Campaign. One of:

            - `REVIEW` — the campaign is under review.
            - `APPROVED` — the campaign was approved and can send.
            - `DECLINED` — the campaign was rejected during review.
            - `DELETED` — the campaign was removed.
            - `EXPIRED` — the campaign registration lapsed.
            - `SUSPENDED` — the campaign is blocked from sending.
            - `PORTED_OUT` — the campaign was migrated to another provider.
          enum:
            - REVIEW
            - APPROVED
            - DECLINED
            - DELETED
            - EXPIRED
            - SUSPENDED
            - PORTED_OUT
          example: APPROVED
    NumberStatusUpdatedWebhook:
      type: object
      additionalProperties: false
      required:
        - number
        - campaign_id
        - brand_id
        - status
      properties:
        brand_id:
          type: string
          description: 10DLC Brand ID.
          example: BX12JH90
        campaign_id:
          type: string
          description: 10DLC Campaign ID.
          example: CX34KL56
        number:
          type: string
          description: Phone number associated with a 10DLC Campaign.
          example: '17029641104'
        status:
          type: string
          description: Status of the phone number's assignment to the 10DLC Campaign. One of `APPROVED` (the number is registered to the campaign), `PENDING` (registration is in progress), or `REJECTED` (registration was declined).
          enum:
            - APPROVED
            - PENDING
            - REJECTED
          example: APPROVED
    WhatsAppInboundTextContent:
