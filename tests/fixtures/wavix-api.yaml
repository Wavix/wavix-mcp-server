        readOnly: true
        destructive: false
        openWorld: false
        expose: false
        toolset: messaging
      parameters:
        - name: media_uuid
          in: path
          required: true
          description: ID of the media, as returned in `id` of the media content of a `whatsapp.message.received` event or in `media_id` of a received message.
          schema:
            type: string
            format: uuid
          example: 7f3e2c1a-5b9d-4e8f-a1c3-2d4e6f8a0b1c
      responses:
        '200':
          description: The media file of the received message.
          headers:
