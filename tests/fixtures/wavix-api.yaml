        The address of the media is the `url` of a media content in a `whatsapp.message.received` event, and the `media_url` of a message from [List WhatsApp messages](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-messages) or [Retrieve a WhatsApp message](https://docs.wavix.com/api-reference/whatsapp/retrieve-a-whatsapp-message).

        **Behavior:** Returns the file itself, with its own media type in the `Content-Type` header. The file stays available at least as long as Wavix keeps the received message.

        **Requires:** Your account must have WhatsApp enabled, must have a subscription plan, and must not be blocked or suspended.
      operationId: whatsapp_media_download
      security:
        - bearerAuth:
            - whatsapp:read
      x-fern-sdk-group-name:
