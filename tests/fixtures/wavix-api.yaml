            Indicates whether the phone number belongs to an unallocated range.
             `null` if the phone number is invalid.
          example: false
        reachable:
          type:
            - boolean
            - 'null'
          description: Indicates whether the number is registered in a mobile network. Applies to mobile numbers only.  `null` if the phone number is invalid.
          example: true
        roaming:
          type:
            - boolean
            - 'null'
          description: |-
            Indicates whether the number is roaming. Applies to mobile numbers only.
             `null` if the phone number is invalid.
          example: false
        timezone:
          type:
            - string
            - 'null'
          description: Time zone identified based on the country and area code.  `null` if the phone number is invalid.
          example: UTC+04:00
        charge:
          type: string
          description: Charge for the validation.
          example: '0.015'
        error_code:
          type: string
          description: |-
            Result code for the validation. `000` indicates success. Possible values:
            - `013` — internal service error, uncategorized.
            - `021` — invalid phone number length or format.
            - `041` — remote timeout.
            - `042` — remote query failed.
            - `091` — insufficient funds.
          example: '000'
      description: Number validator response details.
    PhoneValidationBatchResponse:
      title: PhoneValidationBatchResponse
      required:
        - count
        - items
        - status
        - pending
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: Validation request status.
          example: success
        pending:
          type: integer
          description: Number of validations still in progress.
          example: 0
        count:
          type: integer
          format: int32
          description: Total number of phone numbers in the request.
          example: 1000
        items:
          type: array
          items:
            $ref: '#/components/schemas/PhoneValidationResultResponse'
          description: List of validation results for each phone number.
    NumberValidatorCreateBulkResponse:
      anyOf:
        - $ref: '#/components/schemas/PhoneValidationBatchResponse'
        - type: object
          title: Async Request
          description: Returned when validation runs asynchronously; poll results using `request_id`.
          properties:
            request_id:
              type: string
              description: Request ID. Use to poll validation results when `async` is `true`.
              example: 15323ba4-80c1-41be-b8e7-07bb435c7445
    PhoneValidationBatchResultResponse:
      title: PhoneValidationBatchResultResponse
      required:
        - status
        - pending
        - count
        - items
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: |-
            Request status. Possible values are `success` and `in progress`.

            - `success`: All numbers were processed. - `in progress`: Several numbers are pending validation.
          example: success
        pending:
          type: integer
          description: The quantity of phone numbers that are pending to be processed.
          format: int32
          example: 10
        count:
          type: integer
          description: The quantity of phone numbers passed in the request.
          format: int32
          example: 1000
        items:
          type: array
          items:
            $ref: '#/components/schemas/PhoneValidationResultResponse'
          description: |-
            Array of objects containing details for each phone number.
             The returned fields depend on the `type` parameter.
          example:
            - phone_number: '971501390098'
              valid: true
              country_code: AE
              e164_format: '+971501390098'
              national_format: 050 139 0098
              ported: false
              mcc: '424'
              mnc: '02'
              number_type: mobile
              carrier_name: Etisalat
              risky_destination: false
              unallocated_range: false
              reachable: true
              roaming: false
              timezone: UTC+04:00
              charge: '0.015'
              error_code: '000'
            - phone_number: '971504359195'
              valid: true
              country_code: AE
              e164_format: '+971504359195'
              national_format: 050 435 9195
              ported: false
              mcc: '424'
              mnc: '02'
              number_type: mobile
              carrier_name: Etisalat
              risky_destination: false
              unallocated_range: false
              reachable: true
              roaming: false
              timezone: UTC+04:00
              charge: '0.015'
              error_code: '000'
