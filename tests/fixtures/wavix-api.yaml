  /v1/whatsapp/messages:
    post:
      tags:
        - WhatsApp
      summary: Send a WhatsApp message
      description: |-
        Sends a WhatsApp message from one of your registered senders to a recipient, and returns the message with its ID.

        A message is either a template, named in `template`, or free-form, given in `content`. Send exactly one of the two. A template can be sent at any time. A free-form message can be sent only while the 24-hour service window of the recipient is open, that is, within 24 hours of the last message the recipient sent to the sender. A message sent with `content` is charged at the service rate. A template message is charged at its category's rate, inside the window too.

        **Behavior:** Returns `201` with the new message. Poll `whatsapp_messages_get` for the delivery outcome. A repeat send with the same `idempotency_key` returns `200` with the original message and sends nothing. Returns `422` when `content` is sent and the service window is closed. The response then carries `service_window_closed_at`.

        **Requires:** Your account must have WhatsApp and its sending capability enabled, must have a subscription plan, and must not be blocked or suspended. `from` must be a sender registered on your account.
      operationId: whatsapp_messages_send
      security:
        - bearerAuth:
            - whatsapp:write
      x-fern-sdk-group-name:
        - whatsapp
        - messages
      x-fern-sdk-method-name: send
      x-fern-ignore: true
      x-mcp:
        readOnly: false
        destructive: true
        openWorld: true
        expose: true
        toolset: messaging
      parameters: []
      requestBody:
        description: Attributes of the message to send.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMessageSendRequest'
            examples:
              default:
                summary: Shipment notification from a template
                value:
                  from: '+14155550100'
                  to: '+447537151866'
                  idempotency_key: order-1001-shipped
                  template:
                    name: order_shipped
                    language: en_US
                    placeholders:
                      - Maria
                      - '#1001'
              content:
                summary: Free-form text inside the service window
                value:
                  from: '+14155550100'
                  to: '+447537151866'
                  idempotency_key: order-1001-reply
                  content:
                    type: text
                    text: Your order ships tomorrow morning.
        required: true
      responses:
        '200':
          description: The message created by the earlier send with the same `idempotency_key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageSendResponse'
              examples:
                default:
                  summary: Original message of a repeated send
                  value:
                    message:
                      uuid: 3a525ca2-6909-4c72-9399-905adf7f3a74
                      from: '+14155550100'
                      to: '+447537151866'
                      status: delivered
                      template:
                        name: order_shipped
                        language: en_US
                      created_at: '2026-01-15T10:30:00.123Z'
                      service_window_open_until: '2026-01-16T09:15:00.000Z'
        '201':
          description: The new message, with its `uuid` and initial status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageSendResponse'
              examples:
                default:
                  summary: New message
                  value:
                    message:
                      uuid: 3a525ca2-6909-4c72-9399-905adf7f3a74
                      from: '+14155550100'
                      to: '+447537151866'
                      status: sent
                      template:
                        name: order_shipped
                        language: en_US
                      created_at: '2026-01-15T10:30:00.123Z'
                      service_window_open_until: '2026-01-16T09:15:00.000Z'
        '400':
          description: The body is invalid. A required field is missing or unknown, `from` or `to` isn't a valid phone number, `idempotency_key` is longer than 128 characters or begins with `campaign:`, a `header` or `buttons` entry has a missing or unsupported field, both or neither of `template` and `content` are sent, or a `content` field is over its limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WhatsAppProblem'
              examples:
                invalid-request:
                  value:
                    type: https://docs.wavix.com/errors/invalid-request
                    title: Invalid Request
                    status: 400
                    detail: phone numbers must be 6-20 digits, with or without a leading +
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: INVALID_REQUEST
        '401':
          $ref: '#/components/responses/WhatsAppUnauthorizedResponse'
        '403':
          description: Returns when the API key doesn't have the scope the endpoint needs, the request isn't allowed for the account's region, or the sending capability is not enabled for the account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WhatsAppProblem'
              examples:
                capability-missing:
                  summary: The sending capability is not enabled
                  value:
                    type: https://docs.wavix.com/errors/capability-missing
                    title: Capability Missing
                    status: 403
                    detail: The sending capability is not enabled for this account.
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: CAPABILITY_MISSING
        '404':
          description: WhatsApp isn't available for your account or isn't enabled yet, or `from` doesn't match one of your senders.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WhatsAppProblem'
              examples:
                whatsapp-not-available:
                  summary: WhatsApp is not available for this account
                  value:
                    type: https://docs.wavix.com/errors/whatsapp-not-available
                    title: WhatsApp Not Available
                    status: 404
                    detail: WhatsApp is not available for this account.
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: WHATSAPP_NOT_AVAILABLE
                channel-not-enabled:
                  summary: WhatsApp is not enabled yet for this account
                  value:
                    type: https://docs.wavix.com/errors/channel-not-enabled
                    title: Channel Not Enabled
                    status: 404
                    detail: The WhatsApp channel is not enabled for this account.
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: CHANNEL_NOT_ENABLED
                sender-not-found:
                  summary: No sender matches `from`
                  value:
                    type: https://docs.wavix.com/errors/sender-not-found
                    title: Sender Not Found
                    status: 404
                    detail: no sender "14155550100" on channel "whatsapp"
                    instance: 3a525ca2-6909-4c72-9399-905adf7f3a74
                    error_class: permanent
                    error_code: SENDER_NOT_FOUND
        '422':
          description: The service window is closed. The recipient hasn't messaged this sender in the last 24 hours, so `content` can't be sent. Send a template instead.
          content:
