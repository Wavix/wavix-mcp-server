    FinancialTransaction:
      title: FinancialTransaction
      required:
        - id
        - date
        - amount
        - balance_after
        - details
        - status
        - type
        - show_invoice
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Transaction ID.
