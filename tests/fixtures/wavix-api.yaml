    WhatsAppTemplateComponentRequest:
      title: WhatsAppTemplateComponentRequest
      description: A header, body, footer, or buttons component of a new WhatsApp template. Consumed by `whatsapp_templates_create`. The `type` field selects the variant, and a `header` component is further selected by `format`.
      type: object
      required:
        - type
      oneOf:
        - $ref: '#/components/schemas/WhatsAppTemplateHeaderComponentRequest'
        - $ref: '#/components/schemas/WhatsAppTemplateBodyComponentRequest'
        - $ref: '#/components/schemas/WhatsAppTemplateFooterComponentRequest'
        - $ref: '#/components/schemas/WhatsAppTemplateButtonsComponentRequest'
      discriminator:
        propertyName: type
        mapping:
          header: '#/components/schemas/WhatsAppTemplateHeaderComponentRequest'
