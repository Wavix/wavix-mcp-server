    WhatsAppSenderPreviousAttributes:
      title: WhatsAppSenderPreviousAttributes
      description: Value that the changed attribute of a sender had before the change. It holds only that attribute — `quality_rating` for `whatsapp.sender.quality_changed`, and `status` for every other sender event.
      type: object
      additionalProperties: false
      required: []
      properties:
        status:
          type: string
          description: Sender registration status before the change. Takes the same values as `status`.
          enum:
            - banned
            - connected
            - deleted
            - disconnected
            - flagged
            - migrated
            - pending
            - rate_limited
            - restricted
            - unknown
            - unverified
          example: pending
        quality_rating:
          type:
            - string
            - 'null'
          description: Sender's quality rating before the change, or null when the provider hadn't reported one. Takes the same values as `quality_rating`.
          enum:
            - high
            - medium
            - low
            - unknown
            - null
          example: high
    WhatsAppSenderEventData:
      title: WhatsAppSenderEventData
      description: Data of a sender event. It carries the sender's status and quality rating after the change, and the previous value of the attribute that changed.
      type: object
      additionalProperties: false
      required:
        - phone_number
        - status
        - quality_rating
        - previous_attributes
      properties:
        phone_number:
          type: string
          description: Sender's phone number in E.164 format.
          example: '+14155550100'
        status:
          type: string
          description: |-
            Sender registration status after the change. Possible values:

            - `banned` — The provider banned the sender.
            - `connected` — The sender can send messages within its messaging limit.
            - `deleted` — The sender was deleted.
            - `disconnected` — The sender is disconnected from the provider.
            - `flagged` — The sender's quality rating dropped to low. The status returns to `connected` if the rating returns to medium or high within 7 days.
            - `migrated` — The sender was migrated.
            - `pending` — Registration with the provider is in progress.
            - `rate_limited` — The provider is rate limiting the sender.
            - `restricted` — The sender reached its messaging limit. It can't start new conversations until the 24-hour window resets, but it can still reply to customers who messaged it.
            - `unknown` — The provider hasn't reported a status.
            - `unverified` — The sender isn't verified.
          enum:
            - banned
            - connected
            - deleted
            - disconnected
            - flagged
            - migrated
            - pending
            - rate_limited
            - restricted
            - unknown
            - unverified
          example: connected
        quality_rating:
          type:
            - string
            - 'null'
          description: |-
            Sender's quality rating after the change, or null when the provider hasn't reported one. Meta rates quality from customer feedback over the past 7 days, such as blocks and reports. Possible values:

            - `high` — High quality.
            - `medium` — Medium quality.
            - `low` — Low quality.
            - `unknown` — Not rated yet, or the provider reported a rating that Wavix doesn't recognize.
          enum:
            - high
            - medium
            - low
            - unknown
            - null
          example: high
        previous_attributes:
          $ref: '#/components/schemas/WhatsAppSenderPreviousAttributes'
