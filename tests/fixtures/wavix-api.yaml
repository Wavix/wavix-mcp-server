  WhatsAppSenderChanged:
    post:
      summary: WhatsApp sender changed
      operationId: whatsapp_sender_changed
      security: []
      description: |-
        Wavix sends these events to your webhook of the `senders` group when the registration status or quality rating of one of your senders changes, so you learn that a sender is connected, restricted, or banned without polling it. Wavix reads the status and quality rating of senders from the provider every 15 minutes, so an event can arrive up to 15 minutes after the change. A test event you send to the webhook arrives here too.

        Each change is a separate event, and `type` names it, so your server keeps its copy of a sender's status and quality rating current.

        **Behavior:** Return a 2xx status within 10 seconds to acknowledge the event; Wavix doesn't follow redirects, so a 3xx response counts as a failed attempt. After a failed attempt, Wavix retries about 5 seconds, 30 seconds, 2 minutes, 10 minutes, 1 hour, 6 hours, and 24 hours later, up to 8 attempts in total; a `test` event isn't retried. Events can arrive more than once and out of order, so discard repeats by `id` and keep the state from the event with the latest `timestamp`.

        **Requires:** A webhook of the `senders` group. A disabled webhook gets only test events. Its URL must use `https`, have a valid TLS certificate, and resolve only to public addresses that Wavix allows. If the host resolves to another address at send time, Wavix doesn't send the event and doesn't retry it. Verify every request as the [Standard Webhooks](https://www.standardwebhooks.com/) specification describes, with one of its libraries or by hand. The `webhook-signature` and `webhook-timestamp` headers give the steps.

        **Limits:** [List WhatsApp events](https://docs.wavix.com/api-reference/whatsapp/list-whatsapp-events) keeps each event except `test` for 30 days, so you can catch up on events your server missed within that time.
      tags:
        - WhatsApp webhook payloads
      parameters:
        - $ref: '#/components/parameters/WhatsAppWebhookIdHeader'
        - $ref: '#/components/parameters/WhatsAppWebhookTimestampHeader'
        - $ref: '#/components/parameters/WhatsAppWebhookSignatureHeader'
      requestBody:
        required: true
        description: The event Wavix posts to your webhook URL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendersGroupEvent'
            examples:
              connected:
                summary: The sender finished registration
                value:
                  id: evt_9e1a3c5e7a9c4e1a3c5e7a9c1e3a5c7e
                  type: whatsapp.sender.connected
                  timestamp: '2026-10-21T09:20:10.000000Z'
                  data:
                    phone_number: '+14155550100'
                    status: connected
                    quality_rating: unknown
                    previous_attributes:
                      status: pending
              quality-changed:
                summary: The sender's quality rating dropped
                value:
                  id: evt_3c5e7a9c1e3a4c5e7a9c1e3a5c7e9a1c
                  type: whatsapp.sender.quality_changed
                  timestamp: '2026-10-23T11:05:33.000000Z'
                  data:
                    phone_number: '+14155550100'
                    status: connected
                    quality_rating: medium
                    previous_attributes:
                      quality_rating: high
              test:
                summary: Test event
                value:
                  id: evt_3f6c0f5e9b2a4d7c8e1f0a2b3c4d5e6f
                  type: test
                  timestamp: '2026-10-21T08:30:00.123456Z'
                  data:
                    webhook_id: 6f1c2a4e-8b3d-4c5e-9f70-1a2b3c4d5e6f
      responses:
        '200':
          description: Your server acknowledges the event. Any 2xx status counts as delivered.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Wavix API key. Pass as `Authorization: Bearer <api_key>`. Keys support per-resource scopes (none / read / write). See [Restricted keys and scopes](https://docs.wavix.com/api-reference/authentication#restricted-keys-and-scopes).
  schemas:
    ApiKeyScopePermission:
      type: object
      description: Permission level for an API key scope group.
      properties:
        allow:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: |-
            Permission level:
            - `none`: no access
            - `read`: GET only
            - `write`: all methods (includes read)
          example: read
    ApiKeyCallsScopePermission:
      type: object
      description: Permission level for the `calls` scope group.
      properties:
        allow:
          type: string
          enum:
            - none
            - read
            - write
          default: none
          description: |-
            Permission level:
            - `none`: no access
            - `read`: GET requests, `POST /v1/cdrs`
            - `write`: all methods (includes read)
          example: read
    ApiKeyBase:
      type: object
      description: Shared API key fields without the secret value.
      required:
        - id
        - label
        - active
        - restricted
        - permitted_ips
        - scopes_enabled
        - last_used_at
        - numbers
        - trunks
        - calls
        - messages
        - recordings
        - campaigns
        - two_fa
        - validator
        - webhooks
        - embeddable
        - billing
        - account
        - subaccounts
        - created_at
      properties:
        id:
          type: integer
          description: API key ID.
          example: 123
        label:
          type: string
          description: API key label.
          example: Production API Key
        active:
          type: boolean
          description: Indicates whether the API key is active.
          example: true
        restricted:
          type: boolean
          description: |-
            Indicates whether IP restrictions are enabled. When enabled,
             the API key works only from IP addresses in `permitted_ips`.
          example: true
        permitted_ips:
          type: array
          items:
            type: string
          description: |-
            List of permitted IP addresses. If `restricted` is false,
             an empty list means no IP restrictions. If `restricted` is true,
              an empty list prevents all requests.
          example:
            - 192.168.1.1
            - 10.0.0.1
        scopes_enabled:
          type: boolean
          description: |-
            When `true`, the key is restricted to the permissions defined in the
            scope fields below. When `false`, the key has full access.
          example: true
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of the most recent authenticated request made with this key.
          example: '2026-04-20T15:42:11Z'
        numbers:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyScopePermission'
            - type: 'null'
          description: View, buy, release, and configure phone numbers, browse inventory, and manage the cart.
        trunks:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyScopePermission'
            - type: 'null'
          description: View, create, update, and delete SIP trunks and their settings.
        calls:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyCallsScopePermission'
            - type: 'null'
          description: Access call records and active calls, and control live call actions such as starting, answering, ending, audio playback, DTMF, streaming, and transcription requests.
        messages:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyScopePermission'
            - type: 'null'
          description: Access message history and Sender IDs, send messages, manage opt-outs, and create or delete Sender IDs.
        recordings:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyScopePermission'
            - type: 'null'
          description: List, download, and delete call recordings.
        campaigns:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyScopePermission'
            - type: 'null'
          description: View campaign analytics and Sender ID or Brand status, schedule bulk voice or SMS campaigns, register Brands, and create short links.
        two_fa:
          anyOf:
            - $ref: '#/components/schemas/ApiKeyScopePermission'
            - type: 'null'
