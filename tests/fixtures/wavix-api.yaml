                    name: order_shipped
                    language: en_US
                    status: rejected
                    category: utility
                    quality_rating: unknown
                    previous_attributes:
                      status: pending
              test:
                summary: Test event
                value:
                  id: evt_3f6c0f5e9b2a4d7c8e1f0a2b3c4d5e6f
                  type: test
                  timestamp: '2026-10-21T08:30:00.123456Z'
                  data:
