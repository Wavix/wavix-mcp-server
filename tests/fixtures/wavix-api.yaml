    PhoneNumberValidationType:
      title: PhoneNumberValidationType
      enum:
        - format
        - analysis
        - validation
      type: string
      description: Depth of validation to perform on the phone number. One of `format` (checks number syntax only), `analysis` (returns number metadata such as type and country), or `validation` (performs a live network lookup of the number's current status).
    PhoneValidationResponse:
      title: PhoneValidationResponse
      required:
        - phone_number
        - valid
        - country_code
        - e164_format
        - national_format
        - charge
        - error_code
      type: object
      additionalProperties: false
      properties:
        phone_number:
          type: string
          description: Phone number.
          example: '971569483322'
        valid:
          type: boolean
          description: Indicates whether the phone number is valid.
          example: true
        country_code:
          type:
            - string
            - 'null'
          description: |-
            ISO 3166-1 alpha-2 country code of the phone number.
             `null` if the number is invalid.
          example: AE
        e164_format:
          type: string
          description: Phone number in international E.164 format.
          example: '+971569483322'
        national_format:
          type: string
          description: Phone number in the national format of the identified country.
          example: 056 948 3322
        ported:
          type:
            - boolean
            - 'null'
          description: Indicates whether the phone number was ported or not. `null` if the phone number is invalid.
          example: false
        mcc:
          type:
            - string
            - 'null'
          description: Mobile Country Code of the phone number carrier. For mobile phone numbers only. `null` if the phone number is invalid.
          example: '424'
        mnc:
          type:
            - string
            - 'null'
          description: Mobile Network Code of the phone number carrier. For mobile phone numbers only. `null` if the phone number is invalid
          example: '004'
        number_type:
          type:
            - string
            - 'null'
          description: Number type. Possible values are `mobile`, `landline`, or `toll-free`. `null` if the phone number is invalid.
          example: mobile
        carrier_name:
          type:
            - string
            - 'null'
          description: Name of the phone number carrier. `null` if the phone number is invalid.
          example: Etisalat
        risky_destination:
          type:
            - boolean
            - 'null'
          description: Indicates whether the phone number belongs to a number range associated with traffic pumping. `null` if the number is invalid.
          example: false
        unallocated_range:
          type:
            - boolean
            - 'null'
          description: Indicates whether the phone number belongs to an unallocated number range. `null` if the number is invalid
          example: false
        reachable:
          type:
            - boolean
            - 'null'
          description: Indicates whether the number is registered in a mobile network. For mobile phone numbers only. `null` if the number is invalid
          example: true
        roaming:
          type:
            - boolean
            - 'null'
          description: Indicates whether the number is roaming. For mobile phone numbers only. `null` if the number is invalid
          example: false
        timezone:
          type:
            - string
            - 'null'
          description: |-
            Time zone based on the phone number's country and area code.
             `null` if the number is invalid.
          example: UTC+04:00
        charge:
          type: string
          description: Charge for the validation.
          example: '0.015'
        error_code:
          type: string
          description: |-
            Error code for the request. `000` indicates success.
            Possible values:
            - `013`: — Internal service error
            - `021`: — Invalid phone number length or format
            - `041`: — Request timeout
            - `042`: — Request failed
            - `091`: — Insufficient funds
          example: '000'
    PhoneValidationRequest:
      title: PhoneValidationRequest
      required:
        - phone_numbers
        - type
      type: object
      additionalProperties: false
      properties:
