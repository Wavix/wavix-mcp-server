      summary: List call webhooks
      description: Returns the configured call webhooks for the authenticated account. Wavix sends POST callbacks for `on-call` and `post-call` events.
      operationId: call_webhooks_list
      security:
        - bearerAuth:
            - webhooks:read
      x-fern-sdk-group-name:
        - callWebhooks
      x-fern-sdk-method-name: list
      x-mcp:
        readOnly: true
        destructive: false
        openWorld: false
        expose: true
        toolset: voice_config
      parameters: []
      responses:
        '200':
          description: Returns the list of call webhooks.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallWebhookListResponse'
              examples:
                default:
                  value:
                    - event_type: post-call
                      url: https://you-site.com/voice/post-call/webhook
                    - event_type: on-call
                      url: https://you-site.com/voice/on-call/webhook
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
      deprecated: false
    post:
      tags:
        - Call webhooks
      summary: Create a call webhook
      description: |-
        Registers a callback URL for the `on-call` or `post-call` event. Wavix sends a POST callback to the URL when the event occurs. Creates persistent configuration that forwards call metadata to the URL on every matching call until the webhook is deleted.

        **Behavior:** Without `expected_url`, the webhook is set to `url` whatever it was before. With `expected_url`, the webhook is set only while it currently has that URL; an empty string matches an unset webhook. Otherwise the call returns `409` and the webhook is unchanged. Setting the URL the webhook already has succeeds. If the call returns a `Something went wrong` error, the webhook is unchanged and you can retry the request.
      operationId: call_webhooks_create
      security:
        - bearerAuth:
            - webhooks:write
      x-fern-sdk-group-name:
        - callWebhooks
      x-fern-sdk-method-name: create
      x-mcp:
        readOnly: false
        destructive: true
        openWorld: true
        expose: true
        toolset: voice_config
      parameters: []
      requestBody:
        description: Attributes for the new call webhook.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallWebhooksCreateRequest'
        required: true
      responses:
        '201':
          description: Returns the created call webhook.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallWebhook'
              examples:
                default:
                  value:
                    success: true
                    event_type: post-call
                    url: https://you-site.com/webhook
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '409':
          $ref: '#/components/responses/WebhookInUseErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
      deprecated: false
    delete:
      tags:
        - Call webhooks
      summary: Delete a call webhook
      description: |-
        Removes the call webhook for the given event type. Wavix stops sending callbacks for that event.

        **Behavior:** Without `expected_url`, the webhook is cleared whatever URL it has. With `expected_url`, the webhook is cleared only while it currently has that URL; an empty value matches an unset webhook. Otherwise the call returns `409` and the webhook is unchanged. Clearing an unset webhook succeeds. Percent-encode the `expected_url` value in the query string. If the call returns a `Something went wrong` error, the webhook is unchanged and you can retry the request.
      operationId: call_webhooks_delete
      security:
        - bearerAuth:
            - webhooks:write
      x-fern-sdk-group-name:
        - callWebhooks
      x-fern-sdk-method-name: delete
      x-mcp:
        readOnly: false
        destructive: true
        openWorld: false
        expose: true
        toolset: voice_config
      parameters:
        - name: event_type
          in: query
          description: Event type of the webhook to delete. One of `post-call` (callbacks sent after a call ends) or `on-call` (real-time call status callbacks during a call).
          required: true
          style: form
          explode: true
          schema:
            type: string
            enum:
              - post-call
              - on-call
            example: post-call
        - name: expected_url
          in: query
          description: Clears the webhook only if it currently has this URL. Percent-encode the value. An empty value clears only an unset webhook.
          required: false
          style: form
          explode: true
          schema:
            type: string
            example: https://your-site.com/webhook
      responses:
        '200':
          description: Returns a success confirmation. The call webhook is removed.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                default:
                  value:
                    success: true
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/ForbiddenErrorResponse'
        '409':
          $ref: '#/components/responses/WebhookInUseErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
      deprecated: false
