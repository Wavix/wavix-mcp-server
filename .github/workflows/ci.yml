name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Tests
        run: pytest

  tools-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Regenerate TOOLS.md and README, fail on drift
        run: |
          python scripts/generate_tools_md.py
          if ! git diff --quiet TOOLS.md README.md; then
            echo "::error::TOOLS.md or README.md is out of date. Run 'python scripts/generate_tools_md.py' and commit."
            git --no-pager diff TOOLS.md README.md
            exit 1
          fi
          echo "TOOLS.md and README.md are in sync with the Wavix OpenAPI spec."

  validate-server-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jsonschema
      - name: Validate server.json against MCP Registry schema
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          from jsonschema import Draft7Validator, RefResolver

          with open("server.json") as f:
              doc = json.load(f)
          with urllib.request.urlopen(doc["$schema"]) as r:
              schema = json.load(r)

          resolver = RefResolver.from_schema(schema)
          errors = list(Draft7Validator(schema, resolver=resolver).iter_errors(doc))
          if errors:
              for e in errors:
                  path = ".".join(str(p) for p in e.absolute_path) or "<root>"
                  print(f"[{path}] {e.message}")
              sys.exit(1)
          print("server.json valid")
          PY
      - name: Version files and changelog agree
        run: python scripts/release_check.py

  build-and-push-image:
    name: Build & Push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: [test, tools-drift, validate-server-json]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, tools-drift, validate-server-json, build-and-push-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release the version on main
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          version=$(python scripts/release_check.py --version)
          python scripts/release_check.py --notes > notes.md
          git fetch --tags --force
          mapfile -t tags < <(git tag -l 'v*')
          rc=0
          python scripts/release_check.py --newer "$version" "${tags[@]}" || rc=$?
          case "$rc" in
            0|3) ;;
            *) echo "::error::release check refused $version"; exit 1 ;;
          esac

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          has_image() {
            local out
            if out=$(docker buildx imagetools inspect "$image:$version" 2>&1); then return 0; fi
            if grep -qE ': not found$|manifest unknown' <<<"$out"; then return 1; fi
            echo "$out" >&2
            echo "::error::cannot read $image:$version"
            exit 1
          }
          image_revision() {
            local out
            out=$(docker buildx imagetools inspect "$image:$version" --format '{{ json .Image }}') || {
              echo "::error::cannot read the labels of $image:$version" >&2
              exit 1
            }
            python -c '
          import json, sys
          d = json.load(sys.stdin)
          images = [d] if "config" in d else list(d.values())
          revs = {(i.get("config", {}).get("Labels") or {}).get("org.opencontainers.image.revision", "") for i in images}
          print(revs.pop() if len(revs) == 1 else "")
          ' <<<"$out"
          }
          registry_has() {
            local doc r=0
            doc=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/io.github.Wavix%2Fmcp/versions") || {
              echo "::error::cannot read the Registry"
              exit 1
            }
            python scripts/release_check.py --registry-has "$version" <<<"$doc" || r=$?
            case "$r" in 0) return 0 ;; 1) return 1 ;; *) echo "::error::cannot read the Registry"; exit 1 ;; esac
          }

          tagged=$(git rev-list -n 1 "v$version" 2>/dev/null || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            missing=""
            has_image || missing="$missing GHCR"
            registry_has || missing="$missing Registry"
            if [ -z "$missing" ]; then echo "release: v$version is already out"; exit 0; fi
            echo "::error::v$version is tagged on $tagged but missing from:$missing"
            exit 1
          fi

          if has_image; then
            commit=$(image_revision)
            if ! git cat-file -e "${commit:-none}^{commit}" 2>/dev/null; then
              echo "::error::$image:$version has no usable revision label (${commit:-empty})"
              exit 1
            fi
          else
            docker buildx imagetools create -t "$image:$version" "$image:sha-${GITHUB_SHA::7}"
            commit="$GITHUB_SHA"
          fi

          if ! registry_has; then
            curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi

          if [ -z "$tagged" ]; then
            git tag "v$version" "$commit"
            git push origin "v$version"
          fi
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" --verify-tag --title "v$version" --notes-file notes.md
          fi
